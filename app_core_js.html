/**

function showAlert(message, type = 'info') {
    try {
        type = type || 'info';
        const alertClass = `alert-${type}`;

        const alertHtml = `
            <div class="alert alert-custom ${alertClass}" style="position: fixed; top: 100px; right: 20px; z-index: 9999; min-width: 300px; animation: slideIn 0.3s ease;">

                <div>
                    <strong>${type.toUpperCase()}</strong>
                    <p style="margin: 5px 0 0 0; font-size: 0.9rem;">${message}</p>
                </div>
            </div>
        `;

        const alertContainer = document.createElement('div');
        alertContainer.innerHTML = alertHtml;
        document.body.appendChild(alertContainer.firstElementChild);

        setTimeout(() => {
            const alert = document.body.lastElementChild;
            if (alert && alert.classList.contains('alert-custom')) {
                alert.style.opacity = '0';
                alert.style.transition = 'opacity 0.3s ease';
                setTimeout(() => alert.remove(), 300);
            }
        }, 3000);

        console.log(`[${type.toUpperCase()}] ${message}`);
    } catch (e) {
        console.error('❌ Error mostrando alerta:', e.message);
    }
}

function cleanTextUpper(text) {
    if (!text) return '';
    return String(text)
        .toUpperCase()
        .normalize('NFD')
        .replace(/[̀-ͯ]/g, '')
        .trim();
}

// ✅ SEC-P1: escapa HTML antes de interpolar texto libre de usuario (OBSERVACIONES,
// SITUACIONES ESPECIALES, etc.) en innerHTML/insertAdjacentHTML — previene XSS almacenado.
function escapeHtml(text) {
    if (text === null || text === undefined) return '';
    return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function parseDateRobust(dateStr) {
    if (!dateStr || String(dateStr).trim() === "") return '2099-12-31';

    if (dateStr instanceof Date) {
        // Manejar fechas nativas para que no se corran por zona horaria
        const offset = dateStr.getTimezoneOffset() * 60000;
        const localDate = new Date(dateStr.getTime() - offset);
        return localDate.toISOString().split('T')[0];
    }

    let s = String(dateStr).toLowerCase().trim().replace(/\./g, '');

    if (s.match(/^\d{4}-\d{2}-\d{2}$/)) return s;

    let ddmmMatch = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
    if (ddmmMatch) {
        let d = ddmmMatch[1].padStart(2, '0');
        let m = ddmmMatch[2].padStart(2, '0');
        let y = ddmmMatch[3];
        if (y.length === 2) y = "20" + y;
        return `${y}-${m}-${d}`;
    }

    let foundYear = null;
    let yearMatch = s.match(/(20\d{2})/);
    if (yearMatch) {
        foundYear = yearMatch[1];
    } else {
        let shortMatch = s.match(/[-/\s](\d{2})$/);
        if(shortMatch) foundYear = "20" + shortMatch[1];
    }

    if (!foundYear) return '2099-12-31';

    // Super-atrapador de Trimestres (Atrapa T4, 4 trimestre, Trimestre 4)
    let t = null;
    let trimMatch1 = s.match(/(\d)\s*trimestre/);
    let trimMatch2 = s.match(/trimestre\s*(\d)/);
    let trimMatch3 = s.match(/t(\d)/);

    if (trimMatch1) t = parseInt(trimMatch1[1]);
    else if (trimMatch2) t = parseInt(trimMatch2[1]);
    else if (trimMatch3) t = parseInt(trimMatch3[1]);

    if (t !== null && t >= 1 && t <= 4) {
        if (t === 1) return `${foundYear}-03-31`;
        if (t === 2) return `${foundYear}-06-30`;
        if (t === 3) return `${foundYear}-09-30`;
        if (t === 4) return `${foundYear}-12-31`;
    }

    const meses = {
        'ene': '01', 'feb': '02', 'mar': '03', 'abr': '04', 'may': '05', 'jun': '06',
        'jul': '07', 'ago': '08', 'sep': '09', 'oct': '10', 'nov': '11', 'dic': '12'
    };

    let foundMonth = null;
    for (const [key, val] of Object.entries(meses)) {
        if (s.includes(key)) {
            foundMonth = val;
            break;
        }
    }

    if (foundMonth && foundYear) return `${foundYear}-${foundMonth}-28`;

    return '2099-12-31';
}

function parseMoneyRobust(cellValue) {
    if (!cellValue) return 0;

    let str = String(cellValue).trim();
    if (!isNaN(str) && str !== '') return parseFloat(str);

    str = str.replace(/[^\d.,]/g, '');
    if (!str) return 0;

    const lastCommaPos = str.lastIndexOf(',');
    const lastDotPos = str.lastIndexOf('.');

    let normalized = str;

    if (lastCommaPos > lastDotPos) {
        normalized = str.replace(/\./g, '').replace(',', '.');
    } else if (lastDotPos > lastCommaPos) {
        normalized = str.replace(/,/g, '');
    } else if (lastCommaPos === -1 && lastDotPos === -1) {
        normalized = str;
    } else if (lastCommaPos >= 0 && lastDotPos === -1) {
        normalized = str.replace(/,/g, '');
    }

    const result = parseFloat(normalized);
    return isNaN(result) ? 0 : result;
}

function copyToClipboard(text) {
    navigator.clipboard.writeText(text).then(() => {
        showToast('✅ Enlace copiado al portapapeles', 'success');
    }).catch(err => {
        console.error('Error copiando:', err);
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showToast('✅ Enlace copiado', 'success');
    });
}

    if (alreadyActive) {
        if (element) {
            $('.menu-item').removeClass('active');
            $(element).addClass('active');
        }
        return;
    }

    // Guardar estado antes de cambiar de página
    saveNavigationState();

    $('.page-section').removeClass('active');
    $('.menu-item').removeClass('active');
    $(targetSelector).addClass('active');
    if (element) $(element).addClass('active');

    console.log('📄 Navegando a: ' + pageId);

    // Si volvemos a la página de matriz, restaurar estado
    if (pageId === 'matriz') {
        setTimeout(() => {

// ✅ CONC-FE-05 (post-review): token de carga — loadDashboardData() se invoca
// desde ~7 sitios (filtros, refreshData, etc.) sin ningún guard previo. Sin este
// token, dos llamadas superpuestas pueden resolver fuera de orden y la más
// vieja pisaría el pintado Y el localStorage de la más nueva, dejando un dato
// incorrecto persistido como si fuera "confirmado" en la próxima carga.
let _dashboardLoadToken = 0;

const DASHBOARD_CACHE_DB_NAME = 'dashboard-cache-v1';
const DASHBOARD_CACHE_STORE_NAME = 'dashboard-cache-store';

function openDashboardCacheDb() {
  return new Promise((resolve, reject) => {
    if (!('indexedDB' in window)) {
      reject(new Error('IndexedDB no está disponible en este navegador.'));
      return;
    }

    const request = indexedDB.open(DASHBOARD_CACHE_DB_NAME, 1);

    request.onupgradeneeded = function() {
      const db = request.result;
      if (!db.objectStoreNames.contains(DASHBOARD_CACHE_STORE_NAME)) {
        db.createObjectStore(DASHBOARD_CACHE_STORE_NAME);
      }
    };

    request.onsuccess = function() {
      resolve(request.result);
    };

    request.onerror = function() {
      reject(request.error || new Error('No se pudo abrir la base de caché del tablero.'));
    };
  });
}

function readDashboardCache(cacheKey) {
  if (!cacheKey) return Promise.resolve(null);

  return openDashboardCacheDb().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(DASHBOARD_CACHE_STORE_NAME, 'readonly');
    const store = tx.objectStore(DASHBOARD_CACHE_STORE_NAME);
    const request = store.get(cacheKey);

    request.onsuccess = function() {
      const cached = request.result;
      resolve(cached && cached.response ? cached : null);
    };

    request.onerror = function() {
      reject(request.error || new Error('Fallo leyendo la caché IndexedDB del tablero.'));
    };
  })).catch(err => {
    console.warn('⚠️ No se pudo leer el caché del tablero en IndexedDB:', err.message);
    return null;
  });
}

function writeDashboardCache(cacheKey, payload) {
  if (!cacheKey) return Promise.resolve();

  return openDashboardCacheDb().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(DASHBOARD_CACHE_STORE_NAME, 'readwrite');
    const store = tx.objectStore(DASHBOARD_CACHE_STORE_NAME);
    const request = store.put({ response: payload, savedAt: Date.now() }, cacheKey);

    request.onsuccess = function() {
      resolve();
    };

    request.onerror = function() {
      reject(request.error || new Error('Fallo escribiendo la caché IndexedDB del tablero.'));
    };
  })).catch(err => {
    console.warn('⚠️ No se pudo escribir el caché del tablero en IndexedDB:', err.message);
  });
}

function loadDashboardData() {
  // ✅ CONC-FE-05: UI optimista aislada por usuario (TODOS.md ítem 11, cierra el
  // hueco dejado en FASE 5c). CURRENT_USER_EMAIL llega de forma SÍNCRONA desde
  // Index.html (inyectado server-side en doGet()), a diferencia de `currentUser`
  // (JS var de este archivo) que solo se puebla DESPUÉS de esta misma respuesta
  // — por eso la cache-key usa CURRENT_USER_EMAIL y nunca `currentUser`.
  //
  // Si el email no llegó (Session.getActiveUser().getEmail() puede devolver
  // '' en algunos contextos de auth), NO usamos LocalCache en absoluto —ni
  // lectura ni escritura— en vez de caer en una llave 'anon' compartida, que
  // filtraría datos entre usuarios distintos sin email en el mismo navegador.
  const hasReliableIdentity = typeof CURRENT_USER_EMAIL !== 'undefined' && !!CURRENT_USER_EMAIL;
  const cacheKey = hasReliableIdentity ? ('dashboardData_' + CURRENT_USER_EMAIL) : null;

  const loadToken = ++_dashboardLoadToken;
  let paintedFromCache = false;

  if (cacheKey) {
    readDashboardCache(cacheKey).then(cached => {
      if (loadToken !== _dashboardLoadToken) return;
      if (cached && cached.response) {
        onDataLoaded(cached.response);
        paintedFromCache = true;
      }
    }).catch(() => {});
  }

  // El pintado desde caché (si ocurrió) es siempre síncrono y termina antes de
  // que arranque esta llamada a red — la respuesta real del servidor solo puede
  // llegar DESPUÉS y siempre gana como último pintado, sin ventana de carrera
  // entre ambos renders.
  if (paintedFromCache) {
    showSyncingIndicator();
  } else {
    showDashboardSkeleton();
  }

  google.script.run.withSuccessHandler(response => {
    // Si otra llamada a loadDashboardData() arrancó después de esta, esta
    // respuesta ya es obsoleta — descartarla evita pisar un render/caché más
    // reciente con datos desordenados por latencia de red.
    if (loadToken !== _dashboardLoadToken) return;

    hideSyncingIndicator();

    if (!response.success) {
      if (!paintedFromCache) hideDashboardSkeleton();
      showAlert('Error: ' + response.message, 'warning');
      return;
    }

    try {
            currentUser = response.user || currentUser || 'Usuario';
            $('#user-display').text(currentUser);

      // ✅ Guardar filtro activo y lista COMPLETA de proyectos (para el admin)
      window.filtroMatrizActivoGlobal = response.filtroMatrizActivo ? JSON.parse(response.filtroMatrizActivo) : null;
      window.proyectosListaUnicaGlobal = response.allProyectos ? JSON.parse(response.allProyectos) : [];

      onDataLoaded(response);

      if (cacheKey) {
        writeDashboardCache(cacheKey, response).catch(() => {});
      }

      // Manejar visualmente el badge del Filtro Matriz
      const filtroActivo = window.filtroMatrizActivoGlobal;
      const filterBadge = document.getElementById('filterBadge');
      if (filtroActivo && filtroActivo.id) {
        if (filterBadge) filterBadge.innerHTML = `<span class="badge bg-info"><i class="fas fa-filter"></i> ${filtroActivo.nombre}</span>`;
      } else {
        if (filterBadge) filterBadge.innerHTML = '';
      }

    } catch (e) {
      console.error('Error parseando datos:', e);
      showAlert('Error procesando datos: ' + e.message, 'danger');
    }

  }).withFailureHandler(error => {
    if (loadToken !== _dashboardLoadToken) return;
    hideSyncingIndicator();
    if (!paintedFromCache) hideDashboardSkeleton();
    showAlert('Error cargando datos: ' + error, 'danger');
  }).getDashboardData();
}

function onDataLoaded(result) {

        allColsList = JSON.parse(result.columns);

/**
 * ✅ SPRINT6 [CONC-BE-12]: purga un valor de un store de IndexedDB por clave. Usado por
 * refreshData() para limpiar dashboard-cache-v1 y equipos-cache-v1 — self-contained (no
 * depende de que app_equipos_js.html ya se haya evaluado, aunque en la práctica todos los
 * <script> de Index.html ya están cargados antes de que el usuario pueda hacer clic).
 */
function purgarCacheIndexedDB(dbName, storeName, key) {
    return new Promise(function(resolve) {
        if (!('indexedDB' in window)) { resolve(); return; }
        const request = indexedDB.open(dbName, 1);
        request.onupgradeneeded = function() {
            const db = request.result;
            if (!db.objectStoreNames.contains(storeName)) db.createObjectStore(storeName);
        };
        request.onsuccess = function() {
            const db = request.result;
            if (!db.objectStoreNames.contains(storeName)) { resolve(); return; }
            const tx = db.transaction(storeName, 'readwrite');
            const store = tx.objectStore(storeName);
            store.delete(key);
            tx.oncomplete = function() { resolve(); };
            tx.onerror = function() { resolve(); };
        };
        request.onerror = function() { resolve(); };
    });
}

function limpiarStoreIndexedDB(dbName, storeName) {
    return new Promise(function(resolve) {
        if (!('indexedDB' in window)) { resolve(); return; }
        const request = indexedDB.open(dbName, 1);
        request.onupgradeneeded = function() {
            const db = request.result;
            if (!db.objectStoreNames.contains(storeName)) db.createObjectStore(storeName);
        };
        request.onsuccess = function() {
            const db = request.result;
            if (!db.objectStoreNames.contains(storeName)) { resolve(); return; }
            const tx = db.transaction(storeName, 'readwrite');
            tx.objectStore(storeName).clear();
            tx.oncomplete = function() { resolve(); };
            tx.onerror = function() { resolve(); };
        };
        request.onerror = function() { resolve(); };
    });
}

/**
 * ✅ SPRINT6 [CONC-BE-12]: "Recargar" pasa de "recargar" a "purgar y recargar". Antes solo
 * llamaba a loadDashboardData(), que podía devolver EXACTAMENTE los mismos datos: el caché
 * del servidor (CacheService, hasta 30 min de TTL) seguía vigente, y el pintado optimista de
 * loadDashboardData() repinta primero desde el mismo snapshot de IndexedDB antes de que
 * llegue la red. Ahora: (1) invalida TODO el caché server-side (dashboard + PAC + CacheStore),
 * (2) en paralelo limpia los stores de IndexedDB usados por tablero/equipos/exportes/
 * normalización, (3) solo entonces recarga — garantiza cache-miss real en todas las capas.
 */
function refreshData() {
    console.log('🔄 Recargando datos (purga completa server + IndexedDB)...');

    const hasReliableIdentity = typeof CURRENT_USER_EMAIL !== 'undefined' && !!CURRENT_USER_EMAIL;
    const dashboardKey = hasReliableIdentity ? ('dashboardData_' + CURRENT_USER_EMAIL) : null;
    const equiposKey = hasReliableIdentity ? ('equipos_cache_' + CURRENT_USER_EMAIL) : null;
    const normalizacionDashboardKey = hasReliableIdentity ? ('normalizacion_map_' + CURRENT_USER_EMAIL) : null;

    const purgaLocal = Promise.all([
        dashboardKey ? purgarCacheIndexedDB('dashboard-cache-v1', 'dashboard-cache-store', dashboardKey) : Promise.resolve(),
        normalizacionDashboardKey ? purgarCacheIndexedDB('dashboard-cache-v1', 'dashboard-cache-store', normalizacionDashboardKey) : Promise.resolve(),
        equiposKey ? purgarCacheIndexedDB('equipos-cache-v1', 'stats', equiposKey) : Promise.resolve(),
        limpiarStoreIndexedDB('export-cache-v1', 'snapshots'),
        limpiarStoreIndexedDB('normalizacion_ui_cache', 'normalizacion_map')
    ]);

    google.script.run
        .withSuccessHandler(function() {
            purgaLocal.then(function() {
                // ✅ FASE 5c: loadDashboardData() ya muestra su propio Skeleton Loader — el
                // overlay de página completa (#loader) aquí lo taparía por completo.
                loadDashboardData();
            });
        })
        .withFailureHandler(function(error) {
            console.warn('⚠️ No se pudo invalidar el caché del servidor, recargando de todas formas: ' + (error && error.message ? error.message : error));
            purgaLocal.then(function() {
                loadDashboardData();
            });
        })
        .invalidateAllCaches();
}
