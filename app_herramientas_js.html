<script>
(function() {
  const EXPORT_BATCH_SIZE = 1000;
  const INSTITUTION_HEADER = 'INSTITUTO DE DESARROLLO URBANO';

  function safeExportText(value) {
    if (value === null || value === undefined) return '';
    if (typeof value === 'string') return value.replace(/\r?\n/g, ' ').trim();
    if (typeof value === 'number' && !isFinite(value)) return '';
    return String(value).replace(/\r?\n/g, ' ').trim();
  }

  function formatExportValue(key, value) {
    const text = safeExportText(value);
    const normalizedKey = String(key || '').toUpperCase();

    if (!text) return '';
    if (/(VALOR|ESTIMADO|PAGADO|TOTAL|MONTO|COSTO)/.test(normalizedKey)) {
      const numeric = Number(String(text).replace(/[$.\s]/g, '').replace(',', '.'));
      if (!isNaN(numeric)) {
        return new Intl.NumberFormat('es-CO', {
          style: 'currency',
          currency: 'COP',
          maximumFractionDigits: 0
        }).format(numeric);
      }
      return text;
    }

    if (/(FECHA|DATE|FEC)/.test(normalizedKey)) {
      const date = new Date(text);
      if (!isNaN(date.getTime())) {
        return date.toLocaleDateString('es-CO');
      }
      return text;
    }

    return text;
  }

  function buildExportInstitutionHeader(options) {
    const safeOptions = options || {};
    const generatedAt = safeOptions.generatedAt || new Date();
    const title = safeOptions.title || 'REPORTE INSTITUCIONAL';
    const user = safeOptions.user || (typeof CURRENT_USER_EMAIL !== 'undefined' ? CURRENT_USER_EMAIL : 'Sistema');
    const filterLabel = safeOptions.filterLabel || 'Todos';
    return [
      INSTITUTION_HEADER,
      title,
      'Fecha de generación: ' + (generatedAt instanceof Date ? generatedAt.toLocaleString('es-CO') : String(generatedAt)),
      'Usuario: ' + user,
      'Filtro: ' + filterLabel
    ];
  }

  function normalizeExportRows(rows, columns) {
    const source = Array.isArray(rows) ? rows : [];
    const providedColumns = Array.isArray(columns) && columns.length ? columns : [];
    const fallbackHeaders = source.length ? Object.keys(source[0] || {}) : providedColumns;
    const headers = providedColumns.length ? providedColumns : fallbackHeaders;

    return {
      headers: headers.map(String),
      rows: source.map(function(row) {
        const item = row && typeof row === 'object' ? row : {};
        return headers.map(function(header) {
          const key = String(header);
          return item[key] !== undefined ? item[key] : (item[key.toLowerCase()] !== undefined ? item[key.toLowerCase()] : '');
        });
      })
    };
  }

  function buildCsvFromDataset(dataset, options) {
    const safeOptions = options || {};
    const data = Array.isArray(dataset) ? { headers: safeOptions.columns || Object.keys(dataset[0] || {}), rows: dataset } : dataset;
    const normalized = normalizeExportRows(Array.isArray(data && data.rows) ? data.rows : (Array.isArray(data) ? data : []), safeOptions.columns || (data && data.headers));
    const headers = normalized.headers.length ? normalized.headers : (safeOptions.columns || []);
    const lines = [];

    buildExportInstitutionHeader({
      generatedAt: safeOptions.generatedAt || new Date(),
      title: safeOptions.title || 'EXPORTACIÓN IDU',
      user: safeOptions.user || (typeof CURRENT_USER_EMAIL !== 'undefined' ? CURRENT_USER_EMAIL : 'Sistema'),
      filterLabel: safeOptions.filterLabel || 'Todos'
    }).forEach(function(row) {
      lines.push('"' + String(row).replace(/"/g, '""') + '"');
    });

    lines.push(headers.map(function(col) {
      return '"' + String(col).replace(/"/g, '""') + '"';
    }).join(';'));

    normalized.rows.forEach(function(row) {
      const values = row.map(function(value, idx) {
        const header = headers[idx] || '';
        return '"' + String(formatExportValue(header, value)).replace(/"/g, '""') + '"';
      });
      lines.push(values.join(';'));
    });

    return lines.join('\r\n');
  }

  function exportDatasetToCsv(dataset, options) {
    const exportPayload = typeof window.EXPORT_BACKEND !== 'undefined' && window.EXPORT_BACKEND && window.EXPORT_BACKEND.buildCsvExport
      ? window.EXPORT_BACKEND.buildCsvExport(dataset, options)
      : buildCsvFromDataset(dataset, options);
    return exportPayload;
  }

  function downloadCsvFromDataset(dataset, options) {
    const csv = exportDatasetToCsv(dataset, options || {});
    const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = (options && options.fileName) || ('reporte_' + new Date().toISOString().slice(0, 10) + '.csv');
    link.style.display = 'none';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(link.href);
  }

  function readIndexedExportSnapshot(key) {
    return new Promise(function(resolve) {
      if (!('indexedDB' in window)) return resolve(null);

      const request = indexedDB.open('export-cache-v1', 1);
      request.onupgradeneeded = function() {
        const db = request.result;
        if (!db.objectStoreNames.contains('snapshots')) {
          db.createObjectStore('snapshots');
        }
      };
      request.onsuccess = function() {
        const db = request.result;
        const tx = db.transaction('snapshots', 'readonly');
        const store = tx.objectStore('snapshots');
        const getRequest = store.get(key);
        getRequest.onsuccess = function() {
          resolve((getRequest.result && getRequest.result.payload) || null);
        };
        getRequest.onerror = function() {
          resolve(null);
        };
      };
      request.onerror = function() {
        resolve(null);
      };
    });
  }

  function writeIndexedExportSnapshot(key, payload) {
    return new Promise(function(resolve) {
      if (!('indexedDB' in window)) return resolve(false);

      const request = indexedDB.open('export-cache-v1', 1);
      request.onupgradeneeded = function() {
        const db = request.result;
        if (!db.objectStoreNames.contains('snapshots')) {
          db.createObjectStore('snapshots');
        }
      };
      request.onsuccess = function() {
        const db = request.result;
        const tx = db.transaction('snapshots', 'readwrite');
        const store = tx.objectStore('snapshots');
        store.put({ payload: payload, savedAt: Date.now() }, key);
        tx.oncomplete = function() { resolve(true); };
        tx.onerror = function() { resolve(false); };
      };
      request.onerror = function() {
        resolve(false);
      };
    });
  }

  function getExportDataSource() {
    return new Promise(function(resolve) {
      const rows = Array.isArray(window.currentData) && window.currentData.length ? window.currentData.slice() : [];
      if (rows.length) {
        resolve(rows);
        return;
      }

      const hasReliableIdentity = typeof CURRENT_USER_EMAIL !== 'undefined' && !!CURRENT_USER_EMAIL;
      if (!hasReliableIdentity || typeof window.readDashboardCache !== 'function') {
        resolve([]);
        return;
      }

      const cacheKey = 'dashboardData_' + CURRENT_USER_EMAIL;
      window.readDashboardCache(cacheKey).then(function(cached) {
        if (cached && cached.response && Array.isArray(cached.response.data)) {
          resolve(cached.response.data);
          return;
        }
        if (cached && cached.response && Array.isArray(cached.response.rows)) {
          resolve(cached.response.rows);
          return;
        }
        resolve([]);
      }).catch(function() {
        resolve([]);
      });
    });
  }

  function buildExportOptions(title, extension) {
    const user = typeof CURRENT_USER_EMAIL !== 'undefined' ? CURRENT_USER_EMAIL : 'Sistema';
    const filterLabel = window.filtroMatrizActivoGlobal ? (window.filtroMatrizActivoGlobal.nombre || 'Filtro activo') : 'Todos';
    return {
      title: title || 'MATRIZ FILTRADA',
      filterLabel: filterLabel,
      fileName: 'matriz_filtrada_' + new Date().toISOString().slice(0, 10) + extension,
      user: user,
      generatedAt: new Date()
    };
  }

  function triggerDownload(csvText, fileName) {
    const blob = new Blob(['\ufeff' + csvText], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = fileName;
    link.style.display = 'none';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(link.href);
  }

  function handleExportCsv() {
    getExportDataSource().then(function(rows) {
      const options = buildExportOptions('MATRIZ FILTRADA', '.csv');
      const csvText = exportDatasetToCsv(rows, options);
      triggerDownload(csvText, options.fileName);
      if (typeof window.showNotification === 'function') {
        window.showNotification('Éxito', 'CSV exportado correctamente', 'success');
      }
    }).catch(function(error) {
      console.error('❌ Error exportando CSV:', error);
      if (typeof window.showNotification === 'function') {
        window.showNotification('Error', 'No fue posible exportar el CSV', 'danger');
      }
    });
  }

  function handleExportExcel() {
    getExportDataSource().then(function(rows) {
      const options = buildExportOptions('MATRIZ FILTRADA', '.xlsx');
      const csvText = exportDatasetToCsv(rows, options);
      triggerDownload(csvText, options.fileName.replace(/\.xlsx$/i, '.csv'));
      if (typeof window.showNotification === 'function') {
        window.showNotification('Éxito', 'Excel exportado correctamente', 'success');
      }
    }).catch(function(error) {
      console.error('❌ Error exportando Excel:', error);
      if (typeof window.showNotification === 'function') {
        window.showNotification('Error', 'No fue posible exportar la hoja Excel', 'danger');
      }
    });
  }

  function attachExportButtons() {
    const excelBtn = document.getElementById('btnExportarExcel');
    const csvBtn = document.getElementById('btnExportarCSV');

    if (excelBtn) {
      excelBtn.addEventListener('click', handleExportExcel);
    }

    if (csvBtn) {
      csvBtn.addEventListener('click', handleExportCsv);
    }
  }

  function triggerBase64Download(base64, fileName, mimeType) {
    const byteChars = atob(base64);
    const byteNumbers = new Array(byteChars.length);
    for (let i = 0; i < byteChars.length; i++) {
      byteNumbers[i] = byteChars.charCodeAt(i);
    }
    const blob = new Blob([new Uint8Array(byteNumbers)], { type: mimeType || 'application/pdf' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = fileName;
    link.style.display = 'none';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(link.href);
  }

  function getAlertasForRt(rt) {
    const resumen = window.alertasResumenActivo;
    const items = resumen && Array.isArray(resumen.alertas) ? resumen.alertas : [];
    const rtNormalizado = String(rt || '').toUpperCase().trim();
    if (!rtNormalizado) return [];
    return items.filter(function(item) {
      return String(item.RT || '').toUpperCase().trim() === rtNormalizado;
    });
  }

  function getPredioSourceRows() {
    return new Promise(function(resolve) {
      const rows = Array.isArray(window.currentData) && window.currentData.length ? window.currentData
                 : (Array.isArray(window.rawData) && window.rawData.length ? window.rawData : []);
      if (rows.length) {
        resolve(rows);
        return;
      }

      const hasReliableIdentity = typeof CURRENT_USER_EMAIL !== 'undefined' && !!CURRENT_USER_EMAIL;
      if (!hasReliableIdentity || typeof window.readDashboardCache !== 'function') {
        resolve([]);
        return;
      }

      const cacheKey = 'dashboardData_' + CURRENT_USER_EMAIL;
      window.readDashboardCache(cacheKey).then(function(cached) {
        if (cached && cached.response && Array.isArray(cached.response.data)) {
          resolve(cached.response.data);
          return;
        }
        if (cached && cached.response && Array.isArray(cached.response.rows)) {
          resolve(cached.response.rows);
          return;
        }
        resolve([]);
      }).catch(function() {
        resolve([]);
      });
    });
  }

  function findPredioRow(rt) {
    const rtNormalizado = String(rt || '').toUpperCase().trim();
    return getPredioSourceRows().then(function(rows) {
      return rows.find(function(row) {
        return String((row && row[C.RT]) || '').toUpperCase().trim() === rtNormalizado;
      }) || null;
    });
  }

  function buildFichaPredialData(row) {
    return {
      RT: row[C.RT],
      PROYECTO: row[C.PROYECTO],
      TRAMO: row[C.TRAMO],
      ESTADO: row[C.ESTADO],
      DISPONIBILIDAD: row[C.DISP],
      VALOR_ESTIMADO: row[C.EST],
      VALOR_PAGADO: row[C.PAG],
      FECHA_ACTUALIZACION: row[C.FECHA],
      OBSERVACIONES: row[C.OBS],
      ALERTAS: getAlertasForRt(row[C.RT])
    };
  }

  function buildPdfMetadata() {
    return {
      user: typeof CURRENT_USER_EMAIL !== 'undefined' ? CURRENT_USER_EMAIL : 'Sistema',
      generatedAt: new Date().toISOString()
    };
  }

  function ensureModal(id, titleHtml, bodyId) {
    let modal = document.getElementById(id);
    if (modal) return modal;

    const modalHtml =
      '<div class="modal fade" id="' + id + '" tabindex="-1" aria-hidden="true">' +
        '<div class="modal-dialog modal-dialog-centered">' +
          '<div class="modal-content border-0 shadow-lg">' +
            '<div class="modal-header bg-dark text-white">' +
              '<h5 class="modal-title">' + titleHtml + '</h5>' +
              '<button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>' +
            '</div>' +
            '<div class="modal-body text-center p-4" id="' + bodyId + '"></div>' +
          '</div>' +
        '</div>' +
      '</div>';

    const wrapper = document.createElement('div');
    wrapper.innerHTML = modalHtml;
    document.body.appendChild(wrapper.firstElementChild);
    return document.getElementById(id);
  }

  function showPdfProgress(id, titleHtml, bodyId, message) {
    ensureModal(id, titleHtml, bodyId);
    const body = document.getElementById(bodyId);
    if (body) {
      body.innerHTML = '<div class="spinner-border text-primary mb-2" role="status"></div><div>' + message + '</div>';
    }
    const modalInst = bootstrap.Modal.getOrCreateInstance(document.getElementById(id));
    modalInst.show();
    return modalInst;
  }

  function showPdfResult(bodyId, result, fallbackFileName) {
    const body = document.getElementById(bodyId);
    if (!body) return;
    if (result && result.success) {
      triggerBase64Download(result.base64, result.fileName || fallbackFileName, result.mimeType || 'application/pdf');
      body.innerHTML = '<i class="fas fa-file-pdf fa-2x text-success mb-2"></i><div>PDF generado: <strong>' + (result.fileName || fallbackFileName) + '</strong></div>';
      if (typeof window.showNotification === 'function') {
        window.showNotification('Éxito', 'PDF generado y descargado correctamente', 'success');
      }
    } else {
      body.innerHTML = '<i class="fas fa-triangle-exclamation fa-2x text-danger mb-2"></i><div>' + ((result && result.error) || 'No fue posible generar el PDF.') + '</div>';
      if (typeof window.showNotification === 'function') {
        window.showNotification('Error', (result && result.error) || 'No fue posible generar el PDF', 'danger');
      }
    }
  }

  /**
   * Handler del botón "Generar Ficha PDF". Acepta el objeto de fila ya resuelto
   * (acción de fila en la tabla de detalle / búsqueda de RT) o, si se le pasa un
   * string, lo resuelve por RT contra currentData/rawData/IndexedDB.
   */
  function handleGenerarFichaPredial(predioData) {
    const resolver = (predioData && typeof predioData === 'object')
      ? Promise.resolve(predioData)
      : findPredioRow(predioData);

    resolver.then(function(row) {
      if (!row) {
        if (typeof window.showNotification === 'function') {
          window.showNotification('Error', 'Predio no encontrado en los datos cargados.', 'danger');
        }
        return;
      }

      const rt = row[C.RT];
      showPdfProgress('modalFichaPredial', '<i class="fas fa-id-card"></i> Ficha Predial', 'modalFichaPredialBody', 'Generando ficha predial en PDF...');

      google.script.run
        .withSuccessHandler(function(result) {
          showPdfResult('modalFichaPredialBody', result, 'Ficha_Predial_' + rt + '.pdf');
        })
        .withFailureHandler(function(error) {
          showPdfResult('modalFichaPredialBody', { success: false, error: error.message || String(error) }, 'Ficha_Predial_' + rt + '.pdf');
        })
        .generarFichaPredialPdfBackend(buildFichaPredialData(row), buildPdfMetadata());
    });
  }

  /**
   * Handler del botón "Generar Reporte PDF" del modal de alertas activas.
   * Lee window.alertasResumenActivo (ya cargado por onDataLoaded, tope MAX_ALERTAS_PAYLOAD=100).
   */
  function handleGenerarReporteAlertas() {
    const resumen = window.alertasResumenActivo;
    const alertas = resumen && Array.isArray(resumen.alertas) ? resumen.alertas : [];

    showPdfProgress('modalFichaPredial', '<i class="fas fa-triangle-exclamation"></i> Reporte de Alertas', 'modalFichaPredialBody', 'Generando reporte de alertas en PDF...');

    google.script.run
      .withSuccessHandler(function(result) {
        showPdfResult('modalFichaPredialBody', result, 'Reporte_Alertas.pdf');
      })
      .withFailureHandler(function(error) {
        showPdfResult('modalFichaPredialBody', { success: false, error: error.message || String(error) }, 'Reporte_Alertas.pdf');
      })
      .generarReporteAlertasPdfBackend(alertas, buildPdfMetadata());
  }

  window.handleGenerarFichaPredial = handleGenerarFichaPredial;
  window.handleGenerarReporteAlertas = handleGenerarReporteAlertas;

  window.appHerramientas = {
    EXPORT_BATCH_SIZE: EXPORT_BATCH_SIZE,
    buildExportInstitutionHeader: buildExportInstitutionHeader,
    buildCsvFromDataset: buildCsvFromDataset,
    exportDatasetToCsv: exportDatasetToCsv,
    downloadCsvFromDataset: downloadCsvFromDataset,
    readIndexedExportSnapshot: readIndexedExportSnapshot,
    writeIndexedExportSnapshot: writeIndexedExportSnapshot,
    exportCurrentMatrixCsv: handleExportCsv,
    exportCurrentMatrixExcel: handleExportExcel,
    attachExportButtons: attachExportButtons,
    handleGenerarFichaPredial: handleGenerarFichaPredial,
    handleGenerarReporteAlertas: handleGenerarReporteAlertas
  };

  window.buildExportInstitutionHeader = buildExportInstitutionHeader;
  window.buildCsvFromDataset = buildCsvFromDataset;
  window.exportDatasetToCsv = exportDatasetToCsv;
  window.downloadCsvFromDataset = downloadCsvFromDataset;
  window.exportCurrentMatrixCsv = handleExportCsv;
  window.exportCurrentMatrixExcel = handleExportExcel;

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', attachExportButtons);
  } else {
    attachExportButtons();
  }
})();
</script>
