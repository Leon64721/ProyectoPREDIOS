<script>
(function() {
  const EQUIPOS_ROLES_CON_ACCESO = ['Administrador', 'Articulador', 'Gestor'];
  const EQUIPOS_IDB_NAME = 'equipos-cache-v1';
  const EQUIPOS_IDB_STORE = 'stats';

  // ═══════════════════════════════════════════════════════════════════
  // IndexedDB (Directiva 1 — cero localStorage). Caché por usuario para
  // pintado optimista de los KPI mientras se recalcula en el servidor.
  // ═══════════════════════════════════════════════════════════════════
  function equiposCacheKey() {
    return 'equipos_cache_' + (typeof CURRENT_USER_EMAIL !== 'undefined' ? CURRENT_USER_EMAIL : 'anonimo');
  }

  function equiposIdbOpen() {
    return new Promise(function(resolve) {
      if (!('indexedDB' in window)) return resolve(null);
      const request = indexedDB.open(EQUIPOS_IDB_NAME, 1);
      request.onupgradeneeded = function() {
        const db = request.result;
        if (!db.objectStoreNames.contains(EQUIPOS_IDB_STORE)) {
          db.createObjectStore(EQUIPOS_IDB_STORE);
        }
      };
      request.onsuccess = function() { resolve(request.result); };
      request.onerror = function() { resolve(null); };
    });
  }

  function equiposCacheRead() {
    return equiposIdbOpen().then(function(db) {
      if (!db) return null;
      return new Promise(function(resolve) {
        const tx = db.transaction(EQUIPOS_IDB_STORE, 'readonly');
        const store = tx.objectStore(EQUIPOS_IDB_STORE);
        const req = store.get(equiposCacheKey());
        req.onsuccess = function() { resolve(req.result || null); };
        req.onerror = function() { resolve(null); };
      });
    });
  }

  function equiposCacheWrite(payload) {
    return equiposIdbOpen().then(function(db) {
      if (!db) return false;
      return new Promise(function(resolve) {
        const tx = db.transaction(EQUIPOS_IDB_STORE, 'readwrite');
        const store = tx.objectStore(EQUIPOS_IDB_STORE);
        store.put({ payload: payload, savedAt: Date.now() }, equiposCacheKey());
        tx.oncomplete = function() { resolve(true); };
        tx.onerror = function() { resolve(false); };
      });
    });
  }

  // ═══════════════════════════════════════════════════════════════════
  // Visibilidad de navegación por rol — el backend igual filtra los
  // datos (getDashboardData/getEstadisticasCargaEquipos), esto es solo
  // higiene de UI para no ofrecer un módulo que el usuario no usará.
  // ═══════════════════════════════════════════════════════════════════
  function aplicarVisibilidadNavEquipos() {
    const nav = document.getElementById('navEquipos');
    if (!nav) return;
    if (typeof currentRole !== 'undefined' && EQUIPOS_ROLES_CON_ACCESO.indexOf(currentRole) >= 0) {
      nav.classList.remove('d-none');
    } else {
      nav.classList.add('d-none');
    }
  }
  window.aplicarVisibilidadNavEquipos = aplicarVisibilidadNavEquipos;

  // ═══════════════════════════════════════════════════════════════════
  // KPIs / Tablero de carga
  // ═══════════════════════════════════════════════════════════════════
  function pintarKpisEquipos(stats) {
    const totalEl = document.getElementById('kpiEquiposTotalRTs');
    const porAsignarEl = document.getElementById('kpiEquiposPorAsignar');
    const articuladorBody = document.getElementById('tablaDistribucionArticulador');
    const gestorBody = document.getElementById('tablaDistribucionGestor');

    if (totalEl) totalEl.textContent = (stats.totalRTs !== undefined && stats.totalRTs !== null) ? stats.totalRTs : '-';
    if (porAsignarEl) porAsignarEl.textContent = (stats.rtsPorAsignar === null || stats.rtsPorAsignar === undefined) ? 'N/A' : stats.rtsPorAsignar;

    function pintarTabla(tbody, distribucion) {
      if (!tbody) return;
      const filas = Array.isArray(distribucion) ? distribucion : [];
      if (!filas.length) {
        tbody.innerHTML = '<tr><td colspan="2" class="text-center text-muted py-3">Sin datos</td></tr>';
        return;
      }
      tbody.innerHTML = filas.map(function(d) {
        return '<tr><td>' + (d.email || '-') + '</td><td class="text-end fw-bold">' + d.totalRTs + '</td></tr>';
      }).join('');
    }

    pintarTabla(articuladorBody, stats.distribucionArticulador);
    pintarTabla(gestorBody, stats.distribucionGestor);
  }

  // ═══════════════════════════════════════════════════════════════════
  // ✅ [CONC-FE-14]: catálogo unificado (Proyectos/Tramos/RTs + Articuladores/Gestores +
  // mapa de relaciones) para el modal de Asignación Granular — un solo endpoint
  // (getProyectosYListaUsuarios()) en vez de la cascada de round-trips previa
  // (getProyectosConteo -> getTramosPorProyecto por cada expand -> getRTsPorTramo por
  // cada expand -> getUsuariosParaAsignacionEquipos). Se precarga en segundo plano al
  // entrar al módulo para que abrirModalAsignacionGranular() pueda poblar el selector de
  // Proyecto de forma INSTANTÁNEA (0ms) la primera vez que el usuario hace click en
  // "editar" — sin este precache, esa primera apertura tendría que esperar un
  // round-trip completo antes de poder mostrar nada.
  // ═══════════════════════════════════════════════════════════════════
  window.catEstructuraEquipos = null; // {proyectos, tramosPorProyecto, rtsPorTramo, articuladores, gestores, mapaRelaciones}
  let catEstructuraEquiposCargando = false;
  let catEstructuraEquiposCallbacksPendientes = [];

  function precargarCatEstructuraEquipos() {
    if (window.catEstructuraEquipos || catEstructuraEquiposCargando) return;
    catEstructuraEquiposCargando = true;
    google.script.run
      .withSuccessHandler(function(result) {
        catEstructuraEquiposCargando = false;
        if (result && result.success) {
          window.catEstructuraEquipos = result;
        } else {
          console.warn('⚠️ getProyectosYListaUsuarios() no tuvo éxito: ' + ((result && result.error) || 'sin detalle'));
        }
        const callbacks = catEstructuraEquiposCallbacksPendientes;
        catEstructuraEquiposCallbacksPendientes = [];
        callbacks.forEach(function(cb) { cb(); });
      })
      .withFailureHandler(function(error) {
        catEstructuraEquiposCargando = false;
        console.warn('⚠️ Error cargando getProyectosYListaUsuarios(): ' + (error.message || error));
        const callbacks = catEstructuraEquiposCallbacksPendientes;
        catEstructuraEquiposCallbacksPendientes = [];
        callbacks.forEach(function(cb) { cb(); });
      })
      .getProyectosYListaUsuarios();
  }

  // Ejecuta `cb` en cuanto window.catEstructuraEquipos esté disponible: de inmediato si ya
  // está cargado, o encolado a la respuesta en curso/nueva si no.
  function conCatEstructuraEquipos(cb) {
    if (window.catEstructuraEquipos) { cb(); return; }
    catEstructuraEquiposCallbacksPendientes.push(cb);
    precargarCatEstructuraEquipos();
  }

  function cargarModuloEquipos() {
    aplicarVisibilidadNavEquipos();
    precargarCatEstructuraEquipos();

    // Pintado optimista desde IndexedDB mientras llega la respuesta fresca del servidor.
    equiposCacheRead().then(function(cached) {
      if (cached && cached.payload && cached.payload.success) {
        pintarKpisEquipos(cached.payload);
      }
    });

    google.script.run
      .withSuccessHandler(function(stats) {
        if (stats && stats.success) {
          pintarKpisEquipos(stats);
          equiposCacheWrite(stats);
        } else if (typeof window.showNotification === 'function') {
          window.showNotification('Error', (stats && stats.error) || 'No fue posible cargar el tablero de carga', 'danger');
        }
      })
      .withFailureHandler(function(error) {
        if (typeof window.showNotification === 'function') {
          window.showNotification('Error', 'No fue posible cargar el tablero de carga: ' + (error.message || error), 'danger');
        }
      })
      .getEstadisticasCargaEquipos({});

    cargarArbolAsignacion();
  }
  window.cargarModuloEquipos = cargarModuloEquipos;

  // ═══════════════════════════════════════════════════════════════════
  // Árbol navegable Proyecto → Tramo → RT ("línea cero") — feedback de
  // usuario 2026-08-18: la interfaz anterior (tablas planas + modal
  // desconectado) era "muy precaria". Carga perezosa por nivel: nunca se
  // trae de una vez el detalle de los ~9700 RTs — cada nivel se pide al
  // servidor solo cuando el usuario expande ese nodo (Directiva 3: nada
  // de payloads/DOM masivos de entrada).
  // ═══════════════════════════════════════════════════════════════════
  let arbolEstado = [];

  // ═══════════════════════════════════════════════════════════════════
  // Modo Borrador [CONC-BE-12] — feedback de usuario 2026-08-18: las ediciones
  // sobre el árbol ya no se envían al servidor una por una (cada "Asignar" del
  // modal disparaba su propio round-trip con LockService). Ahora cada edición
  // se acumula localmente en `borradorCambiosEquipos` (clave por nodo), se
  // refleja de inmediato en el árbol (resaltado + badge "Cambio pendiente"),
  // y solo se persiste en ASIGNACIONES_EQUIPOS cuando el usuario pulsa
  // "Guardar Todos los Cambios", en una única llamada batch a
  // asignarEquipoGranularLote() bajo un solo LockService en el servidor.
  // ═══════════════════════════════════════════════════════════════════
  let borradorCambiosEquipos = {};

  function claveDraftEquipos(nivel, proyecto, tramo, rt) {
    if (nivel === 'PROYECTO') return 'P::' + proyecto;
    if (nivel === 'TRAMO') return 'T::' + proyecto + '::' + tramo;
    return 'R::' + proyecto + '::' + tramo + '::' + rt;
  }

  // Un RT hereda el borrador más específico que lo cubra: su propio RT, si no
  // el TRAMO al que pertenece, si no el PROYECTO — igual que la resolución en
  // cascada que ya hace _resolverCambiosPorNivel() en el servidor.
  function draftParaRT(proyecto, tramo, rt) {
    return borradorCambiosEquipos[claveDraftEquipos('RT', proyecto, tramo, rt)]
        || borradorCambiosEquipos[claveDraftEquipos('TRAMO', proyecto, tramo)]
        || borradorCambiosEquipos[claveDraftEquipos('PROYECTO', proyecto)]
        || null;
  }

  function draftParaNodo(nivel, proyecto, tramo, rt) {
    return borradorCambiosEquipos[claveDraftEquipos(nivel, proyecto, tramo, rt)] || null;
  }

  function ensureBarraBorradorEquipos() {
    if (document.getElementById('barraBorradorEquipos')) return;
    const bar = document.createElement('div');
    bar.id = 'barraBorradorEquipos';
    bar.className = 'd-none';
    bar.style.cssText = 'position:fixed;bottom:20px;right:20px;z-index:1055;background:#212529;' +
      'color:#fff;padding:12px 16px;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.35);' +
      'display:flex;align-items:center;gap:12px;';
    bar.innerHTML =
      '<span><i class="fas fa-pen-to-square me-1"></i><span id="barraBorradorEquiposCount">0</span> cambio(s) sin guardar</span>' +
      '<button type="button" class="btn btn-sm btn-outline-light" onclick="window.descartarBorradorEquipos()">Descartar</button>' +
      '<button type="button" class="btn btn-sm btn-warning fw-bold" onclick="window.guardarBorradorEquipos()"><i class="fas fa-save"></i> Guardar Todos los Cambios</button>';
    document.body.appendChild(bar);
  }

  function actualizarBarraBorradorEquipos() {
    ensureBarraBorradorEquipos();
    const bar = document.getElementById('barraBorradorEquipos');
    const count = Object.keys(borradorCambiosEquipos).length;
    document.getElementById('barraBorradorEquiposCount').textContent = count;
    bar.classList.toggle('d-none', count === 0);
  }

  function descartarBorradorEquipos() {
    borradorCambiosEquipos = {};
    actualizarBarraBorradorEquipos();
    renderArbolAsignacion();
  }
  window.descartarBorradorEquipos = descartarBorradorEquipos;

  function guardarBorradorEquipos() {
    const cambios = Object.keys(borradorCambiosEquipos).map(function(k) {
      const d = borradorCambiosEquipos[k];
      return { nivel: d.nivel, idTarget: d.idTarget, articuladorEmail: d.articuladorEmail, gestorEmail: d.gestorEmail };
    });
    if (!cambios.length) return;

    const bar = document.getElementById('barraBorradorEquipos');
    if (bar) bar.querySelectorAll('button').forEach(function(b) { b.disabled = true; });
    if (typeof window.showNotification === 'function') {
      window.showNotification('Guardando', 'Aplicando ' + cambios.length + ' cambio(s) al servidor...', 'info');
    }

    google.script.run
      .withSuccessHandler(function(result) {
        if (bar) bar.querySelectorAll('button').forEach(function(b) { b.disabled = false; });
        if (result && result.success) {
          const tieneErrores = Array.isArray(result.erroresPorNodo) && result.erroresPorNodo.length > 0;
          if (tieneErrores) console.warn('Errores por nodo en asignarEquipoGranularLote:', result.erroresPorNodo);
          const erroresTxt = tieneErrores ? (' (' + result.erroresPorNodo.length + ' nodo(s) con error, ver consola)') : '';
          if (typeof window.showNotification === 'function') {
            window.showNotification(
              'Cambios guardados',
              (result.cambiosAplicados || 0) + ' cambio(s) aplicados sobre ' + (result.totalRTsAfectados || 0) + ' RT(s) de ' + (result.totalNodosRecibidos || 0) + ' nodo(s) del árbol.' + erroresTxt,
              tieneErrores ? 'warning' : 'success'
            );
          }
          borradorCambiosEquipos = {};
          actualizarBarraBorradorEquipos();
          cargarModuloEquipos();
        } else if (typeof window.showNotification === 'function') {
          window.showNotification('Error', (result && result.error) || 'No fue posible guardar los cambios.', 'danger');
        }
      })
      .withFailureHandler(function(error) {
        if (bar) bar.querySelectorAll('button').forEach(function(b) { b.disabled = false; });
        if (typeof window.showNotification === 'function') {
          window.showNotification('Error', error.message || String(error), 'danger');
        }
      })
      .asignarEquipoGranularLote(cambios, typeof CURRENT_USER_EMAIL !== 'undefined' ? CURRENT_USER_EMAIL : 'Sistema');
  }
  window.guardarBorradorEquipos = guardarBorradorEquipos;

  function cargarArbolAsignacion() {
    const contenedor = document.getElementById('arbolAsignacionEquipos');
    if (!contenedor) return;
    contenedor.innerHTML = '<div class="text-center py-4"><div class="spinner-border text-primary" role="status"></div></div>';

    google.script.run
      .withSuccessHandler(function(result) {
        if (!result || !result.success) {
          contenedor.innerHTML = '<div class="alert alert-danger">' + ((result && result.error) || 'No fue posible cargar el árbol de asignación.') + '</div>';
          return;
        }
        arbolEstado = (result.proyectos || []).map(function(p) {
          return { proyecto: p.proyecto, totalRTs: p.totalRTs, sinAsignar: p.sinAsignar, expandido: false, tramos: null };
        });
        renderArbolAsignacion();
      })
      .withFailureHandler(function(error) {
        contenedor.innerHTML = '<div class="alert alert-danger">' + (error.message || error) + '</div>';
      })
      .getProyectosConteo();
  }
  window.cargarArbolAsignacion = cargarArbolAsignacion;

  function renderArbolAsignacion() {
    const contenedor = document.getElementById('arbolAsignacionEquipos');
    if (!contenedor) return;
    if (!arbolEstado.length) {
      contenedor.innerHTML = '<div class="text-center text-muted py-4">Sin proyectos visibles.</div>';
      return;
    }
    contenedor.innerHTML = arbolEstado.map(renderNodoProyectoArbol).join('');
  }

  function renderNodoProyectoArbol(p, pIdx) {
    const chevron = p.expandido ? 'fa-chevron-down' : 'fa-chevron-right';
    const badgeColor = p.sinAsignar > 0 ? 'warning' : 'success';
    const draftNodo = draftParaNodo('PROYECTO', p.proyecto);
    const pendienteBadge = draftNodo ? ' <span class="badge bg-warning text-dark"><i class="fas fa-pen"></i> Cambio pendiente</span>' : '';
    let html =
      '<div class="border rounded mb-2' + (draftNodo ? ' border-warning border-2' : '') + '">' +
        '<div class="d-flex justify-content-between align-items-center p-2 bg-light" style="cursor:pointer" onclick="window.toggleProyectoArbol(' + pIdx + ')">' +
          '<div><i class="fas ' + chevron + ' me-2"></i><strong>' + p.proyecto + '</strong> ' +
            '<span class="badge bg-secondary ms-2">' + p.totalRTs + ' RTs</span> ' +
            '<span class="badge bg-' + badgeColor + '">' + p.sinAsignar + ' sin asignar</span>' + pendienteBadge + '</div>' +
          '<button class="btn btn-sm btn-outline-primary" onclick="event.stopPropagation(); window.abrirModalAsignacionGranular(\'PROYECTO\',' + JSON.stringify(p.proyecto) + ',{});"><i class="fas fa-diagram-project"></i> Asignar proyecto completo</button>' +
        '</div>';

    if (p.expandido) {
      html += '<div class="p-2">';
      if (p.tramos === null) {
        html += '<div class="text-center py-2"><div class="spinner-border spinner-border-sm text-primary" role="status"></div></div>';
      } else if (!p.tramos.length) {
        html += '<div class="text-muted small">Sin tramos.</div>';
      } else {
        html += p.tramos.map(function(t, tIdx) { return renderNodoTramoArbol(p, pIdx, t, tIdx); }).join('');
      }
      html += '</div>';
    }

    html += '</div>';
    return html;
  }

  function renderNodoTramoArbol(p, pIdx, t, tIdx) {
    const chevron = t.expandido ? 'fa-chevron-down' : 'fa-chevron-right';
    const badgeColor = t.sinAsignar > 0 ? 'warning' : 'success';
    const draftNodo = draftParaNodo('TRAMO', p.proyecto, t.tramo);
    const pendienteBadge = draftNodo ? ' <span class="badge bg-warning text-dark"><i class="fas fa-pen"></i> Cambio pendiente</span>' : '';
    let html =
      '<div class="border rounded mb-2 ms-4' + (draftNodo ? ' border-warning border-2' : '') + '">' +
        '<div class="d-flex justify-content-between align-items-center p-2" style="cursor:pointer" onclick="window.toggleTramoArbol(' + pIdx + ',' + tIdx + ')">' +
          '<div><i class="fas ' + chevron + ' me-2"></i>' + t.tramo + ' ' +
            '<span class="badge bg-secondary ms-2">' + t.totalRTs + ' RTs</span> ' +
            '<span class="badge bg-' + badgeColor + '">' + t.sinAsignar + ' sin asignar</span>' + pendienteBadge + '</div>' +
          '<button class="btn btn-sm btn-outline-primary" onclick="event.stopPropagation(); window.abrirModalAsignacionGranular(\'TRAMO\',' + JSON.stringify(t.tramo) + ',{proyecto:' + JSON.stringify(p.proyecto) + '});"><i class="fas fa-diagram-project"></i> Asignar tramo completo</button>' +
        '</div>';

    if (t.expandido) {
      html += '<div class="p-2">';
      if (t.rts === null) {
        html += '<div class="text-center py-2"><div class="spinner-border spinner-border-sm text-primary" role="status"></div></div>';
      } else if (!t.rts.length) {
        html += '<div class="text-muted small">Sin RTs.</div>';
      } else {
        html += '<div class="table-responsive"><table class="table table-sm table-striped mb-0"><thead><tr><th>RT</th><th>Articulador</th><th>Gestor</th><th></th></tr></thead><tbody>' +
          t.rts.map(function(r) {
            const draft = draftParaRT(p.proyecto, t.tramo, r.rt);
            const artValor = (draft && draft.articuladorEmail) ? draft.articuladorEmail : r.articulador;
            const artEsEmail = (draft && draft.articuladorEmail) ? true : r.articuladorEsEmail;
            const gesValor = (draft && draft.gestorEmail) ? draft.gestorEmail : r.gestor;
            const gesEsEmail = (draft && draft.gestorEmail) ? true : r.gestorEsEmail;
            const artTxt = !artValor ? '<span class="text-danger">Sin asignar</span>' : (artEsEmail ? artValor : ('<span class="text-muted fst-italic" title="Nombre libre sin homologar">' + artValor + '</span>'));
            const gesTxt = !gesValor ? '<span class="text-danger">Sin asignar</span>' : (gesEsEmail ? gesValor : ('<span class="text-muted fst-italic" title="Nombre libre sin homologar">' + gesValor + '</span>'));
            const filaClass = draft ? ' class="table-warning"' : '';
            const pendienteIcono = draft ? ' <i class="fas fa-circle text-warning" style="font-size:6px;vertical-align:middle" title="Cambio pendiente sin guardar"></i>' : '';
            // ✅ [CONC-FE-13]: precarga automática — solo se pasa articulador/gestor cuando ya
            // son emails reales (homologados); un nombre libre sin homologar no existe como
            // <option> en el select de USUARIOS, así que forzarlo ahí no seleccionaría nada.
            const precargaArt = artEsEmail ? artValor : '';
            const precargaGes = gesEsEmail ? gesValor : '';
            return '<tr' + filaClass + '><td>' + r.rt + pendienteIcono + '</td><td>' + artTxt + '</td><td>' + gesTxt + '</td>' +
              '<td><button class="btn btn-sm btn-outline-secondary" onclick="window.abrirModalAsignacionGranular(\'RT\',' + JSON.stringify(r.rt) + ',{proyecto:' + JSON.stringify(p.proyecto) + ',tramo:' + JSON.stringify(t.tramo) + ',articulador:' + JSON.stringify(precargaArt) + ',gestor:' + JSON.stringify(precargaGes) + '});"><i class="fas fa-pen"></i></button></td></tr>';
          }).join('') +
          '</tbody></table></div>';
      }
      html += '</div>';
    }

    html += '</div>';
    return html;
  }

  function toggleProyectoArbol(pIdx) {
    const p = arbolEstado[pIdx];
    if (!p) return;
    p.expandido = !p.expandido;

    if (p.expandido && p.tramos === null) {
      renderArbolAsignacion();
      google.script.run
        .withSuccessHandler(function(result) {
          p.tramos = (result && result.success ? result.tramos : []).map(function(t) {
            return { tramo: t.tramo, totalRTs: t.totalRTs, sinAsignar: t.sinAsignar, expandido: false, rts: null };
          });
          renderArbolAsignacion();
        })
        .withFailureHandler(function() {
          p.tramos = [];
          renderArbolAsignacion();
        })
        .getTramosPorProyecto(p.proyecto);
    } else {
      renderArbolAsignacion();
    }
  }
  window.toggleProyectoArbol = toggleProyectoArbol;

  function toggleTramoArbol(pIdx, tIdx) {
    const p = arbolEstado[pIdx];
    if (!p || !p.tramos) return;
    const t = p.tramos[tIdx];
    if (!t) return;
    t.expandido = !t.expandido;

    if (t.expandido && t.rts === null) {
      renderArbolAsignacion();
      google.script.run
        .withSuccessHandler(function(result) {
          t.rts = (result && result.success) ? result.rts : [];
          renderArbolAsignacion();
        })
        .withFailureHandler(function() {
          t.rts = [];
          renderArbolAsignacion();
        })
        .getRTsPorTramo(p.proyecto, t.tramo);
    } else {
      renderArbolAsignacion();
    }
  }
  window.toggleTramoArbol = toggleTramoArbol;

  // ═══════════════════════════════════════════════════════════════════

  // distribución real vigente de Datos como punto de partida operativo,
  // migrando nombres libres a emails oficiales homologados con confianza
  // alta. Operación masiva sobre toda la matriz — se pide confirmación
  // explícita antes de dispararla. 100% async (google.script.run), sin
  // ningún bloqueo del hilo del cliente mientras el servidor procesa.
  // ═══════════════════════════════════════════════════════════════════
  function handleCargaLineaCero() {
    const mensaje = 'Esto va a migrar las asignaciones históricas de Articulador/Gestor en la matriz Datos hacia sus emails oficiales homologados (Línea Cero / Baseline). Es una operación masiva sobre toda la matriz y quedará registrada en LOGS_ASIGNACION. ¿Deseas continuar?';

    if (typeof showConfirmation === 'function') {
      pendingAction = ejecutarCargaLineaCeroConfirmado;
      showConfirmation(mensaje);
    } else if (window.confirm(mensaje)) {
      ejecutarCargaLineaCeroConfirmado();
    }
  }
  window.handleCargaLineaCero = handleCargaLineaCero;

  function ejecutarCargaLineaCeroConfirmado() {
    if (typeof window.showNotification === 'function') {
      window.showNotification('Procesando', 'Cargando Línea Cero sobre toda la matriz Datos — puede tardar unos segundos...', 'info');
    }

    google.script.run
      .withSuccessHandler(function(result) {
        if (result && result.success) {
          const advertenciaLog = result.logRegistrado ? '' : ' (LOGS_ASIGNACION no configurado — la migración se aplicó igual, sin registro de auditoría.)';
          if (typeof window.showNotification === 'function') {
            window.showNotification(
              'Línea Cero cargada',
              result.totalAsociacionesResueltas + ' asociaciones resueltas sobre ' + result.totalRTsProcesados + ' RTs (' +
                result.cambiosArticulador + ' Articulador, ' + result.cambiosGestor + ' Gestor).' + advertenciaLog,
              'success'
            );
          }
          cargarModuloEquipos();
        } else if (typeof window.showNotification === 'function') {
          window.showNotification('Error', (result && result.error) || 'No fue posible cargar la Línea Cero.', 'danger');
        }
      })
      .withFailureHandler(function(error) {
        if (typeof window.showNotification === 'function') {
          window.showNotification('Error', error.message || String(error), 'danger');
        }
      })
      .ejecutarCargaLineaCero();
  }

  // ═══════════════════════════════════════════════════════════════════
  // Modal de Homologación — NO_ENCONTRADO / ENCONTRADO_INACTIVO

  function ensureModalHomologacionEquipos() {
    if (document.getElementById('modalHomologacionEquipos')) return;

    const modalHtml =
      '<div class="modal fade" id="modalHomologacionEquipos" tabindex="-1" aria-hidden="true">' +
        '<div class="modal-dialog modal-lg modal-dialog-scrollable">' +
          '<div class="modal-content border-0 shadow-lg">' +
            '<div class="modal-header bg-dark text-white">' +
              '<h5 class="modal-title"><i class="fas fa-user-check"></i> Homologación de Usuarios</h5>' +
              '<button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>' +
            '</div>' +
            '<div class="modal-body p-3" id="modalHomologacionEquiposBody"></div>' +
          '</div>' +
        '</div>' +

  const HUERFANO_BADGE_COLOR = {
    ENCONTRADO_INACTIVO: 'warning',
    ENCONTRADO_SIN_PERFIL: 'info',
    NO_ENCONTRADO: 'secondary'
  };

    ENCONTRADO_INACTIVO: 'Coincide con un usuario marcado ACTIVO=NO en USUARIOS.',
    ENCONTRADO_SIN_PERFIL: 'Encontrado en los grupos de Google (Groups), pero todavía sin fila de perfil en USUARIOS — al vincular, agrega manualmente su ROL en USUARIOS.',
    NO_ENCONTRADO: 'Sin coincidencia en USUARIOS ni en el directorio de Grupos.'
  };

  function renderHuerfanoItem(item, index) {
    const badgeColor = HUERFANO_BADGE_COLOR[item.confianza] || 'secondary';
    const fuenteTexto = item.fuente ? (' · fuente: ' + item.fuente) : '';
    const sugerenciaTexto = item.coincidenciaSugerida
      ? ('Sugerencia: ' + item.coincidenciaSugerida + ' (' + (item.email || 'sin email') + ', puntaje ' + item.puntaje + fuenteTexto + ')')
      : 'Sin sugerencia automática';
    const hint = HUERFANO_HINT[item.confianza] || '';

    return (
      '<div class="border rounded p-3 mb-3 shadow-sm">' +
        '<div class="d-flex justify-content-between align-items-start mb-2">' +
          '<div>' +
            '<span class="badge bg-' + badgeColor + '">' + item.confianza + '</span> ' +
            '<span class="badge bg-info text-dark">' + item.rol + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="fw-bold text-dark">' + item.nombreEnDatos + '</div>' +
        '<div class="small text-muted mb-1">' + sugerenciaTexto + '</div>' +
        (hint ? '<div class="small fst-italic text-secondary mb-2">' + hint + '</div>' : '') +
        '<div class="input-group input-group-sm">' +
          '<input type="email" class="form-control" id="huerfanoEmail_' + index + '" placeholder="email@idu.gov.co" value="' + (item.email || '') + '">' +
          '<button class="btn btn-primary" type="button" onclick="window.vincularUsuarioHuerfano(' + index + ')"><i class="fas fa-link"></i> Vincular</button>' +
        '</div>' +
      '</div>'
    );
  }

  let ultimosHuerfanos = [];

  function abrirModalHomologacionEquipos() {
    ensureModalHomologacionEquipos();
    const body = document.getElementById('modalHomologacionEquiposBody');
    body.innerHTML = '<div class="text-center py-4"><div class="spinner-border text-primary" role="status"></div><div class="mt-2">Comparando Datos contra USUARIOS...</div></div>';

    const modalInst = bootstrap.Modal.getOrCreateInstance(document.getElementById('modalHomologacionEquipos'));
    modalInst.show();

    google.script.run
      .withSuccessHandler(function(result) {
        if (!result || !result.success) {
          body.innerHTML = '<div class="alert alert-danger">' + ((result && result.error) || 'No fue posible calcular la homologación.') + '</div>';
          return;
        }
        ultimosHuerfanos = Array.isArray(result.huerfanos) ? result.huerfanos : [];
        if (!ultimosHuerfanos.length) {
          body.innerHTML = '<div class="text-center text-muted py-4"><i class="fas fa-check-circle text-success fa-2x"></i><div class="mt-2">Sin usuarios huérfanos — todo homologado.</div></div>';
          return;
        }
        body.innerHTML = ultimosHuerfanos.map(renderHuerfanoItem).join('');
      })
      .withFailureHandler(function(error) {
        body.innerHTML = '<div class="alert alert-danger">' + (error.message || error) + '</div>';
      })
      .detectarUsuariosHuerfanos();
  }
  window.abrirModalHomologacionEquipos = abrirModalHomologacionEquipos;

  // Vincular = reasignarUsuarioMasivo(nombreLibre, emailElegido, rol): la misma función de
  // handover de Fase A sirve aquí sin cambios — reemplaza CUALQUIER valor literal de la
  // columna (no solo emails) por el nuevo, exactamente lo que necesita la homologación.
  function vincularUsuarioHuerfano(index) {
    const item = ultimosHuerfanos[index];
    if (!item) return;

    const inputEmail = document.getElementById('huerfanoEmail_' + index);
    const emailElegido = inputEmail ? inputEmail.value.trim() : '';
    if (!emailElegido) {
      if (typeof window.showNotification === 'function') {
        window.showNotification('Error', 'Ingresa un email válido para vincular.', 'danger');
      }
      return;
    }

    google.script.run
      .withSuccessHandler(function(result) {
        if (result && result.success) {
          if (typeof window.showNotification === 'function') {
            window.showNotification('Éxito', 'Vinculado: ' + result.filasAfectadas + ' fila(s) actualizadas.', 'success');
          }
          abrirModalHomologacionEquipos();
          cargarModuloEquipos();
        } else if (typeof window.showNotification === 'function') {
          window.showNotification('Error', (result && result.error) || 'No fue posible vincular.', 'danger');
        }
      })
      .withFailureHandler(function(error) {
        if (typeof window.showNotification === 'function') {
          window.showNotification('Error', error.message || String(error), 'danger');
        }
      })
      .reasignarUsuarioMasivo(item.nombreEnDatos, emailElegido, item.rol, typeof CURRENT_USER_EMAIL !== 'undefined' ? CURRENT_USER_EMAIL : 'Sistema');
  }
  window.vincularUsuarioHuerfano = vincularUsuarioHuerfano;

  // ═══════════════════════════════════════════════════════════════════
  // Formulario de Asignación Granular — cascada Proyecto → Tramo → RT
  // ═══════════════════════════════════════════════════════════════════
  function poblarSelectEquipos(selectId, valores, placeholder) {
    const select = document.getElementById(selectId);
    if (!select) return;
    const actual = select.value;
    select.innerHTML = '<option value="">' + placeholder + '</option>' +
      valores.map(function(v) { return '<option value="' + v + '">' + v + '</option>'; }).join('');
    if (valores.indexOf(actual) >= 0) select.value = actual;
  }

  function onEquiposNivelChange() {
    const nivel = document.getElementById('asignacionNivel').value;
    document.getElementById('grupoAsignacionTramo').classList.toggle('d-none', nivel !== 'TRAMO' && nivel !== 'RT');
    document.getElementById('grupoAsignacionRT').classList.toggle('d-none', nivel !== 'RT');
  }
  window.onEquiposNivelChange = onEquiposNivelChange;

  // ✅ [CONC-FE-14]: las cascadas Proyecto -> Tramo -> RT ahora leen window.catEstructuraEquipos
  // (un solo payload precargado por getProyectosYListaUsuarios()) en vez de escanear
  // window.currentData/rawData fila por fila — deja de depender de que el usuario haya
  // visitado antes la pestaña Matriz, y no repite el escaneo de miles de filas en cada
  // cambio de selección.
  function onEquiposProyectoChange() {
    const proyecto = document.getElementById('asignacionProyecto').value;
    const cat = window.catEstructuraEquipos;
    const tramos = (proyecto && cat && cat.tramosPorProyecto && cat.tramosPorProyecto[proyecto]) || [];
    poblarSelectEquipos('asignacionTramo', tramos, 'Selecciona un tramo...');
    poblarSelectEquipos('asignacionRT', [], 'Selecciona un tramo primero...');
  }
  window.onEquiposProyectoChange = onEquiposProyectoChange;

  function onEquiposTramoChange() {
    const proyecto = document.getElementById('asignacionProyecto').value;
    const tramo = document.getElementById('asignacionTramo').value;
    const cat = window.catEstructuraEquipos;
    // Clave compuesta "proyecto||tramo" — ver comentario de getProyectosYListaUsuarios()
    // en gestion_equipos_backend.js: el mismo nombre de tramo puede repetirse entre proyectos.
    const rts = (tramo && cat && cat.rtsPorTramo && cat.rtsPorTramo[proyecto + '||' + tramo]) || [];
    poblarSelectEquipos('asignacionRT', rts, 'Selecciona un RT...');
  }
  window.onEquiposTramoChange = onEquiposTramoChange;

  function _poblarSelectArticuladorAsignacion() {
    const select = document.getElementById('asignacionEmailArticulador');
    if (!select) return;
    const lista = (window.catEstructuraEquipos && window.catEstructuraEquipos.articuladores) || [];
    select.innerHTML = '<option value="">Selecciona un articulador...</option>' +
      lista.map(function(u) {
        return '<option value="' + u.email + '" data-componente="' + (u.componente || '') + '">' + u.nombre + '</option>';
      }).join('');
  }

  function _resolverArticuladorPorEmail(articuladorEmail) {
    const lista = (window.catEstructuraEquipos && window.catEstructuraEquipos.articuladores) || [];
    const emailLower = String(articuladorEmail || '').trim().toLowerCase();
    if (!emailLower) return null;
    return lista.find(function(u) { return String(u.email || '').trim().toLowerCase() === emailLower; }) || null;
  }

  // ✅ [CONC-FE-14]: cascada de 3 niveles de sugerencia para el Gestor, en orden de
  // relevancia — 1) "Gestores Asociados al Articulador": co-ocurrencia REAL según
  // mapaRelaciones (con quién trabajó de verdad, ⭐ como distintivo visual ya que un
  // <option> nativo no admite badges HTML); 2) "Gestores del Mismo Componente": mismo
  // equipo organizacional, aunque nunca hayan compartido un RT; 3) "(Ver todos los
  // gestores)": escape final sin ningún filtro. `articuladorEmail` null/'' => sin
  // articulador elegido todavía → lista plana completa, sin optgroups.
  function _poblarSelectGestorAsignacion(articuladorEmail) {
    const select = document.getElementById('asignacionEmailGestor');
    if (!select) return;
    const cat = window.catEstructuraEquipos;
    const todos = (cat && cat.gestores) || [];

    if (!articuladorEmail) {
      select.innerHTML = '<option value="">Selecciona un gestor...</option>' +
        todos.map(function(u) { return '<option value="' + u.email + '">' + u.nombre + '</option>'; }).join('');
      return;
    }

    const articulador = _resolverArticuladorPorEmail(articuladorEmail);
    const componente = articulador ? articulador.componente : null;
    const emailArtLower = String(articuladorEmail).trim().toLowerCase();
    const relacionados = (cat && cat.mapaRelaciones && cat.mapaRelaciones[emailArtLower]) || [];
    const relacionadosSet = {};
    relacionados.forEach(function(email) { relacionadosSet[String(email).trim().toLowerCase()] = true; });

    function emailLower(u) { return String(u.email || '').trim().toLowerCase(); }

    const tierRelacionados = todos.filter(function(u) { return relacionadosSet[emailLower(u)]; });
    const tierComponente = componente
      ? todos.filter(function(u) { return u.componente === componente && !relacionadosSet[emailLower(u)]; })
      : [];
    const yaListados = {};
    tierRelacionados.concat(tierComponente).forEach(function(u) { yaListados[emailLower(u)] = true; });
    const hayMasGestores = todos.some(function(u) { return !yaListados[emailLower(u)]; });

    function opcion(u, destacar) {
      const etiqueta = destacar ? '⭐ ' + u.nombre : u.nombre;
      return '<option value="' + u.email + '">' + etiqueta + '</option>';
    }

    let html = '<option value="">Selecciona un gestor...</option>';
    if (tierRelacionados.length) {
      html += '<optgroup label="Gestores Asociados al Articulador">' +
        tierRelacionados.map(function(u) { return opcion(u, true); }).join('') + '</optgroup>';
    }
    if (tierComponente.length) {
      html += '<optgroup label="Gestores del Mismo Componente">' +
        tierComponente.map(function(u) { return opcion(u, false); }).join('') + '</optgroup>';
    }
    if (hayMasGestores) {
      html += '<option value="__TODOS_GESTORES__">— (Ver todos los gestores) —</option>';
    }
    select.innerHTML = html;
  }

  // Cascada: al elegir Articulador, el select de Gestor se reordena por relevancia (co-
  // ocurrencia real > mismo componente > el resto).
  function handleArticuladorChangeInModal(articuladorEmail) {
    _poblarSelectGestorAsignacion(articuladorEmail || null);
  }
  window.handleArticuladorChangeInModal = handleArticuladorChangeInModal;

  // Escape valve: "(Ver todos los gestores)" reabre la lista completa, sin filtro ni tiers.
  function handleGestorSelectChangeInModal(valor) {
    if (valor === '__TODOS_GESTORES__') {
      _poblarSelectGestorAsignacion(null);
    }
  }
  window.handleGestorSelectChangeInModal = handleGestorSelectChangeInModal;

  // Resuelve {proyecto, tramo, rt} reales de un nodo a partir de (nivel, idTarget, datosPrecalculados)
  // — idTarget es el identificador propio del nivel (nombre de proyecto/tramo, o el RT), y
  // datosPrecalculados trae el contexto que ese nivel por sí solo no contiene (p.ej. a qué
  // proyecto pertenece el tramo/RT que se está editando).
  function _resolverIdsNodoAsignacion(nivel, idTarget, pre) {
    if (nivel === 'PROYECTO') return { proyecto: idTarget || '', tramo: '', rt: '' };
    if (nivel === 'TRAMO') return { proyecto: (pre && pre.proyecto) || '', tramo: idTarget || '', rt: '' };
    return { proyecto: (pre && pre.proyecto) || '', tramo: (pre && pre.tramo) || '', rt: idTarget || '' };
  }

  function _renderModalAsignacionGranular(nivel, idTarget, pre) {
    const ids = _resolverIdsNodoAsignacion(nivel, idTarget, pre);
    const cat = window.catEstructuraEquipos;

    poblarSelectEquipos('asignacionProyecto', (cat && cat.proyectos) || [], 'Selecciona un proyecto...');
    poblarSelectEquipos('asignacionTramo', [], 'Selecciona un proyecto primero...');
    poblarSelectEquipos('asignacionRT', [], 'Selecciona un tramo primero...');

    document.getElementById('asignacionNivel').value = nivel || 'PROYECTO';
    _poblarSelectArticuladorAsignacion();
    _poblarSelectGestorAsignacion(null);
    document.getElementById('asignacionEmailArticulador').value = '';
    document.getElementById('asignacionEmailGestor').value = '';

    if (ids.proyecto) {
      document.getElementById('asignacionProyecto').value = ids.proyecto;
      onEquiposProyectoChange();
      if (ids.tramo) {
        document.getElementById('asignacionTramo').value = ids.tramo;
        onEquiposTramoChange();
        if (ids.rt) {
          document.getElementById('asignacionRT').value = ids.rt;
        }
      }
    }

    onEquiposNivelChange();

    // Precarga automática: un borrador ya pendiente sobre este nodo exacto gana sobre los
    // datosPrecalculados del árbol (seguimos editando ESE valor, no el histórico de Datos).
    const draftExistente = draftParaNodo(nivel, ids.proyecto, ids.tramo, ids.rt);
    const articuladorPre = (draftExistente && draftExistente.articuladorEmail) || (pre && pre.articulador) || '';
    const gestorPre = (draftExistente && draftExistente.gestorEmail) || (pre && pre.gestor) || '';

    if (articuladorPre) {
      document.getElementById('asignacionEmailArticulador').value = articuladorPre;
      handleArticuladorChangeInModal(articuladorPre);
    }
    if (gestorPre) {
      const selectGestor = document.getElementById('asignacionEmailGestor');
      const yaDisponible = Array.prototype.some.call(selectGestor.options, function(o) { return o.value === gestorPre; });
      // El gestor precargado puede pertenecer a otro componente/no tener co-ocurrencia
      // registrada (equipos mixtos/legado) — si los tiers de arriba lo dejaron afuera, se
      // reabre la lista completa para no perder el valor real que traía el nodo.
      if (!yaDisponible) _poblarSelectGestorAsignacion(null);
      selectGestor.value = gestorPre;
    }

    const modalInst = bootstrap.Modal.getOrCreateInstance(document.getElementById('modalAsignacionGranular'));
    modalInst.show();
  }

  // `datosPrecalculados` opcional: { proyecto, tramo, articulador, gestor } — usado por los
  // botones del árbol navegable para abrir el modal ya apuntando al nodo exacto que el
  // usuario clickeó Y con la asignación vigente precargada.
  //
  // ✅ [CONC-FE-14]: si window.catEstructuraEquipos ya está precargado (caso normal — se
  // dispara en segundo plano desde cargarModuloEquipos()), el modal se puebla y abre al
  // instante (0ms de espera de red). Si todavía no llegó (click muy rápido tras entrar al
  // módulo), se muestra un indicador discreto y se abre en cuanto la respuesta llegue —
  // nunca se abre el modal con selects vacíos por una carrera de tiempos.
  function abrirModalAsignacionGranular(nivel, idTarget, datosPrecalculados) {
    const pre = datosPrecalculados || {};
    if (window.catEstructuraEquipos) {
      _renderModalAsignacionGranular(nivel, idTarget, pre);
      return;
    }

    if (typeof window.showNotification === 'function') {
      window.showNotification('Cargando', 'Preparando catálogo de Proyectos y Usuarios...', 'info');
    }
    conCatEstructuraEquipos(function() {
      _renderModalAsignacionGranular(nivel, idTarget, pre);
    });
  }
  window.abrirModalAsignacionGranular = abrirModalAsignacionGranular;

  // ✅ SPRINT6 [CONC-BE-12]: ya NO llama a asignarEquipoGranular() directo — solo escribe
  // en el borrador local (borradorCambiosEquipos) y repinta el árbol con el resaltado
  // optimista. El envío real al servidor ocurre una sola vez, en lote, desde
  // guardarBorradorEquipos() -> asignarEquipoGranularLote().
  function agregarCambioAlBorrador() {
    const nivel = document.getElementById('asignacionNivel').value;
    const proyecto = document.getElementById('asignacionProyecto').value;
    const tramo = document.getElementById('asignacionTramo').value;
    let idTarget = '';
    if (nivel === 'PROYECTO') idTarget = proyecto;
    else if (nivel === 'TRAMO') idTarget = tramo;
    else if (nivel === 'RT') idTarget = document.getElementById('asignacionRT').value;

    const articuladorEmail = document.getElementById('asignacionEmailArticulador').value.trim();
    const gestorSeleccionado = document.getElementById('asignacionEmailGestor').value.trim();
    const gestorEmail = gestorSeleccionado === '__TODOS_GESTORES__' ? '' : gestorSeleccionado;

    if (!idTarget) {
      if (typeof window.showNotification === 'function') {
        window.showNotification('Error', 'Selecciona el ' + nivel.toLowerCase() + ' a asignar.', 'danger');
      }
      return;
    }
    if (!articuladorEmail && !gestorEmail) {
      if (typeof window.showNotification === 'function') {
        window.showNotification('Error', 'Indica al menos un Articulador o un Gestor.', 'danger');
      }
      return;
    }

    const clave = claveDraftEquipos(nivel, proyecto, tramo, idTarget);
    borradorCambiosEquipos[clave] = {
      nivel: nivel,
      idTarget: idTarget,
      proyecto: proyecto,
      tramo: nivel !== 'PROYECTO' ? tramo : '',
      rt: nivel === 'RT' ? idTarget : '',
      articuladorEmail: articuladorEmail || null,
      gestorEmail: gestorEmail || null
    };

    bootstrap.Modal.getInstance(document.getElementById('modalAsignacionGranular')).hide();
    renderArbolAsignacion();
    actualizarBarraBorradorEquipos();
    if (typeof window.showNotification === 'function') {
      window.showNotification('Agregado al borrador', 'El cambio quedó en borrador local — usa "Guardar Todos los Cambios" para aplicarlo.', 'info');
    }
  }
  window.agregarCambioAlBorrador = agregarCambioAlBorrador;

  // ═══════════════════════════════════════════════════════════════════
  // Handover 1-click
  // ═══════════════════════════════════════════════════════════════════
  function abrirModalHandover() {

    modalInst.show();

  function handleReasignarUsuarioMasivo() {
    const origen = document.getElementById('handoverOrigen').value.trim();
    const destino = document.getElementById('handoverDestino').value.trim();
    const rol = document.getElementById('handoverRol').value;

    if (!origen || !destino) {
      if (typeof window.showNotification === 'function') {
        window.showNotification('Error', 'Indica el usuario de origen y de destino.', 'danger');
      }
      return;
    }

    google.script.run
      .withSuccessHandler(function(result) {
        if (result && result.success) {
          if (typeof window.showNotification === 'function') {
            window.showNotification('Éxito', 'Handover aplicado: ' + result.filasAfectadas + ' RT(s) reasignados.', 'success');
          }
          bootstrap.Modal.getInstance(document.getElementById('modalHandoverEquipos')).hide();
          cargarModuloEquipos();
        } else if (typeof window.showNotification === 'function') {
          window.showNotification('Error', (result && result.error) || 'No fue posible reasignar.', 'danger');
        }
      })
      .withFailureHandler(function(error) {
        if (typeof window.showNotification === 'function') {
          window.showNotification('Error', error.message || String(error), 'danger');
        }
      })
      .reasignarUsuarioMasivo(origen, destino, rol, typeof CURRENT_USER_EMAIL !== 'undefined' ? CURRENT_USER_EMAIL : 'Sistema');
  }
  window.handleReasignarUsuarioMasivo = handleReasignarUsuarioMasivo;
})();
</script>
