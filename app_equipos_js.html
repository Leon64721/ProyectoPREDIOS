  function guardarBorradorEquipos() {
    const cambios = Object.keys(borradorCambiosEquipos).map(function(k) {
      const d = borradorCambiosEquipos[k];
      return { nivel: d.nivel, idTarget: d.idTarget, articuladorEmail: d.articuladorEmail, gestorEmail: d.gestorEmail };
    });
    if (!cambios.length) return;

    const bar = document.getElementById('barraBorradorEquipos');
    if (bar) bar.querySelectorAll('button').forEach(function(b) { b.disabled = true; });
    if (typeof window.showNotification === 'function') {
      window.showNotification('Guardando', 'Aplicando ' + cambios.length + ' cambio(s) al servidor...', 'info');
    }

    google.script.run
      .withSuccessHandler(function(result) {
        if (bar) bar.querySelectorAll('button').forEach(function(b) { b.disabled = false; });
        if (result && result.success) {
          const tieneErrores = Array.isArray(result.erroresPorNodo) && result.erroresPorNodo.length > 0;
          if (tieneErrores) console.warn('Errores por nodo en asignarEquipoGranularLote:', result.erroresPorNodo);
          const erroresTxt = tieneErrores ? (' (' + result.erroresPorNodo.length + ' nodo(s) con error, ver consola)') : '';
          if (typeof window.showNotification === 'function') {
            window.showNotification(
              'Cambios guardados',
              (result.cambiosAplicados || 0) + ' cambio(s) aplicados sobre ' + (result.totalRTsAfectados || 0) + ' RT(s) de ' + (result.totalNodosRecibidos || 0) + ' nodo(s) del árbol.' + erroresTxt,
              tieneErrores ? 'warning' : 'success'
            );
          }
          borradorCambiosEquipos = {};
          actualizarBarraBorradorEquipos();
          cargarModuloEquipos();
        } else if (typeof window.showNotification === 'function') {
          window.showNotification('Error', (result && result.error) || 'No fue posible guardar los cambios.', 'danger');
        }
      })
      .withFailureHandler(function(error) {
        if (bar) bar.querySelectorAll('button').forEach(function(b) { b.disabled = false; });
        if (typeof window.showNotification === 'function') {
          window.showNotification('Error', error.message || String(error), 'danger');
        }
      })
      .asignarEquipoGranularLote(cambios, typeof CURRENT_USER_EMAIL !== 'undefined' ? CURRENT_USER_EMAIL : 'Sistema');
  }
  window.guardarBorradorEquipos = guardarBorradorEquipos;

  function cargarArbolAsignacion() {
    const contenedor = document.getElementById('arbolAsignacionEquipos');
    if (!contenedor) return;
    contenedor.innerHTML = '<div class="text-center py-4"><div class="spinner-border text-primary" role="status"></div></div>';

    google.script.run
      .withSuccessHandler(function(result) {
        if (!result || !result.success) {
          contenedor.innerHTML = '<div class="alert alert-danger">' + ((result && result.error) || 'No fue posible cargar el árbol de asignación.') + '</div>';
          return;
        }
        arbolEstado = (result.proyectos || []).map(function(p) {
          return { proyecto: p.proyecto, totalRTs: p.totalRTs, sinAsignar: p.sinAsignar, expandido: false, tramos: null };
        });
        renderArbolAsignacion();
      })
      .withFailureHandler(function(error) {
        contenedor.innerHTML = '<div class="alert alert-danger">' + (error.message || error) + '</div>';
      })
      .getProyectosConteo();
  }
  window.cargarArbolAsignacion = cargarArbolAsignacion;

  function renderArbolAsignacion() {
    const contenedor = document.getElementById('arbolAsignacionEquipos');
    if (!contenedor) return;
    if (!arbolEstado.length) {
      contenedor.innerHTML = '<div class="text-center text-muted py-4">Sin proyectos visibles.</div>';
      return;
    }
    contenedor.innerHTML = arbolEstado.map(renderNodoProyectoArbol).join('');
  }

  function renderNodoProyectoArbol(p, pIdx) {
    const chevron = p.expandido ? 'fa-chevron-down' : 'fa-chevron-right';
    const badgeColor = p.sinAsignar > 0 ? 'warning' : 'success';
    const draftNodo = draftParaNodo('PROYECTO', p.proyecto);
    const pendienteBadge = draftNodo ? ' <span class="badge bg-warning text-dark"><i class="fas fa-pen"></i> Cambio pendiente</span>' : '';
    let html =
      '<div class="border rounded mb-2' + (draftNodo ? ' border-warning border-2' : '') + '">' +
        '<div class="d-flex justify-content-between align-items-center p-2 bg-light" style="cursor:pointer" onclick="window.toggleProyectoArbol(' + pIdx + ')">' +
          '<div><i class="fas ' + chevron + ' me-2"></i><strong>' + p.proyecto + '</strong> ' +
            '<span class="badge bg-secondary ms-2">' + p.totalRTs + ' RTs</span> ' +
            '<span class="badge bg-' + badgeColor + '">' + p.sinAsignar + ' sin asignar</span>' + pendienteBadge + '</div>' +
          '<button class="btn btn-sm btn-outline-primary" onclick="event.stopPropagation(); window.abrirModalAsignacionGranular(\'PROYECTO\',' + JSON.stringify(p.proyecto) + ',{});"><i class="fas fa-diagram-project"></i> Asignar proyecto completo</button>' +
        '</div>';

    if (p.expandido) {
      html += '<div class="p-2">';
      if (p.tramos === null) {
        html += '<div class="text-center py-2"><div class="spinner-border spinner-border-sm text-primary" role="status"></div></div>';
      } else if (!p.tramos.length) {
        html += '<div class="text-muted small">Sin tramos.</div>';
      } else {
        html += p.tramos.map(function(t, tIdx) { return renderNodoTramoArbol(p, pIdx, t, tIdx); }).join('');
      }
      html += '</div>';
    }

    html += '</div>';
    return html;
  }

  function renderNodoTramoArbol(p, pIdx, t, tIdx) {
    const chevron = t.expandido ? 'fa-chevron-down' : 'fa-chevron-right';
    const badgeColor = t.sinAsignar > 0 ? 'warning' : 'success';
    const draftNodo = draftParaNodo('TRAMO', p.proyecto, t.tramo);
    const pendienteBadge = draftNodo ? ' <span class="badge bg-warning text-dark"><i class="fas fa-pen"></i> Cambio pendiente</span>' : '';
    let html =
      '<div class="border rounded mb-2 ms-4' + (draftNodo ? ' border-warning border-2' : '') + '">' +
        '<div class="d-flex justify-content-between align-items-center p-2" style="cursor:pointer" onclick="window.toggleTramoArbol(' + pIdx + ',' + tIdx + ')">' +
          '<div><i class="fas ' + chevron + ' me-2"></i>' + t.tramo + ' ' +
            '<span class="badge bg-secondary ms-2">' + t.totalRTs + ' RTs</span> ' +
            '<span class="badge bg-' + badgeColor + '">' + t.sinAsignar + ' sin asignar</span>' + pendienteBadge + '</div>' +
          '<button class="btn btn-sm btn-outline-primary" onclick="event.stopPropagation(); window.abrirModalAsignacionGranular(\'TRAMO\',' + JSON.stringify(t.tramo) + ',{proyecto:' + JSON.stringify(p.proyecto) + '});"><i class="fas fa-diagram-project"></i> Asignar tramo completo</button>' +
        '</div>';

    if (t.expandido) {
      html += '<div class="p-2">';
      if (t.rts === null) {
        html += '<div class="text-center py-2"><div class="spinner-border spinner-border-sm text-primary" role="status"></div></div>';
      } else if (!t.rts.length) {
        html += '<div class="text-muted small">Sin RTs.</div>';
      } else {
        html += '<div class="table-responsive"><table class="table table-sm table-striped mb-0"><thead><tr><th>RT</th><th>Articulador</th><th>Gestor</th><th></th></tr></thead><tbody>' +
          t.rts.map(function(r) {
            const draft = draftParaRT(p.proyecto, t.tramo, r.rt);
            const artValor = (draft && draft.articuladorEmail) ? draft.articuladorEmail : r.articulador;
            const artEsEmail = (draft && draft.articuladorEmail) ? true : r.articuladorEsEmail;
            const gesValor = (draft && draft.gestorEmail) ? draft.gestorEmail : r.gestor;
            const gesEsEmail = (draft && draft.gestorEmail) ? true : r.gestorEsEmail;
            const artTxt = !artValor ? '<span class="text-danger">Sin asignar</span>' : (artEsEmail ? artValor : ('<span class="text-muted fst-italic" title="Nombre libre sin homologar">' + artValor + '</span>'));
            const gesTxt = !gesValor ? '<span class="text-danger">Sin asignar</span>' : (gesEsEmail ? gesValor : ('<span class="text-muted fst-italic" title="Nombre libre sin homologar">' + gesValor + '</span>'));
            const filaClass = draft ? ' class="table-warning"' : '';
            const pendienteIcono = draft ? ' <i class="fas fa-circle text-warning" style="font-size:6px;vertical-align:middle" title="Cambio pendiente sin guardar"></i>' : '';
            // ✅ [CONC-FE-13]: precarga automática — solo se pasa articulador/gestor cuando ya
            // son emails reales (homologados); un nombre libre sin homologar no existe como
            // <option> en el select de USUARIOS, así que forzarlo ahí no seleccionaría nada.
            const precargaArt = artEsEmail ? artValor : '';
            const precargaGes = gesEsEmail ? gesValor : '';
            return '<tr' + filaClass + '><td>' + r.rt + pendienteIcono + '</td><td>' + artTxt + '</td><td>' + gesTxt + '</td>' +
              '<td><button class="btn btn-sm btn-outline-secondary" onclick="window.abrirModalAsignacionGranular(\'RT\',' + JSON.stringify(r.rt) + ',{proyecto:' + JSON.stringify(p.proyecto) + ',tramo:' + JSON.stringify(t.tramo) + ',articulador:' + JSON.stringify(precargaArt) + ',gestor:' + JSON.stringify(precargaGes) + '});"><i class="fas fa-pen"></i></button></td></tr>';
          }).join('') +
          '</tbody></table></div>';
      }
      html += '</div>';
    }

    html += '</div>';
    return html;
  }

  function toggleProyectoArbol(pIdx) {
    const p = arbolEstado[pIdx];
    if (!p) return;
    p.expandido = !p.expandido;

    if (p.expandido && p.tramos === null) {
      renderArbolAsignacion();
      google.script.run
        .withSuccessHandler(function(result) {
          p.tramos = (result && result.success ? result.tramos : []).map(function(t) {
            return { tramo: t.tramo, totalRTs: t.totalRTs, sinAsignar: t.sinAsignar, expandido: false, rts: null };
          });
          renderArbolAsignacion();
        })
        .withFailureHandler(function() {
          p.tramos = [];
          renderArbolAsignacion();
        })
        .getTramosPorProyecto(p.proyecto);
    } else {
      renderArbolAsignacion();
    }
  }
  window.toggleProyectoArbol = toggleProyectoArbol;

  function toggleTramoArbol(pIdx, tIdx) {
    const p = arbolEstado[pIdx];
    if (!p || !p.tramos) return;
    const t = p.tramos[tIdx];
    if (!t) return;
    t.expandido = !t.expandido;

    if (t.expandido && t.rts === null) {
      renderArbolAsignacion();
      google.script.run
        .withSuccessHandler(function(result) {
          t.rts = (result && result.success) ? result.rts : [];
          renderArbolAsignacion();
        })
        .withFailureHandler(function() {
          t.rts = [];
          renderArbolAsignacion();
        })
        .getRTsPorTramo(p.proyecto, t.tramo);
    } else {
      renderArbolAsignacion();
    }
  }
  window.toggleTramoArbol = toggleTramoArbol;

  // ═══════════════════════════════════════════════════════════════════
  // Carga de Línea Cero (Baseline) — feedback de usuario 2026-08-18: fija la
  // distribución real vigente de Datos como punto de partida operativo,
  // migrando nombres libres a emails oficiales homologados con confianza
  // alta. Operación masiva sobre toda la matriz — se pide confirmación
  // explícita antes de dispararla. 100% async (google.script.run), sin
  // ningún bloqueo del hilo del cliente mientras el servidor procesa.
  // ═══════════════════════════════════════════════════════════════════
  function handleCargaLineaCero() {
    const mensaje = 'Esto va a migrar las asignaciones históricas de Articulador/Gestor en la matriz Datos hacia sus emails oficiales homologados (Línea Cero / Baseline). Es una operación masiva sobre toda la matriz y quedará registrada en LOGS_ASIGNACION. ¿Deseas continuar?';

    if (typeof showConfirmation === 'function') {
      pendingAction = ejecutarCargaLineaCeroConfirmado;
      showConfirmation(mensaje);
    } else if (window.confirm(mensaje)) {
      ejecutarCargaLineaCeroConfirmado();
    }
  }
  window.handleCargaLineaCero = handleCargaLineaCero;

  function ejecutarCargaLineaCeroConfirmado() {
    if (typeof window.showNotification === 'function') {
      window.showNotification('Procesando', 'Cargando Línea Cero sobre toda la matriz Datos — puede tardar unos segundos...', 'info');
    }

    google.script.run
      .withSuccessHandler(function(result) {
        if (result && result.success) {
          const advertenciaLog = result.logRegistrado ? '' : ' (LOGS_ASIGNACION no configurado — la migración se aplicó igual, sin registro de auditoría.)';
          if (typeof window.showNotification === 'function') {
            window.showNotification(
              'Línea Cero cargada',
              result.totalAsociacionesResueltas + ' asociaciones resueltas sobre ' + result.totalRTsProcesados + ' RTs (' +
                result.cambiosArticulador + ' Articulador, ' + result.cambiosGestor + ' Gestor).' + advertenciaLog,
              'success'
            );
          }
          cargarModuloEquipos();
        } else if (typeof window.showNotification === 'function') {
          window.showNotification('Error', (result && result.error) || 'No fue posible cargar la Línea Cero.', 'danger');
        }
      })
      .withFailureHandler(function(error) {
        if (typeof window.showNotification === 'function') {
          window.showNotification('Error', error.message || String(error), 'danger');
        }
      })
      .ejecutarCargaLineaCero();
  }

  // ═══════════════════════════════════════════════════════════════════
  // Modal de Homologación — NO_ENCONTRADO / ENCONTRADO_INACTIVO
  // ═══════════════════════════════════════════════════════════════════
  function ensureModalHomologacionEquipos() {
    if (document.getElementById('modalHomologacionEquipos')) return;

    const modalHtml =
      '<div class="modal fade" id="modalHomologacionEquipos" tabindex="-1" aria-hidden="true">' +
        '<div class="modal-dialog modal-lg modal-dialog-scrollable">' +
          '<div class="modal-content border-0 shadow-lg">' +
            '<div class="modal-header bg-dark text-white">' +
              '<h5 class="modal-title"><i class="fas fa-user-check"></i> Homologación de Usuarios</h5>' +
              '<button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>' +
            '</div>' +
            '<div class="modal-body p-3" id="modalHomologacionEquiposBody"></div>' +
          '</div>' +
        '</div>' +
      '</div>';

    const wrapper = document.createElement('div');
    wrapper.innerHTML = modalHtml;
    document.body.appendChild(wrapper.firstElementChild);
  }

  const HUERFANO_BADGE_COLOR = {
    ENCONTRADO_INACTIVO: 'warning',
    ENCONTRADO_SIN_PERFIL: 'info',
    NO_ENCONTRADO: 'secondary'
  };
  const HUERFANO_HINT = {
    ENCONTRADO_INACTIVO: 'Coincide con un usuario marcado ACTIVO=NO en USUARIOS.',
    ENCONTRADO_SIN_PERFIL: 'Encontrado en los grupos de Google (Groups), pero todavía sin fila de perfil en USUARIOS — al vincular, agrega manualmente su ROL en USUARIOS.',
    NO_ENCONTRADO: 'Sin coincidencia en USUARIOS ni en el directorio de Grupos.'
  };

  function renderHuerfanoItem(item, index) {
    const badgeColor = HUERFANO_BADGE_COLOR[item.confianza] || 'secondary';
    const fuenteTexto = item.fuente ? (' · fuente: ' + item.fuente) : '';
    const sugerenciaTexto = item.coincidenciaSugerida
      ? ('Sugerencia: ' + item.coincidenciaSugerida + ' (' + (item.email || 'sin email') + ', puntaje ' + item.puntaje + fuenteTexto + ')')
      : 'Sin sugerencia automática';
    const hint = HUERFANO_HINT[item.confianza] || '';

    return (
      '<div class="border rounded p-3 mb-3 shadow-sm">' +
        '<div class="d-flex justify-content-between align-items-start mb-2">' +
          '<div>' +
            '<span class="badge bg-' + badgeColor + '">' + item.confianza + '</span> ' +
            '<span class="badge bg-info text-dark">' + item.rol + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="fw-bold text-dark">' + item.nombreEnDatos + '</div>' +
        '<div class="small text-muted mb-1">' + sugerenciaTexto + '</div>' +
        (hint ? '<div class="small fst-italic text-secondary mb-2">' + hint + '</div>' : '') +
        '<div class="input-group input-group-sm">' +
          '<input type="email" class="form-control" id="huerfanoEmail_' + index + '" placeholder="email@idu.gov.co" value="' + (item.email || '') + '">' +
          '<button class="btn btn-primary" type="button" onclick="window.vincularUsuarioHuerfano(' + index + ')"><i class="fas fa-link"></i> Vincular</button>' +
        '</div>' +
      '</div>'
    );
  }

  let ultimosHuerfanos = [];

  function abrirModalHomologacionEquipos() {
    ensureModalHomologacionEquipos();
    const body = document.getElementById('modalHomologacionEquiposBody');
    body.innerHTML = '<div class="text-center py-4"><div class="spinner-border text-primary" role="status"></div><div class="mt-2">Comparando Datos contra USUARIOS...</div></div>';

    const modalInst = bootstrap.Modal.getOrCreateInstance(document.getElementById('modalHomologacionEquipos'));
    modalInst.show();

    google.script.run
      .withSuccessHandler(function(result) {
        if (!result || !result.success) {
          body.innerHTML = '<div class="alert alert-danger">' + ((result && result.error) || 'No fue posible calcular la homologación.') + '</div>';
          return;
        }
        ultimosHuerfanos = Array.isArray(result.huerfanos) ? result.huerfanos : [];
        if (!ultimosHuerfanos.length) {
          body.innerHTML = '<div class="text-center text-muted py-4"><i class="fas fa-check-circle text-success fa-2x"></i><div class="mt-2">Sin usuarios huérfanos — todo homologado.</div></div>';
          return;
        }
        body.innerHTML = ultimosHuerfanos.map(renderHuerfanoItem).join('');
      })
      .withFailureHandler(function(error) {
        body.innerHTML = '<div class="alert alert-danger">' + (error.message || error) + '</div>';
      })
      .detectarUsuariosHuerfanos();
  }
  window.abrirModalHomologacionEquipos = abrirModalHomologacionEquipos;

  // Vincular = reasignarUsuarioMasivo(nombreLibre, emailElegido, rol): la misma función de
  // handover de Fase A sirve aquí sin cambios — reemplaza CUALQUIER valor literal de la
  // columna (no solo emails) por el nuevo, exactamente lo que necesita la homologación.
  function vincularUsuarioHuerfano(index) {
    const item = ultimosHuerfanos[index];
    if (!item) return;

    const inputEmail = document.getElementById('huerfanoEmail_' + index);
    const emailElegido = inputEmail ? inputEmail.value.trim() : '';
    if (!emailElegido) {
      if (typeof window.showNotification === 'function') {
        window.showNotification('Error', 'Ingresa un email válido para vincular.', 'danger');
      }
      return;
    }

    google.script.run
      .withSuccessHandler(function(result) {
        if (result && result.success) {
          if (typeof window.showNotification === 'function') {
            window.showNotification('Éxito', 'Vinculado: ' + result.filasAfectadas + ' fila(s) actualizadas.', 'success');
          }
          abrirModalHomologacionEquipos();
          cargarModuloEquipos();
        } else if (typeof window.showNotification === 'function') {
          window.showNotification('Error', (result && result.error) || 'No fue posible vincular.', 'danger');
        }
      })
      .withFailureHandler(function(error) {
        if (typeof window.showNotification === 'function') {
          window.showNotification('Error', error.message || String(error), 'danger');
        }
      })
      .reasignarUsuarioMasivo(item.nombreEnDatos, emailElegido, item.rol, typeof CURRENT_USER_EMAIL !== 'undefined' ? CURRENT_USER_EMAIL : 'Sistema');
  }
  window.vincularUsuarioHuerfano = vincularUsuarioHuerfano;

  // ═══════════════════════════════════════════════════════════════════
  // Formulario de Asignación Granular — cascada Proyecto → Tramo → RT
  // ═══════════════════════════════════════════════════════════════════
  function poblarSelectEquipos(selectId, valores, placeholder) {
    const select = document.getElementById(selectId);
    if (!select) return;
    const actual = select.value;
    select.innerHTML = '<option value="">' + placeholder + '</option>' +
      valores.map(function(v) { return '<option value="' + v + '">' + v + '</option>'; }).join('');
    if (valores.indexOf(actual) >= 0) select.value = actual;
  }

  // ✅ [CONC-FE-15]: con Nivel=RT, Proyecto/Tramo/RT dejan de editarse a mano — el buscador
  // directo (#grupoAsignacionBuscadorRT) los autocompleta y los bloquea (disabled) vía
  // handleRTSelectionDirecta(). Cambiar a cualquier otro Nivel los reactiva y limpia el
  // buscador/estado vigente, para no dejar residuos de una búsqueda anterior.
  function onEquiposNivelChange() {
    const nivel = document.getElementById('asignacionNivel').value;
    const esRTDirecto = nivel === 'RT';

    document.getElementById('grupoAsignacionBuscadorRT').classList.toggle('d-none', !esRTDirecto);
    document.getElementById('grupoAsignacionTramo').classList.toggle('d-none', nivel !== 'TRAMO' && nivel !== 'RT');
    document.getElementById('grupoAsignacionRT').classList.toggle('d-none', nivel !== 'RT');

    document.getElementById('asignacionProyecto').disabled = esRTDirecto;
    document.getElementById('asignacionTramo').disabled = esRTDirecto;
    document.getElementById('asignacionRT').disabled = esRTDirecto;

    if (!esRTDirecto) {
      document.getElementById('asignacionBuscadorRT').value = '';
      document.getElementById('infoAsignacionActual').innerHTML = '';
      const sugerencias = document.getElementById('asignacionBuscadorRTSugerencias');
      if (sugerencias) { sugerencias.classList.add('d-none'); sugerencias.innerHTML = ''; }
    }
  }
  window.onEquiposNivelChange = onEquiposNivelChange;

  // ✅ [CONC-FE-14]: las cascadas Proyecto -> Tramo -> RT ahora leen window.catEstructuraEquipos
  // (un solo payload precargado por getProyectosYListaUsuarios()) en vez de escanear
  // window.currentData/rawData fila por fila — deja de depender de que el usuario haya
  // visitado antes la pestaña Matriz, y no repite el escaneo de miles de filas en cada
  // cambio de selección.
  function onEquiposProyectoChange() {
    const proyecto = document.getElementById('asignacionProyecto').value;
    const cat = window.catEstructuraEquipos;
    const tramos = (proyecto && cat && cat.tramosPorProyecto && cat.tramosPorProyecto[proyecto]) || [];
    poblarSelectEquipos('asignacionTramo', tramos, 'Selecciona un tramo...');
    poblarSelectEquipos('asignacionRT', [], 'Selecciona un tramo primero...');
  }
  window.onEquiposProyectoChange = onEquiposProyectoChange;

  function onEquiposTramoChange() {
    const proyecto = document.getElementById('asignacionProyecto').value;
    const tramo = document.getElementById('asignacionTramo').value;
    const cat = window.catEstructuraEquipos;
    // Clave compuesta "proyecto||tramo" — ver comentario de getProyectosYListaUsuarios()
    // en gestion_equipos_backend.js: el mismo nombre de tramo puede repetirse entre proyectos.
    const rts = (tramo && cat && cat.rtsPorTramo && cat.rtsPorTramo[proyecto + '||' + tramo]) || [];
    poblarSelectEquipos('asignacionRT', rts, 'Selecciona un RT...');
  }
  window.onEquiposTramoChange = onEquiposTramoChange;

  // ✅ [CONC-FE-15]: cascada Proyecto -> Tramo del selector de ÁMBITO de exportación en la
  // cabecera del módulo (independiente del modal) — mismo catálogo, mismo patrón.
  function onExportAsignacionProyectoChange() {
    const proyecto = document.getElementById('exportAsignacionProyecto').value;
    const cat = window.catEstructuraEquipos;
    const tramos = (proyecto && cat && cat.tramosPorProyecto && cat.tramosPorProyecto[proyecto]) || [];
    poblarSelectEquipos('exportAsignacionTramo', tramos, 'Todos los tramos');
  }
  window.onExportAsignacionProyectoChange = onExportAsignacionProyectoChange;

  // ═══════════════════════════════════════════════════════════════════
  // ✅ [CONC-FE-15]: Buscador directo de RT (Nivel=RT) — lookup O(1) contra
  // window.mapaInversoRTs, sin escanear ninguna estructura ni pedir nada al servidor.
  // ═══════════════════════════════════════════════════════════════════
  function _renderInfoAsignacionActual(articulador, gestor, tieneDraft) {
    const info = document.getElementById('infoAsignacionActual');
    if (!info) return;
    const artTxt = articulador || 'Sin asignar';
    const gesTxt = gestor || 'Sin asignar';
    const draftTxt = tieneDraft ? ' <span class="badge bg-warning text-dark">Con cambio en borrador</span>' : '';
    info.innerHTML = '<div class="alert alert-secondary py-2 mb-0 small">' +
      '<strong>Estado vigente en el servidor:</strong> Articulador: ' + artTxt + ' · Gestor: ' + gesTxt + draftTxt +
      '</div>';
  }

  // Suggestions custom (NO <datalist> nativo): con ~10 mil RTs, un <datalist> con miles de
  // <option> genera lag de tipeo perceptible en varios navegadores (Directiva 3 — nada de
  // DOM masivo). Este dropdown propio nunca renderiza más de 15 nodos a la vez.
  function handleBuscadorRTInput(valor) {
    const texto = String(valor || '').trim();
    const contenedor = document.getElementById('asignacionBuscadorRTSugerencias');
    if (!contenedor) return;

    if (texto.length < 2) {
      contenedor.classList.add('d-none');
      contenedor.innerHTML = '';
      if (!texto) document.getElementById('infoAsignacionActual').innerHTML = '';
      return;
    }

    const mapa = window.mapaInversoRTs || {};
    const textoLower = texto.toLowerCase();
    const coincidencias = Object.keys(mapa)
      .filter(function(rt) { return rt.toLowerCase().indexOf(textoLower) >= 0; })
      .slice(0, 15);

    if (!coincidencias.length) {
      contenedor.innerHTML = '<div class="list-group-item text-muted small">Sin coincidencias.</div>';
      contenedor.classList.remove('d-none');
      return;
    }

    contenedor.innerHTML = coincidencias.map(function(rt) {
      const d = mapa[rt];
      return '<button type="button" class="list-group-item list-group-item-action py-1 px-2 small" ' +
        'onmousedown="event.preventDefault(); window.handleRTSelectionDirecta(' + JSON.stringify(rt) + '); document.getElementById(\'asignacionBuscadorRTSugerencias\').classList.add(\'d-none\');">' +
        '<strong>' + rt + '</strong> — ' + d.proyecto + ' / ' + d.tramo + '</button>';
    }).join('');
    contenedor.classList.remove('d-none');
  }
  window.handleBuscadorRTInput = handleBuscadorRTInput;

  // onmousedown (arriba) ya dispara la selección antes de que el input pierda foco, pero se
  // deja este blur con pequeño delay como respaldo para cerrar el dropdown en cualquier otro
  // caso (p.ej. el usuario hace click fuera del modal).
  function ocultarSugerenciasBuscadorRT() {
    setTimeout(function() {
      const contenedor = document.getElementById('asignacionBuscadorRTSugerencias');
      if (contenedor) contenedor.classList.add('d-none');
    }, 150);
  }
  window.ocultarSugerenciasBuscadorRT = ocultarSugerenciasBuscadorRT;

  // Autocompleta Proyecto/Tramo/RT (bloqueados) + Articulador/Gestor + panel de estado
  // vigente a partir de window.mapaInversoRTs — 0ms, sin round-trip. Un borrador ya
  // pendiente sobre este RT (Draft Mode, CONC-BE-12) gana sobre el valor real del servidor,
  // igual que en cualquier otro punto de entrada al modal.
  function handleRTSelectionDirecta(rtInput) {
    // ✅ [CONC-FE-17]: coerción explícita — la entrada puede llegar como número (click en el
    // árbol, si algún RT quedó tipado como Number en Datos) o como string (buscador
    // manual/datalist). String(x).trim() unifica ambos casos a la misma forma de clave que
    // usa window.mapaInversoRTs (ver getIndiceInversoRTs(), gestion_equipos_backend.js).
    const rt = String(rtInput || '').trim();
    const datos = (window.mapaInversoRTs || {})[rt];

    if (!datos) {
      _renderInfoAsignacionActual(null, null, false);
      const info = document.getElementById('infoAsignacionActual');
      if (info) info.innerHTML = rt ? '<span class="text-muted small">RT no encontrado en el catálogo — verifica el número.</span>' : '';
      return;
    }

    const buscador = document.getElementById('asignacionBuscadorRT');
    if (buscador && buscador.value !== rt) buscador.value = rt;

    poblarSelectEquipos('asignacionProyecto', (window.catEstructuraEquipos && window.catEstructuraEquipos.proyectos) || [datos.proyecto], 'Selecciona un proyecto...');
    document.getElementById('asignacionProyecto').value = datos.proyecto;
    const tramosDelProyecto = (window.catEstructuraEquipos && window.catEstructuraEquipos.tramosPorProyecto && window.catEstructuraEquipos.tramosPorProyecto[datos.proyecto]) || [datos.tramo];
    poblarSelectEquipos('asignacionTramo', tramosDelProyecto, 'Selecciona un tramo...');
    document.getElementById('asignacionTramo').value = datos.tramo;
    poblarSelectEquipos('asignacionRT', [rt], 'Selecciona un RT...');
    document.getElementById('asignacionRT').value = rt;

    const draftExistente = draftParaNodo('RT', datos.proyecto, datos.tramo, rt);
    const articuladorPre = (draftExistente && draftExistente.articuladorEmail) || datos.articulador || '';
    const gestorPre = (draftExistente && draftExistente.gestorEmail) || datos.gestor || '';

    _poblarSelectArticuladorAsignacion();
    _poblarSelectGestorAsignacion(null);
    document.getElementById('asignacionEmailArticulador').value = '';
    document.getElementById('asignacionEmailGestor').value = '';

    if (articuladorPre) {
      document.getElementById('asignacionEmailArticulador').value = articuladorPre;
      handleArticuladorChangeInModal(articuladorPre);
    }
    if (gestorPre) {
      const selectGestor = document.getElementById('asignacionEmailGestor');
      const yaDisponible = Array.prototype.some.call(selectGestor.options, function(o) { return o.value === gestorPre; });
      if (!yaDisponible) _poblarSelectGestorAsignacion(null);
      selectGestor.value = gestorPre;
    }

    _renderInfoAsignacionActual(datos.articulador, datos.gestor, !!draftExistente);
  }
  window.handleRTSelectionDirecta = handleRTSelectionDirecta;

  // ✅ [CONC-FE-17]: conmutador "Mostrar todos los funcionarios disponibles" — para el caso
  // legítimo de un handover cruzado de equipo/componente donde la sugerencia por co-
  // ocurrencia/componente estorba en vez de ayudar. Mientras está activo, TODA repoblación
  // del select de Gestor (incluida la que dispara handleArticuladorChangeInModal al cambiar
  // de Articulador) ignora el filtro y muestra el catálogo completo.
  let mostrarTodosUsuariosActivo = false;

  function toggleMostrarTodosUsuarios(mostrarTodos) {
    mostrarTodosUsuariosActivo = !!mostrarTodos;
    const articuladorActual = document.getElementById('asignacionEmailArticulador').value;
    if (mostrarTodosUsuariosActivo) {
      _poblarSelectGestorAsignacion(null); // sin filtro = catálogo completo de gestores
    } else if (articuladorActual) {
      _poblarSelectGestorAsignacion(articuladorActual); // vuelve a la cascada normal
    } else {
      _poblarSelectGestorAsignacion(null);
    }
  }
  window.toggleMostrarTodosUsuarios = toggleMostrarTodosUsuarios;

  function _poblarSelectArticuladorAsignacion() {
    const select = document.getElementById('asignacionEmailArticulador');
    if (!select) return;
    const lista = (window.catEstructuraEquipos && window.catEstructuraEquipos.articuladores) || [];
    select.innerHTML = '<option value="">Selecciona un articulador...</option>' +
      lista.map(function(u) {
        return '<option value="' + u.email + '" data-componente="' + (u.componente || '') + '">' + u.nombre + '</option>';
      }).join('');
  }

  function _resolverArticuladorPorEmail(articuladorEmail) {
    const lista = (window.catEstructuraEquipos && window.catEstructuraEquipos.articuladores) || [];
    const emailLower = String(articuladorEmail || '').trim().toLowerCase();
    if (!emailLower) return null;
    return lista.find(function(u) { return String(u.email || '').trim().toLowerCase() === emailLower; }) || null;
  }

  // ✅ [CONC-FE-14]: cascada de 3 niveles de sugerencia para el Gestor, en orden de
  // relevancia — 1) "Gestores Asociados al Articulador": co-ocurrencia REAL según
  // mapaRelaciones (con quién trabajó de verdad, ⭐ como distintivo visual ya que un
  // <option> nativo no admite badges HTML); 2) "Gestores del Mismo Componente": mismo
  // equipo organizacional, aunque nunca hayan compartido un RT; 3) "(Ver todos los
  // gestores)": escape final sin ningún filtro. `articuladorEmail` null/'' => sin
  // articulador elegido todavía → lista plana completa, sin optgroups.
  function _poblarSelectGestorAsignacion(articuladorEmail) {
    const select = document.getElementById('asignacionEmailGestor');
    if (!select) return;
    const cat = window.catEstructuraEquipos;
    const todos = (cat && cat.gestores) || [];

    if (!articuladorEmail) {
      select.innerHTML = '<option value="">Selecciona un gestor...</option>' +
        todos.map(function(u) { return '<option value="' + u.email + '">' + u.nombre + '</option>'; }).join('');
      return;
    }

    const articulador = _resolverArticuladorPorEmail(articuladorEmail);
    const componente = articulador ? articulador.componente : null;
    const emailArtLower = String(articuladorEmail).trim().toLowerCase();
    const relacionados = (cat && cat.mapaRelaciones && cat.mapaRelaciones[emailArtLower]) || [];
    const relacionadosSet = {};
    relacionados.forEach(function(email) { relacionadosSet[String(email).trim().toLowerCase()] = true; });

    function emailLower(u) { return String(u.email || '').trim().toLowerCase(); }

    const tierRelacionados = todos.filter(function(u) { return relacionadosSet[emailLower(u)]; });
    const tierComponente = componente
      ? todos.filter(function(u) { return u.componente === componente && !relacionadosSet[emailLower(u)]; })
      : [];
    const yaListados = {};
    tierRelacionados.concat(tierComponente).forEach(function(u) { yaListados[emailLower(u)] = true; });
    const hayMasGestores = todos.some(function(u) { return !yaListados[emailLower(u)]; });

    function opcion(u, destacar) {
      const etiqueta = destacar ? '⭐ ' + u.nombre : u.nombre;
      return '<option value="' + u.email + '">' + etiqueta + '</option>';
    }

    let html = '<option value="">Selecciona un gestor...</option>';
    if (tierRelacionados.length) {
      html += '<optgroup label="Gestores Asociados al Articulador">' +
        tierRelacionados.map(function(u) { return opcion(u, true); }).join('') + '</optgroup>';
    }
    if (tierComponente.length) {
      html += '<optgroup label="Gestores del Mismo Componente">' +
        tierComponente.map(function(u) { return opcion(u, false); }).join('') + '</optgroup>';
    }
    if (hayMasGestores) {
      html += '<option value="__TODOS_GESTORES__">— (Ver todos los gestores) —</option>';
    }
    select.innerHTML = html;
  }

  // Cascada: al elegir Articulador, el select de Gestor se reordena por relevancia (co-
  // ocurrencia real > mismo componente > el resto) — salvo que el conmutador "Mostrar todos
  // los funcionarios disponibles" esté activo, en cuyo caso se ignora cualquier filtro.
  function handleArticuladorChangeInModal(articuladorEmail) {
    if (mostrarTodosUsuariosActivo) {
      _poblarSelectGestorAsignacion(null);
      return;
    }
    _poblarSelectGestorAsignacion(articuladorEmail || null);
  }
  window.handleArticuladorChangeInModal = handleArticuladorChangeInModal;

  // Escape valve: "(Ver todos los gestores)" reabre la lista completa, sin filtro ni tiers.
  function handleGestorSelectChangeInModal(valor) {
    if (valor === '__TODOS_GESTORES__') {
      _poblarSelectGestorAsignacion(null);
    }
  }
  window.handleGestorSelectChangeInModal = handleGestorSelectChangeInModal;

  // Resuelve {proyecto, tramo, rt} reales de un nodo a partir de (nivel, idTarget, datosPrecalculados)
  // — idTarget es el identificador propio del nivel (nombre de proyecto/tramo, o el RT), y
  // datosPrecalculados trae el contexto que ese nivel por sí solo no contiene (p.ej. a qué
  // proyecto pertenece el tramo/RT que se está editando).
  function _resolverIdsNodoAsignacion(nivel, idTarget, pre) {
    if (nivel === 'PROYECTO') return { proyecto: idTarget || '', tramo: '', rt: '' };
    if (nivel === 'TRAMO') return { proyecto: (pre && pre.proyecto) || '', tramo: idTarget || '', rt: '' };
    return { proyecto: (pre && pre.proyecto) || '', tramo: (pre && pre.tramo) || '', rt: idTarget || '' };
  }

  function _renderModalAsignacionGranular(nivel, idTarget, pre) {
    const ids = _resolverIdsNodoAsignacion(nivel, idTarget, pre);
    const cat = window.catEstructuraEquipos;

    poblarSelectEquipos('asignacionProyecto', (cat && cat.proyectos) || [], 'Selecciona un proyecto...');
    poblarSelectEquipos('asignacionTramo', [], 'Selecciona un proyecto primero...');
    poblarSelectEquipos('asignacionRT', [], 'Selecciona un tramo primero...');

    document.getElementById('asignacionNivel').value = nivel || 'PROYECTO';
    _poblarSelectArticuladorAsignacion();
    _poblarSelectGestorAsignacion(null);
    document.getElementById('asignacionEmailArticulador').value = '';
    document.getElementById('asignacionEmailGestor').value = '';
    document.getElementById('asignacionBuscadorRT').value = '';
    document.getElementById('infoAsignacionActual').innerHTML = '';

    // ✅ [CONC-FE-17]: arranque en limpio del conmutador "mostrar todos" y del submódulo de
    // alta rápida — no deben arrastrar el estado de una apertura anterior del modal.
    mostrarTodosUsuariosActivo = false;
    const checkTodos = document.getElementById('checkMostrarTodosUsuarios');
    if (checkTodos) checkTodos.checked = false;
    const secCrear = document.getElementById('secCrearUsuarioRapido');
    if (secCrear && secCrear.classList.contains('show')) {
      bootstrap.Collapse.getOrCreateInstance(secCrear).hide();
    }

    if (ids.proyecto) {
      document.getElementById('asignacionProyecto').value = ids.proyecto;
      onEquiposProyectoChange();
      if (ids.tramo) {
        document.getElementById('asignacionTramo').value = ids.tramo;
        onEquiposTramoChange();
        if (ids.rt) {
          document.getElementById('asignacionRT').value = ids.rt;
        }
      }
    }

    onEquiposNivelChange();

    // Precarga automática: un borrador ya pendiente sobre este nodo exacto gana sobre los
    // datosPrecalculados del árbol (seguimos editando ESE valor, no el histórico de Datos).
    const draftExistente = draftParaNodo(nivel, ids.proyecto, ids.tramo, ids.rt);
    const articuladorPre = (draftExistente && draftExistente.articuladorEmail) || (pre && pre.articulador) || '';
    const gestorPre = (draftExistente && draftExistente.gestorEmail) || (pre && pre.gestor) || '';

    if (articuladorPre) {
      document.getElementById('asignacionEmailArticulador').value = articuladorPre;
      handleArticuladorChangeInModal(articuladorPre);
    }
    if (gestorPre) {
      const selectGestor = document.getElementById('asignacionEmailGestor');
      const yaDisponible = Array.prototype.some.call(selectGestor.options, function(o) { return o.value === gestorPre; });
      // El gestor precargado puede pertenecer a otro componente/no tener co-ocurrencia
      // registrada (equipos mixtos/legado) — si los tiers de arriba lo dejaron afuera, se
      // reabre la lista completa para no perder el valor real que traía el nodo.
      if (!yaDisponible) _poblarSelectGestorAsignacion(null);
      selectGestor.value = gestorPre;
    }

    // ✅ [CONC-FE-15]: si el nivel es RT y ya sabemos cuál (llegó del árbol o de un
    // datosPrecalculados con rt), sincroniza el buscador + el panel de estado vigente. Usa
    // window.mapaInversoRTs si ya cargó (fuente de verdad más fresca); si el precache aún no
    // llega (carrera de tiempos con un click muy rápido tras entrar al módulo), muestra lo
    // que ya trajo el árbol (pre) para no dejar el panel vacío.
    if (nivel === 'RT' && ids.rt) {
      document.getElementById('asignacionBuscadorRT').value = ids.rt;
      const datosMapa = (window.mapaInversoRTs || {})[ids.rt];
      _renderInfoAsignacionActual(
        datosMapa ? datosMapa.articulador : (pre && pre.articulador),
        datosMapa ? datosMapa.gestor : (pre && pre.gestor),
        !!draftExistente
      );
    }

    const modalInst = bootstrap.Modal.getOrCreateInstance(document.getElementById('modalAsignacionGranular'));
    modalInst.show();
  }

  // `datosPrecalculados` opcional: { proyecto, tramo, articulador, gestor } — usado por los
  // botones del árbol navegable para abrir el modal ya apuntando al nodo exacto que el
  // usuario clickeó Y con la asignación vigente precargada.
  //
  // ✅ [CONC-FE-14]: si window.catEstructuraEquipos ya está precargado (caso normal — se
  // dispara en segundo plano desde cargarModuloEquipos()), el modal se puebla y abre al
  // instante (0ms de espera de red). Si todavía no llegó (click muy rápido tras entrar al
  // módulo), se muestra un indicador discreto y se abre en cuanto la respuesta llegue —
  // nunca se abre el modal con selects vacíos por una carrera de tiempos.
  function abrirModalAsignacionGranular(nivel, idTarget, datosPrecalculados) {
    const pre = datosPrecalculados || {};
    if (window.catEstructuraEquipos) {
      _renderModalAsignacionGranular(nivel, idTarget, pre);
      return;
    }

    if (typeof window.showNotification === 'function') {
      window.showNotification('Cargando', 'Preparando catálogo de Proyectos y Usuarios...', 'info');
    }
    conCatEstructuraEquipos(function() {
      _renderModalAsignacionGranular(nivel, idTarget, pre);
    });
  }
  window.abrirModalAsignacionGranular = abrirModalAsignacionGranular;

  // ✅ SPRINT6 [CONC-BE-12]: ya NO llama a asignarEquipoGranular() directo — solo escribe
  // en el borrador local (borradorCambiosEquipos) y repinta el árbol con el resaltado
  // optimista. El envío real al servidor ocurre una sola vez, en lote, desde
  // guardarBorradorEquipos() -> asignarEquipoGranularLote().
  function agregarCambioAlBorrador() {
    const nivel = document.getElementById('asignacionNivel').value;
    const proyecto = document.getElementById('asignacionProyecto').value;
    const tramo = document.getElementById('asignacionTramo').value;
    let idTarget = '';
    if (nivel === 'PROYECTO') idTarget = proyecto;
    else if (nivel === 'TRAMO') idTarget = tramo;
    else if (nivel === 'RT') idTarget = document.getElementById('asignacionRT').value;

    const articuladorEmail = document.getElementById('asignacionEmailArticulador').value.trim();
    const gestorSeleccionado = document.getElementById('asignacionEmailGestor').value.trim();
    const gestorEmail = gestorSeleccionado === '__TODOS_GESTORES__' ? '' : gestorSeleccionado;

    if (!idTarget) {
      if (typeof window.showNotification === 'function') {
        window.showNotification('Error', 'Selecciona el ' + nivel.toLowerCase() + ' a asignar.', 'danger');
      }
      return;
    }
    if (!articuladorEmail && !gestorEmail) {
      if (typeof window.showNotification === 'function') {
        window.showNotification('Error', 'Indica al menos un Articulador o un Gestor.', 'danger');
      }
      return;
    }

    const clave = claveDraftEquipos(nivel, proyecto, tramo, idTarget);
    borradorCambiosEquipos[clave] = {
      nivel: nivel,
      idTarget: idTarget,
      proyecto: proyecto,
      tramo: nivel !== 'PROYECTO' ? tramo : '',
      rt: nivel === 'RT' ? idTarget : '',
      articuladorEmail: articuladorEmail || null,
      gestorEmail: gestorEmail || null
    };

    bootstrap.Modal.getInstance(document.getElementById('modalAsignacionGranular')).hide();
    renderArbolAsignacion();
    actualizarBarraBorradorEquipos();
    if (typeof window.showNotification === 'function') {
      window.showNotification('Agregado al borrador', 'El cambio quedó en borrador local — usa "Guardar Todos los Cambios" para aplicarlo.', 'info');
    }
  }
  window.agregarCambioAlBorrador = agregarCambioAlBorrador;

  // ═══════════════════════════════════════════════════════════════════
  // Handover 1-click
  // ═══════════════════════════════════════════════════════════════════
  function abrirModalHandover() {
    const modalInst = bootstrap.Modal.getOrCreateInstance(document.getElementById('modalHandoverEquipos'));
    modalInst.show();
  }
  window.abrirModalHandover = abrirModalHandover;

  function handleReasignarUsuarioMasivo() {
    const origen = document.getElementById('handoverOrigen').value.trim();
    const destino = document.getElementById('handoverDestino').value.trim();
    const rol = document.getElementById('handoverRol').value;

    if (!origen || !destino) {
      if (typeof window.showNotification === 'function') {
        window.showNotification('Error', 'Indica el usuario de origen y de destino.', 'danger');
      }
      return;
    }

    google.script.run
      .withSuccessHandler(function(result) {
        if (result && result.success) {
          if (typeof window.showNotification === 'function') {
            window.showNotification('Éxito', 'Handover aplicado: ' + result.filasAfectadas + ' RT(s) reasignados.', 'success');
          }
          bootstrap.Modal.getInstance(document.getElementById('modalHandoverEquipos')).hide();
          cargarModuloEquipos();
        } else if (typeof window.showNotification === 'function') {
          window.showNotification('Error', (result && result.error) || 'No fue posible reasignar.', 'danger');
        }
      })
      .withFailureHandler(function(error) {
        if (typeof window.showNotification === 'function') {
          window.showNotification('Error', error.message || String(error), 'danger');
        }
      })
      .reasignarUsuarioMasivo(origen, destino, rol, typeof CURRENT_USER_EMAIL !== 'undefined' ? CURRENT_USER_EMAIL : 'Sistema');
  }
  window.handleReasignarUsuarioMasivo = handleReasignarUsuarioMasivo;

  // ═══════════════════════════════════════════════════════════════════
  // ✅ [CONC-FE-15]: Asignación Masiva Offline (Bulk CSV Export/Import) — descarga una
  // plantilla CSV con el ámbito elegido (Proyecto/Tramo, o todo lo visible si no se elige
  // nada), el usuario la edita en Excel sin conexión, y la vuelve a subir para aplicar todos
  // los cambios en un solo lote bajo un único LockService (asignarEquipoGranularLote(), ya
  // existente desde el Modo Borrador — CONC-BE-12).
  // ═══════════════════════════════════════════════════════════════════
  // ✅ [CONC-FE-17]: fix de "descarga congelada" — la versión previa solo mostraba un toast
  // "Generando..." sin ningún indicador bloqueante ni garantía de cierre; si el servidor
  // tardaba (miles de RTs) o fallaba, la pantalla se sentía "pegada" sin resolución visible.
  // Ahora usa el loader global (showLoader/hideLoader, mismo patrón que el resto del app) y
  // AMBOS caminos (éxito y error) lo cierran siempre — nunca queda un spinner sin apagar.
  function handleDescargarPlantillaAsignacion() {
    const proyecto = document.getElementById('exportAsignacionProyecto').value;
    const tramo = document.getElementById('exportAsignacionTramo').value;
    const nivel = tramo ? 'TRAMO' : (proyecto ? 'PROYECTO' : '');
    const idTarget = tramo || proyecto || '';

    if (typeof showLoader === 'function') {
      showLoader('Generando plantilla CSV...', 'Puede tardar unos segundos si hay muchos RTs.');
    }

    google.script.run
      .withSuccessHandler(onCSVSuccess)
      .withFailureHandler(onCSVError)
      .generarPlantillaAsignacionCSV(nivel, idTarget, proyecto);
  }
  window.handleDescargarPlantillaAsignacion = handleDescargarPlantillaAsignacion;

  // Contrato de generarPlantillaAsignacionCSV() (CONC-FE-17): { success, csvString,
  // filename, totalFilas } en éxito, { success:false, error } en fallo — el servidor ya
  // arma el nombre de archivo (con timestamp), el cliente ya no lo reconstruye.
  function onCSVSuccess(res) {
    if (typeof hideLoader === 'function') hideLoader();
    if (!res || !res.success) {
      if (typeof window.showNotification === 'function') {
        window.showNotification('Error', (res && res.error) || 'No fue posible generar la plantilla.', 'danger');
      }
      return;
    }
    _descargarTextoComoArchivo(res.csvString, res.filename);
    if (typeof window.showNotification === 'function') {
      window.showNotification('Listo', (res.totalFilas || 0) + ' fila(s) exportadas a ' + res.filename + '.', 'success');
    }
  }
  window.onCSVSuccess = onCSVSuccess;

  function onCSVError(err) {
    if (typeof hideLoader === 'function') hideLoader();
    if (typeof window.showNotification === 'function') {
      window.showNotification('Error', 'No fue posible generar la plantilla: ' + (err && err.message ? err.message : err), 'danger');
    }
  }
  window.onCSVError = onCSVError;

  // BOM (﻿) al inicio del Blob: sin él, Excel en Windows asume ANSI/Latin-1 y corrompe
  // tildes/eñes al abrir un CSV UTF-8 directamente (doble-click) en vez de importarlo.
  function _descargarTextoComoArchivo(texto, nombreArchivo) {
    const blob = new Blob(['﻿' + texto], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = nombreArchivo;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  const CSV_ASIGNACION_SEPARADOR = ';'; // mismo delimitador que EXPORT_ENGINE.separator (export_backend.js)
  const CSV_ASIGNACION_COLUMNAS_ESPERADAS = ['RT', 'PROYECTO', 'TRAMO', 'ARTICULADOR_EMAIL', 'GESTOR_EMAIL'];

  // Parser CSV mínimo (RFC4180-ish): soporta campos entre comillas con el separador/comillas/
  // saltos de línea escapados dentro, tal como los produce csvEscape() en export_backend.js.
  function _parsearLineasCSV(texto, separador) {
    const filas = [];
    let fila = [];
    let campo = '';
    let dentroComillas = false;

    for (let i = 0; i < texto.length; i++) {
      const c = texto[i];
      if (dentroComillas) {
        if (c === '"') {
          if (texto[i + 1] === '"') { campo += '"'; i++; }
          else { dentroComillas = false; }
        } else {
          campo += c;
        }
      } else if (c === '"') {
        dentroComillas = true;
      } else if (c === separador) {
        fila.push(campo);
        campo = '';
      } else if (c === '\r') {
        // se ignora: el '\n' que sigue cierra la fila
      } else if (c === '\n') {
        fila.push(campo);
        filas.push(fila);
        fila = [];
        campo = '';
      } else {
        campo += c;
      }
    }
    if (campo.length || fila.length) { fila.push(campo); filas.push(fila); }

    return filas.filter(function(f) { return !(f.length === 1 && f[0].trim() === ''); });
  }

  // Validación estricta: RT obligatorio, al menos un email (Articulador o Gestor), y
  // cualquier email SÍ digitado debe existir en window.catEstructuraEquipos (catálogo de
  // USUARIOS activos) — un correo que no está en el catálogo se marca inválido, no se
  // asume válido "porque tiene forma de email".
  function _parsearYValidarCSVAsignacion(texto) {
    const lineas = _parsearLineasCSV(texto, CSV_ASIGNACION_SEPARADOR);
    if (!lineas.length) {
      return { columnasOk: false, error: 'El archivo está vacío.', filas: [] };
    }

    const encabezado = lineas[0].map(function(h) { return String(h || '').trim().toUpperCase(); });
    const faltantes = CSV_ASIGNACION_COLUMNAS_ESPERADAS.filter(function(c) { return encabezado.indexOf(c) < 0; });
    if (faltantes.length) {
      return { columnasOk: false, error: 'Faltan columnas obligatorias: ' + faltantes.join(', ') + '. Descarga la plantilla desde "Descargar Plantilla Asignación" para asegurar el formato correcto.', filas: [] };
    }

    const idx = {};
    CSV_ASIGNACION_COLUMNAS_ESPERADAS.forEach(function(c) { idx[c] = encabezado.indexOf(c); });

    const cat = window.catEstructuraEquipos;
    const catalogoArticuladores = {};
    const catalogoGestores = {};
    ((cat && cat.articuladores) || []).forEach(function(u) { catalogoArticuladores[String(u.email).trim().toLowerCase()] = true; });
    ((cat && cat.gestores) || []).forEach(function(u) { catalogoGestores[String(u.email).trim().toLowerCase()] = true; });

    const filas = lineas.slice(1).map(function(cols, i) {
      const rt = String(cols[idx.RT] || '').trim();
      const proyecto = String(cols[idx.PROYECTO] || '').trim();
      const tramo = String(cols[idx.TRAMO] || '').trim();
      const articuladorEmail = String(cols[idx.ARTICULADOR_EMAIL] || '').trim();
      const gestorEmail = String(cols[idx.GESTOR_EMAIL] || '').trim();

      const errores = [];
      if (!rt) errores.push('RT vacío');
      if (!articuladorEmail && !gestorEmail) errores.push('Debe indicar al menos Articulador o Gestor');
      if (articuladorEmail && !catalogoArticuladores[articuladorEmail.toLowerCase()]) errores.push('Articulador no existe en USUARIOS: ' + articuladorEmail);
      if (gestorEmail && !catalogoGestores[gestorEmail.toLowerCase()]) errores.push('Gestor no existe en USUARIOS: ' + gestorEmail);

      return {
        fila: i + 2, // +1 por el encabezado, +1 porque las filas de Excel empiezan en 1
        rt: rt, proyecto: proyecto, tramo: tramo,
        articuladorEmail: articuladorEmail, gestorEmail: gestorEmail,
        valido: errores.length === 0,
        errores: errores
      };
    }).filter(function(f) { return f.rt || f.proyecto || f.tramo || f.articuladorEmail || f.gestorEmail; });

    return { columnasOk: true, filas: filas };
  }

  function handleArchivoAsignacionSeleccionado(file) {
    if (!file) return;
    procesarArchivoAsignacionCSV(file);
    document.getElementById('inputAsignacionMasivaCSV').value = ''; // permite re-seleccionar el mismo archivo
  }
  window.handleArchivoAsignacionSeleccionado = handleArchivoAsignacionSeleccionado;

  function procesarArchivoAsignacionCSV(file) {
    const reader = new FileReader();
    reader.onload = function(evt) {
      const resultado = _parsearYValidarCSVAsignacion(String(evt.target.result || ''));
      _abrirModalPrevisualizacionCSV(resultado);
    };
    reader.onerror = function() {
      if (typeof window.showNotification === 'function') {
        window.showNotification('Error', 'No fue posible leer el archivo.', 'danger');
      }
    };
    reader.readAsText(file, 'UTF-8');
  }
  window.procesarArchivoAsignacionCSV = procesarArchivoAsignacionCSV;

  function ensureModalPrevisualizacionCSV() {
    if (document.getElementById('modalPrevisualizacionCSV')) return;

    const modalHtml =
      '<div class="modal fade" id="modalPrevisualizacionCSV" tabindex="-1" aria-hidden="true">' +
        '<div class="modal-dialog modal-xl modal-dialog-scrollable">' +
          '<div class="modal-content border-0 shadow-lg">' +
            '<div class="modal-header bg-dark text-white">' +
              '<h5 class="modal-title"><i class="fas fa-table-list"></i> Previsualización de Asignación Masiva</h5>' +
              '<button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>' +
            '</div>' +
            '<div class="modal-body p-3">' +
              '<div id="resumenPrevisualizacionCSV" class="mb-3"></div>' +
              '<div class="table-responsive" style="max-height:400px;">' +
                '<table class="table table-sm table-striped mb-0">' +
                  '<thead><tr><th>Fila</th><th>RT</th><th>Proyecto</th><th>Tramo</th><th>Articulador</th><th>Gestor</th><th>Estado</th></tr></thead>' +
                  '<tbody id="tablaPrevisualizacionCSV"></tbody>' +
                '</table>' +
              '</div>' +
            '</div>' +
            '<div class="modal-footer">' +
              '<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>' +
              '<button type="button" class="btn btn-success" id="btnAprobarCSV" onclick="handleAprobarCambiosCSV()" disabled><i class="fas fa-check-double"></i> Aprobar y Ejecutar Cambios</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';

    const wrapper = document.createElement('div');
    wrapper.innerHTML = modalHtml;
    document.body.appendChild(wrapper.firstElementChild);
  }

  // Filas válidas pendientes de aprobar — vacío también cuando hay errores (bloqueo total:
  // basta 1 sola fila inválida para inhabilitar TODO el lote, no solo esa fila).
  let filasValidasCSVPendientes = [];

  function _abrirModalPrevisualizacionCSV(resultado) {
    ensureModalPrevisualizacionCSV();

    const resumen = document.getElementById('resumenPrevisualizacionCSV');
    const tbody = document.getElementById('tablaPrevisualizacionCSV');
    const btnAprobar = document.getElementById('btnAprobarCSV');

    if (!resultado.columnasOk) {
      resumen.innerHTML = '<div class="alert alert-danger mb-0">' + resultado.error + '</div>';
      tbody.innerHTML = '';
      btnAprobar.disabled = true;
      filasValidasCSVPendientes = [];
      bootstrap.Modal.getOrCreateInstance(document.getElementById('modalPrevisualizacionCSV')).show();
      return;
    }

    const filas = resultado.filas;
    const validas = filas.filter(function(f) { return f.valido; });
    const invalidas = filas.filter(function(f) { return !f.valido; });

    if (!filas.length) {
      resumen.innerHTML = '<div class="alert alert-warning mb-0">El archivo no tiene filas de datos.</div>';
      tbody.innerHTML = '';
      btnAprobar.disabled = true;
      filasValidasCSVPendientes = [];
      bootstrap.Modal.getOrCreateInstance(document.getElementById('modalPrevisualizacionCSV')).show();
      return;
    }

    resumen.innerHTML =
      '<div class="alert ' + (invalidas.length ? 'alert-warning' : 'alert-success') + ' mb-0">' +
        '<strong>' + filas.length + '</strong> fila(s) leídas — ' +
        '<span class="text-success"><strong>' + validas.length + '</strong> válida(s)</span> · ' +
        '<span class="text-danger"><strong>' + invalidas.length + '</strong> con error</span>' +
        (invalidas.length ? '<br><small>Corrige el archivo (o descarga una plantilla nueva) y vuelve a subirlo — no se puede aprobar mientras existan errores.</small>' : '') +
      '</div>';

    tbody.innerHTML = filas.map(function(f) {
      const claseFila = f.valido ? 'table-success' : 'table-danger';
      const estado = f.valido
        ? '<i class="fas fa-circle-check text-success"></i> OK'
        : '<span class="text-danger" title="' + f.errores.join(' | ') + '"><i class="fas fa-circle-xmark"></i> ' + f.errores.join('; ') + '</span>';
      return '<tr class="' + claseFila + '"><td>' + f.fila + '</td><td>' + (f.rt || '-') + '</td><td>' + (f.proyecto || '-') + '</td><td>' + (f.tramo || '-') + '</td>' +
        '<td>' + (f.articuladorEmail || '-') + '</td><td>' + (f.gestorEmail || '-') + '</td><td>' + estado + '</td></tr>';
    }).join('');

    // Bloqueo total: 1 solo error en el archivo inhabilita el botón para TODO el lote.
    filasValidasCSVPendientes = invalidas.length === 0 ? validas : [];
    btnAprobar.disabled = invalidas.length > 0 || validas.length === 0;

    bootstrap.Modal.getOrCreateInstance(document.getElementById('modalPrevisualizacionCSV')).show();
  }

  function handleAprobarCambiosCSV() {
    if (!filasValidasCSVPendientes.length) return;

    const cambiosArray = filasValidasCSVPendientes.map(function(f) {
      return {
        nivel: 'RT',
        idTarget: f.rt,
        articuladorEmail: f.articuladorEmail || null,
        gestorEmail: f.gestorEmail || null
      };
    });

    const btnAprobar = document.getElementById('btnAprobarCSV');
    if (btnAprobar) btnAprobar.disabled = true;
    if (typeof window.showNotification === 'function') {
      window.showNotification('Procesando', 'Aplicando ' + cambiosArray.length + ' fila(s) del archivo...', 'info');
    }

    google.script.run
      .withSuccessHandler(function(result) {
        if (result && result.success) {
          const modalInst = bootstrap.Modal.getInstance(document.getElementById('modalPrevisualizacionCSV'));
          if (modalInst) modalInst.hide();
          filasValidasCSVPendientes = [];

          if (typeof window.showNotification === 'function') {
            const tieneErroresPorNodo = Array.isArray(result.erroresPorNodo) && result.erroresPorNodo.length > 0;
            if (tieneErroresPorNodo) console.warn('Errores por nodo en la carga masiva:', result.erroresPorNodo);
            window.showNotification(
              'Carga masiva aplicada',
              (result.cambiosAplicados || 0) + ' cambio(s) aplicados sobre ' + (result.totalRTsAfectados || 0) + ' RT(s).' +
                (tieneErroresPorNodo ? ' (' + result.erroresPorNodo.length + ' fila(s) con error, ver consola)' : ''),
              tieneErroresPorNodo ? 'warning' : 'success'
            );
          }

          // ✅ [CONC-FE-15]: refresca caché de servidor + repinta el módulo completo — la
          // carga masiva pudo haber tocado docenas/cientos de RTs a la vez, así que el
          // catálogo/índice/árbol/KPIs precacheados quedan obsoletos y se recargan de cero.
          google.script.run.invalidateDataCache();
          window.catEstructuraEquipos = null;
          window.mapaInversoRTs = null;
          cargarModuloEquipos();
        } else if (btnAprobar) {
          btnAprobar.disabled = false;
          if (typeof window.showNotification === 'function') {
            window.showNotification('Error', (result && result.error) || 'No fue posible aplicar la carga masiva.', 'danger');
          }
        }
      })
      .withFailureHandler(function(error) {
        if (btnAprobar) btnAprobar.disabled = false;
        if (typeof window.showNotification === 'function') {
          window.showNotification('Error', error.message || String(error), 'danger');
        }
      })
      .asignarEquipoGranularLote(cambiosArray, typeof CURRENT_USER_EMAIL !== 'undefined' ? CURRENT_USER_EMAIL : 'Sistema');
  }
  window.handleAprobarCambiosCSV = handleAprobarCambiosCSV;

  // ═══════════════════════════════════════════════════════════════════
  // ✅ [CONC-FE-17]: Alta rápida de funcionario in-line — evita que el usuario tenga que
  // salir del modal a editar USUARIOS manualmente cuando la persona que necesita asignar
  // aún no existe en el catálogo.
  // ═══════════════════════════════════════════════════════════════════
  function abrirSubmodalCrearUsuario() {
    const sec = document.getElementById('secCrearUsuarioRapido');
    if (!sec) return;
    document.getElementById('nuevoUsuarioNombre').value = '';
    document.getElementById('nuevoUsuarioEmail').value = '';
    document.getElementById('nuevoUsuarioRol').value = 'Articulador';
    document.getElementById('nuevoUsuarioComponente').value = 'DTDP';
    bootstrap.Collapse.getOrCreateInstance(sec).show();
  }
  window.abrirSubmodalCrearUsuario = abrirSubmodalCrearUsuario;

  function guardarNuevoUsuarioRapido() {
    const nombre = document.getElementById('nuevoUsuarioNombre').value.trim();
    const email = document.getElementById('nuevoUsuarioEmail').value.trim();
    const rol = document.getElementById('nuevoUsuarioRol').value;
    const componente = document.getElementById('nuevoUsuarioComponente').value;

    if (!nombre) {
      if (typeof window.showNotification === 'function') window.showNotification('Error', 'El nombre es obligatorio.', 'danger');
      return;
    }
    if (!/^[^\s@]+@idu\.gov\.co$/i.test(email)) {
      if (typeof window.showNotification === 'function') window.showNotification('Error', 'El email debe pertenecer al dominio @idu.gov.co.', 'danger');
      return;
    }

    if (typeof showLoader === 'function') showLoader('Creando funcionario...', 'Un momento por favor.');

    google.script.run
      .withSuccessHandler(function(result) {
        if (typeof hideLoader === 'function') hideLoader();
        if (!result || !result.success) {
          if (typeof window.showNotification === 'function') {
            window.showNotification('Error', (result && result.error) || 'No fue posible crear el funcionario.', 'danger');
          }
          return;
        }

        const nuevoUsuario = result.usuario;

        // a) Inserta el nuevo usuario en window.catEstructuraEquipos, en la lista que
        // corresponda según su rol — sin esto, el resto de esta función repoblaría los
        // selects contra un catálogo que todavía no lo conoce.
        if (window.catEstructuraEquipos) {
          const lista = nuevoUsuario.rol === 'Gestor' ? window.catEstructuraEquipos.gestores : window.catEstructuraEquipos.articuladores;
          if (Array.isArray(lista)) {
            lista.push({ email: nuevoUsuario.email, nombre: nuevoUsuario.nombre, componente: nuevoUsuario.componente });
          }
        }

        // b) Refresca dinámicamente los desplegables del modal con el catálogo ya actualizado.
        _poblarSelectArticuladorAsignacion();
        const articuladorActual = document.getElementById('asignacionEmailArticulador').value;
        if (mostrarTodosUsuariosActivo) {
          _poblarSelectGestorAsignacion(null);
        } else {
          _poblarSelectGestorAsignacion(articuladorActual || null);
        }

        // c) Pre-selecciona al funcionario recién creado en el campo correspondiente a su rol.
        if (nuevoUsuario.rol === 'Gestor') {
          const selectGestor = document.getElementById('asignacionEmailGestor');
          const yaDisponible = Array.prototype.some.call(selectGestor.options, function(o) { return o.value === nuevoUsuario.email; });
          if (!yaDisponible) _poblarSelectGestorAsignacion(null);
          selectGestor.value = nuevoUsuario.email;
        } else {
          document.getElementById('asignacionEmailArticulador').value = nuevoUsuario.email;
          handleArticuladorChangeInModal(nuevoUsuario.email);
        }

        bootstrap.Collapse.getOrCreateInstance(document.getElementById('secCrearUsuarioRapido')).hide();
        if (typeof window.showNotification === 'function') {
          window.showNotification('Funcionario creado', nuevoUsuario.nombre + ' (' + nuevoUsuario.email + ') agregado y preseleccionado.', 'success');
        }
      })
      .withFailureHandler(function(error) {
        if (typeof hideLoader === 'function') hideLoader();
        if (typeof window.showNotification === 'function') {
          window.showNotification('Error', error.message || String(error), 'danger');
        }
      })
      .crearUsuarioRapidoBackend(nombre, email, rol, componente);
  }
  window.guardarNuevoUsuarioRapido = guardarNuevoUsuarioRapido;
})();
</script>
