  function handleReasignarUsuarioMasivo() {
    const origen = document.getElementById('handoverOrigen').value.trim();
    const destino = document.getElementById('handoverDestino').value.trim();
    const rol = document.getElementById('handoverRol').value;

    if (!origen || !destino) {
      if (typeof window.showNotification === 'function') {
        window.showNotification('Error', 'Indica el usuario de origen y de destino.', 'danger');
      }
      return;
    }

    google.script.run
      .withSuccessHandler(function(result) {
        if (result && result.success) {
          if (typeof window.showNotification === 'function') {
            window.showNotification('Éxito', 'Handover aplicado: ' + result.filasAfectadas + ' RT(s) reasignados.', 'success');
          }
          bootstrap.Modal.getInstance(document.getElementById('modalHandoverEquipos')).hide();
          cargarModuloEquipos();
        } else if (typeof window.showNotification === 'function') {
          window.showNotification('Error', (result && result.error) || 'No fue posible reasignar.', 'danger');
        }
      })
      .withFailureHandler(function(error) {
        if (typeof window.showNotification === 'function') {
          window.showNotification('Error', error.message || String(error), 'danger');
        }
      })
      .reasignarUsuarioMasivo(origen, destino, rol, typeof CURRENT_USER_EMAIL !== 'undefined' ? CURRENT_USER_EMAIL : 'Sistema');
  }
  window.handleReasignarUsuarioMasivo = handleReasignarUsuarioMasivo;

  // ═══════════════════════════════════════════════════════════════════
  // ✅ [CONC-FE-15]: Asignación Masiva Offline (Bulk CSV Export/Import) — descarga una
  // plantilla CSV con el ámbito elegido (Proyecto/Tramo, o todo lo visible si no se elige
  // nada), el usuario la edita en Excel sin conexión, y la vuelve a subir para aplicar todos
  // los cambios en un solo lote bajo un único LockService (asignarEquipoGranularLote(), ya
  // existente desde el Modo Borrador — CONC-BE-12).
  // ═══════════════════════════════════════════════════════════════════
  // ✅ [CONC-FE-17]: fix de "descarga congelada" — la versión previa solo mostraba un toast
  // "Generando..." sin ningún indicador bloqueante ni garantía de cierre; si el servidor
  // tardaba (miles de RTs) o fallaba, la pantalla se sentía "pegada" sin resolución visible.
  // Ahora usa el loader global (showLoader/hideLoader, mismo patrón que el resto del app) y
  // AMBOS caminos (éxito y error) lo cierran siempre — nunca queda un spinner sin apagar.
  function handleDescargarPlantillaAsignacion() {
    const proyecto = document.getElementById('exportAsignacionProyecto').value;
    const tramo = document.getElementById('exportAsignacionTramo').value;
    const nivel = tramo ? 'TRAMO' : (proyecto ? 'PROYECTO' : '');
    const idTarget = tramo || proyecto || '';

    if (typeof showLoader === 'function') {
      showLoader('Generando plantilla CSV...', 'Puede tardar unos segundos si hay muchos RTs.');
    }

    google.script.run
      .withSuccessHandler(onCSVSuccess)
      .withFailureHandler(onCSVError)
      .generarPlantillaAsignacionCSV(nivel, idTarget, proyecto);
  }
  window.handleDescargarPlantillaAsignacion = handleDescargarPlantillaAsignacion;

  // Contrato de generarPlantillaAsignacionCSV() (CONC-FE-17): { success, csvString,
  // filename, totalFilas } en éxito, { success:false, error } en fallo — el servidor ya
  // arma el nombre de archivo (con timestamp), el cliente ya no lo reconstruye.
  function onCSVSuccess(res) {
    if (typeof hideLoader === 'function') hideLoader();
    if (!res || !res.success) {
      if (typeof window.showNotification === 'function') {
        window.showNotification('Error', (res && res.error) || 'No fue posible generar la plantilla.', 'danger');
      }
      return;
    }
    _descargarTextoComoArchivo(res.csvString, res.filename);
    if (typeof window.showNotification === 'function') {
      window.showNotification('Listo', (res.totalFilas || 0) + ' fila(s) exportadas a ' + res.filename + '.', 'success');
    }
  }
  window.onCSVSuccess = onCSVSuccess;

  function onCSVError(err) {
    if (typeof hideLoader === 'function') hideLoader();
    if (typeof window.showNotification === 'function') {
      window.showNotification('Error', 'No fue posible generar la plantilla: ' + (err && err.message ? err.message : err), 'danger');
    }
  }
  window.onCSVError = onCSVError;

  // BOM (﻿) al inicio del Blob: sin él, Excel en Windows asume ANSI/Latin-1 y corrompe
  // tildes/eñes al abrir un CSV UTF-8 directamente (doble-click) en vez de importarlo.
  function _descargarTextoComoArchivo(texto, nombreArchivo) {
    const blob = new Blob(['﻿' + texto], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = nombreArchivo;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  const CSV_ASIGNACION_SEPARADOR = ';'; // mismo delimitador que EXPORT_ENGINE.separator (export_backend.js)
  const CSV_ASIGNACION_COLUMNAS_ESPERADAS = ['RT', 'PROYECTO', 'TRAMO', 'ARTICULADOR_EMAIL', 'GESTOR_EMAIL'];

  // Parser CSV mínimo (RFC4180-ish): soporta campos entre comillas con el separador/comillas/
  // saltos de línea escapados dentro, tal como los produce csvEscape() en export_backend.js.
  function _parsearLineasCSV(texto, separador) {
    const filas = [];
    let fila = [];
    let campo = '';
    let dentroComillas = false;

    for (let i = 0; i < texto.length; i++) {
      const c = texto[i];
      if (dentroComillas) {
        if (c === '"') {
          if (texto[i + 1] === '"') { campo += '"'; i++; }
          else { dentroComillas = false; }
        } else {
          campo += c;
        }
      } else if (c === '"') {
        dentroComillas = true;
      } else if (c === separador) {
        fila.push(campo);
        campo = '';
      } else if (c === '\r') {
        // se ignora: el '\n' que sigue cierra la fila
      } else if (c === '\n') {
        fila.push(campo);
        filas.push(fila);
        fila = [];
        campo = '';
      } else {
        campo += c;
      }
    }
    if (campo.length || fila.length) { fila.push(campo); filas.push(fila); }

    return filas.filter(function(f) { return !(f.length === 1 && f[0].trim() === ''); });
  }

  // Validación estricta: RT obligatorio, al menos un email (Articulador o Gestor), y
  // cualquier email SÍ digitado debe existir en window.catEstructuraEquipos (catálogo de
  // USUARIOS activos) — un correo que no está en el catálogo se marca inválido, no se
  // asume válido "porque tiene forma de email".
  function _parsearYValidarCSVAsignacion(texto) {
    const lineas = _parsearLineasCSV(texto, CSV_ASIGNACION_SEPARADOR);
    if (!lineas.length) {
      return { columnasOk: false, error: 'El archivo está vacío.', filas: [] };
    }

    const encabezado = lineas[0].map(function(h) { return String(h || '').trim().toUpperCase(); });
    const faltantes = CSV_ASIGNACION_COLUMNAS_ESPERADAS.filter(function(c) { return encabezado.indexOf(c) < 0; });
    if (faltantes.length) {
      return { columnasOk: false, error: 'Faltan columnas obligatorias: ' + faltantes.join(', ') + '. Descarga la plantilla desde "Descargar Plantilla Asignación" para asegurar el formato correcto.', filas: [] };
    }

    const idx = {};
    CSV_ASIGNACION_COLUMNAS_ESPERADAS.forEach(function(c) { idx[c] = encabezado.indexOf(c); });

    const cat = window.catEstructuraEquipos;
    const catalogoArticuladores = {};
    const catalogoGestores = {};
    ((cat && cat.articuladores) || []).forEach(function(u) { catalogoArticuladores[String(u.email).trim().toLowerCase()] = true; });
    ((cat && cat.gestores) || []).forEach(function(u) { catalogoGestores[String(u.email).trim().toLowerCase()] = true; });

    const filas = lineas.slice(1).map(function(cols, i) {
      const rt = String(cols[idx.RT] || '').trim();
      const proyecto = String(cols[idx.PROYECTO] || '').trim();
      const tramo = String(cols[idx.TRAMO] || '').trim();
      const articuladorEmail = String(cols[idx.ARTICULADOR_EMAIL] || '').trim();
      const gestorEmail = String(cols[idx.GESTOR_EMAIL] || '').trim();

      const errores = [];
      if (!rt) errores.push('RT vacío');
      if (!articuladorEmail && !gestorEmail) errores.push('Debe indicar al menos Articulador o Gestor');
      if (articuladorEmail && !catalogoArticuladores[articuladorEmail.toLowerCase()]) errores.push('Articulador no existe en USUARIOS: ' + articuladorEmail);
      if (gestorEmail && !catalogoGestores[gestorEmail.toLowerCase()]) errores.push('Gestor no existe en USUARIOS: ' + gestorEmail);

      return {
        fila: i + 2, // +1 por el encabezado, +1 porque las filas de Excel empiezan en 1
        rt: rt, proyecto: proyecto, tramo: tramo,
        articuladorEmail: articuladorEmail, gestorEmail: gestorEmail,
        valido: errores.length === 0,
        errores: errores
      };
    }).filter(function(f) { return f.rt || f.proyecto || f.tramo || f.articuladorEmail || f.gestorEmail; });

    return { columnasOk: true, filas: filas };
  }

  function handleArchivoAsignacionSeleccionado(file) {
    if (!file) return;
    procesarArchivoAsignacionCSV(file);
    document.getElementById('inputAsignacionMasivaCSV').value = ''; // permite re-seleccionar el mismo archivo
  }
  window.handleArchivoAsignacionSeleccionado = handleArchivoAsignacionSeleccionado;

  function procesarArchivoAsignacionCSV(file) {
    const reader = new FileReader();
    reader.onload = function(evt) {
      const resultado = _parsearYValidarCSVAsignacion(String(evt.target.result || ''));
      _abrirModalPrevisualizacionCSV(resultado);
    };
    reader.onerror = function() {
      if (typeof window.showNotification === 'function') {
        window.showNotification('Error', 'No fue posible leer el archivo.', 'danger');
      }
    };
    reader.readAsText(file, 'UTF-8');
  }
  window.procesarArchivoAsignacionCSV = procesarArchivoAsignacionCSV;

  function ensureModalPrevisualizacionCSV() {
    if (document.getElementById('modalPrevisualizacionCSV')) return;

    const modalHtml =
      '<div class="modal fade" id="modalPrevisualizacionCSV" tabindex="-1" aria-hidden="true">' +
        '<div class="modal-dialog modal-xl modal-dialog-scrollable">' +
          '<div class="modal-content border-0 shadow-lg">' +
            '<div class="modal-header bg-dark text-white">' +
              '<h5 class="modal-title"><i class="fas fa-table-list"></i> Previsualización de Asignación Masiva</h5>' +
              '<button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>' +
            '</div>' +
            '<div class="modal-body p-3">' +
              '<div id="resumenPrevisualizacionCSV" class="mb-3"></div>' +
              '<div class="table-responsive" style="max-height:400px;">' +
                '<table class="table table-sm table-striped mb-0">' +
                  '<thead><tr><th>Fila</th><th>RT</th><th>Proyecto</th><th>Tramo</th><th>Articulador</th><th>Gestor</th><th>Estado</th></tr></thead>' +
                  '<tbody id="tablaPrevisualizacionCSV"></tbody>' +
                '</table>' +
              '</div>' +
            '</div>' +
            '<div class="modal-footer">' +
              '<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>' +
              '<button type="button" class="btn btn-success" id="btnAprobarCSV" onclick="handleAprobarCambiosCSV()" disabled><i class="fas fa-check-double"></i> Aprobar y Ejecutar Cambios</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';

    const wrapper = document.createElement('div');
    wrapper.innerHTML = modalHtml;
    document.body.appendChild(wrapper.firstElementChild);
  }

  // Filas válidas pendientes de aprobar — vacío también cuando hay errores (bloqueo total:
  // basta 1 sola fila inválida para inhabilitar TODO el lote, no solo esa fila).
  let filasValidasCSVPendientes = [];

  function _abrirModalPrevisualizacionCSV(resultado) {
    ensureModalPrevisualizacionCSV();

    const resumen = document.getElementById('resumenPrevisualizacionCSV');
    const tbody = document.getElementById('tablaPrevisualizacionCSV');
    const btnAprobar = document.getElementById('btnAprobarCSV');

    if (!resultado.columnasOk) {
      resumen.innerHTML = '<div class="alert alert-danger mb-0">' + resultado.error + '</div>';
      tbody.innerHTML = '';
      btnAprobar.disabled = true;
      filasValidasCSVPendientes = [];
      bootstrap.Modal.getOrCreateInstance(document.getElementById('modalPrevisualizacionCSV')).show();
      return;
    }

    const filas = resultado.filas;
    const validas = filas.filter(function(f) { return f.valido; });
    const invalidas = filas.filter(function(f) { return !f.valido; });

    if (!filas.length) {
      resumen.innerHTML = '<div class="alert alert-warning mb-0">El archivo no tiene filas de datos.</div>';
      tbody.innerHTML = '';
      btnAprobar.disabled = true;
      filasValidasCSVPendientes = [];
      bootstrap.Modal.getOrCreateInstance(document.getElementById('modalPrevisualizacionCSV')).show();
      return;
    }

    resumen.innerHTML =
      '<div class="alert ' + (invalidas.length ? 'alert-warning' : 'alert-success') + ' mb-0">' +
        '<strong>' + filas.length + '</strong> fila(s) leídas — ' +
        '<span class="text-success"><strong>' + validas.length + '</strong> válida(s)</span> · ' +
        '<span class="text-danger"><strong>' + invalidas.length + '</strong> con error</span>' +
        (invalidas.length ? '<br><small>Corrige el archivo (o descarga una plantilla nueva) y vuelve a subirlo — no se puede aprobar mientras existan errores.</small>' : '') +
      '</div>';

    tbody.innerHTML = filas.map(function(f) {
      const claseFila = f.valido ? 'table-success' : 'table-danger';
      const estado = f.valido
        ? '<i class="fas fa-circle-check text-success"></i> OK'
        : '<span class="text-danger" title="' + f.errores.join(' | ') + '"><i class="fas fa-circle-xmark"></i> ' + f.errores.join('; ') + '</span>';
      return '<tr class="' + claseFila + '"><td>' + f.fila + '</td><td>' + (f.rt || '-') + '</td><td>' + (f.proyecto || '-') + '</td><td>' + (f.tramo || '-') + '</td>' +
        '<td>' + (f.articuladorEmail || '-') + '</td><td>' + (f.gestorEmail || '-') + '</td><td>' + estado + '</td></tr>';
    }).join('');

    // Bloqueo total: 1 solo error en el archivo inhabilita el botón para TODO el lote.
    filasValidasCSVPendientes = invalidas.length === 0 ? validas : [];
    btnAprobar.disabled = invalidas.length > 0 || validas.length === 0;

    bootstrap.Modal.getOrCreateInstance(document.getElementById('modalPrevisualizacionCSV')).show();
  }

  function handleAprobarCambiosCSV() {
    if (!filasValidasCSVPendientes.length) return;

    const cambiosArray = filasValidasCSVPendientes.map(function(f) {
      return {
        nivel: 'RT',
        idTarget: f.rt,
        articuladorEmail: f.articuladorEmail || null,
        gestorEmail: f.gestorEmail || null
      };
    });

    const btnAprobar = document.getElementById('btnAprobarCSV');
    if (btnAprobar) btnAprobar.disabled = true;
    if (typeof window.showNotification === 'function') {
      window.showNotification('Procesando', 'Aplicando ' + cambiosArray.length + ' fila(s) del archivo...', 'info');
    }

    google.script.run
      .withSuccessHandler(function(result) {
        if (result && result.success) {
          const modalInst = bootstrap.Modal.getInstance(document.getElementById('modalPrevisualizacionCSV'));
          if (modalInst) modalInst.hide();
          filasValidasCSVPendientes = [];

          if (typeof window.showNotification === 'function') {
            const tieneErroresPorNodo = Array.isArray(result.erroresPorNodo) && result.erroresPorNodo.length > 0;
            if (tieneErroresPorNodo) console.warn('Errores por nodo en la carga masiva:', result.erroresPorNodo);
            window.showNotification(
              'Carga masiva aplicada',
              (result.cambiosAplicados || 0) + ' cambio(s) aplicados sobre ' + (result.totalRTsAfectados || 0) + ' RT(s).' +
                (tieneErroresPorNodo ? ' (' + result.erroresPorNodo.length + ' fila(s) con error, ver consola)' : ''),
              tieneErroresPorNodo ? 'warning' : 'success'
            );
          }

          // ✅ [CONC-FE-15]: refresca caché de servidor + repinta el módulo completo — la
          // carga masiva pudo haber tocado docenas/cientos de RTs a la vez, así que el
          // catálogo/índice/árbol/KPIs precacheados quedan obsoletos y se recargan de cero.
          google.script.run.invalidateDataCache();
          window.catEstructuraEquipos = null;
          window.mapaInversoRTs = null;
          cargarModuloEquipos();
        } else if (btnAprobar) {
          btnAprobar.disabled = false;
          if (typeof window.showNotification === 'function') {
            window.showNotification('Error', (result && result.error) || 'No fue posible aplicar la carga masiva.', 'danger');
          }
        }
      })
      .withFailureHandler(function(error) {
        if (btnAprobar) btnAprobar.disabled = false;
        if (typeof window.showNotification === 'function') {
          window.showNotification('Error', error.message || String(error), 'danger');
        }
      })
      .asignarEquipoGranularLote(cambiosArray, typeof CURRENT_USER_EMAIL !== 'undefined' ? CURRENT_USER_EMAIL : 'Sistema');
  }
  window.handleAprobarCambiosCSV = handleAprobarCambiosCSV;

  // ═══════════════════════════════════════════════════════════════════
  // ✅ [CONC-FE-17]: Alta rápida de funcionario in-line — evita que el usuario tenga que
  // salir del modal a editar USUARIOS manualmente cuando la persona que necesita asignar
  // aún no existe en el catálogo.
  // ═══════════════════════════════════════════════════════════════════
  function abrirSubmodalCrearUsuario() {
    const sec = document.getElementById('secCrearUsuarioRapido');
    if (!sec) return;
    document.getElementById('nuevoUsuarioNombre').value = '';
    document.getElementById('nuevoUsuarioEmail').value = '';
    document.getElementById('nuevoUsuarioRol').value = 'Articulador';
    document.getElementById('nuevoUsuarioComponente').value = 'DTDP';
    bootstrap.Collapse.getOrCreateInstance(sec).show();
  }
  window.abrirSubmodalCrearUsuario = abrirSubmodalCrearUsuario;

  function guardarNuevoUsuarioRapido() {
    const nombre = document.getElementById('nuevoUsuarioNombre').value.trim();
    const email = document.getElementById('nuevoUsuarioEmail').value.trim();
    const rol = document.getElementById('nuevoUsuarioRol').value;
    const componente = document.getElementById('nuevoUsuarioComponente').value;

    if (!nombre) {
      if (typeof window.showNotification === 'function') window.showNotification('Error', 'El nombre es obligatorio.', 'danger');
      return;
    }
    if (!/^[^\s@]+@idu\.gov\.co$/i.test(email)) {
      if (typeof window.showNotification === 'function') window.showNotification('Error', 'El email debe pertenecer al dominio @idu.gov.co.', 'danger');
      return;
    }

    if (typeof showLoader === 'function') showLoader('Creando funcionario...', 'Un momento por favor.');

    google.script.run
      .withSuccessHandler(function(result) {
        if (typeof hideLoader === 'function') hideLoader();
        if (!result || !result.success) {
          if (typeof window.showNotification === 'function') {
            window.showNotification('Error', (result && result.error) || 'No fue posible crear el funcionario.', 'danger');
          }
          return;
        }

        const nuevoUsuario = result.usuario;

        // a) Inserta el nuevo usuario en window.catEstructuraEquipos, en la lista que
        // corresponda según su rol — sin esto, el resto de esta función repoblaría los
        // selects contra un catálogo que todavía no lo conoce.
        if (window.catEstructuraEquipos) {
          const lista = nuevoUsuario.rol === 'Gestor' ? window.catEstructuraEquipos.gestores : window.catEstructuraEquipos.articuladores;
          if (Array.isArray(lista)) {
            lista.push({ email: nuevoUsuario.email, nombre: nuevoUsuario.nombre, componente: nuevoUsuario.componente });
          }
        }

        // b) Refresca dinámicamente los desplegables del modal con el catálogo ya actualizado.
        _poblarSelectArticuladorAsignacion();
        const articuladorActual = document.getElementById('asignacionEmailArticulador').value;
        if (mostrarTodosUsuariosActivo) {
          _poblarSelectGestorAsignacion(null);
        } else {
          _poblarSelectGestorAsignacion(articuladorActual || null);
        }

        // c) Pre-selecciona al funcionario recién creado en el campo correspondiente a su rol.
        if (nuevoUsuario.rol === 'Gestor') {
          const selectGestor = document.getElementById('asignacionEmailGestor');
          const yaDisponible = Array.prototype.some.call(selectGestor.options, function(o) { return o.value === nuevoUsuario.email; });
          if (!yaDisponible) _poblarSelectGestorAsignacion(null);
          selectGestor.value = nuevoUsuario.email;
        } else {
          document.getElementById('asignacionEmailArticulador').value = nuevoUsuario.email;
          handleArticuladorChangeInModal(nuevoUsuario.email);
        }

        bootstrap.Collapse.getOrCreateInstance(document.getElementById('secCrearUsuarioRapido')).hide();
        if (typeof window.showNotification === 'function') {
          window.showNotification('Funcionario creado', nuevoUsuario.nombre + ' (' + nuevoUsuario.email + ') agregado y preseleccionado.', 'success');
        }
      })
      .withFailureHandler(function(error) {
        if (typeof hideLoader === 'function') hideLoader();
        if (typeof window.showNotification === 'function') {
          window.showNotification('Error', error.message || String(error), 'danger');
        }
      })
      .crearUsuarioRapidoBackend(nombre, email, rol, componente);
  }
  window.guardarNuevoUsuarioRapido = guardarNuevoUsuarioRapido;
})();
</script>
