<script>
(function() {
  const EQUIPOS_ROLES_CON_ACCESO = ['Administrador', 'Articulador', 'Gestor'];
  const EQUIPOS_IDB_NAME = 'equipos-cache-v1';
  const EQUIPOS_IDB_STORE = 'stats';

  // ═══════════════════════════════════════════════════════════════════
  // IndexedDB (Directiva 1 — cero localStorage). Caché por usuario para
  // pintado optimista de los KPI mientras se recalcula en el servidor.
  // ═══════════════════════════════════════════════════════════════════
  function equiposCacheKey() {
    return 'equipos_cache_' + (typeof CURRENT_USER_EMAIL !== 'undefined' ? CURRENT_USER_EMAIL : 'anonimo');
  }

  function equiposIdbOpen() {
    return new Promise(function(resolve) {
      if (!('indexedDB' in window)) return resolve(null);
      const request = indexedDB.open(EQUIPOS_IDB_NAME, 1);
      request.onupgradeneeded = function() {
        const db = request.result;
        if (!db.objectStoreNames.contains(EQUIPOS_IDB_STORE)) {
          db.createObjectStore(EQUIPOS_IDB_STORE);
        }
      };
      request.onsuccess = function() { resolve(request.result); };
      request.onerror = function() { resolve(null); };
    });
  }

  function equiposCacheRead() {
    return equiposIdbOpen().then(function(db) {
      if (!db) return null;
      return new Promise(function(resolve) {
        const tx = db.transaction(EQUIPOS_IDB_STORE, 'readonly');
        const store = tx.objectStore(EQUIPOS_IDB_STORE);
        const req = store.get(equiposCacheKey());
        req.onsuccess = function() { resolve(req.result || null); };
        req.onerror = function() { resolve(null); };
      });
    });
  }

  function equiposCacheWrite(payload) {
    return equiposIdbOpen().then(function(db) {
      if (!db) return false;
      return new Promise(function(resolve) {
        const tx = db.transaction(EQUIPOS_IDB_STORE, 'readwrite');
        const store = tx.objectStore(EQUIPOS_IDB_STORE);
        store.put({ payload: payload, savedAt: Date.now() }, equiposCacheKey());
        tx.oncomplete = function() { resolve(true); };
        tx.onerror = function() { resolve(false); };
      });
    });
  }

  // ═══════════════════════════════════════════════════════════════════
  // Visibilidad de navegación por rol — el backend igual filtra los
  // datos (getDashboardData/getEstadisticasCargaEquipos), esto es solo
  // higiene de UI para no ofrecer un módulo que el usuario no usará.
  // ═══════════════════════════════════════════════════════════════════
  function aplicarVisibilidadNavEquipos() {
    const nav = document.getElementById('navEquipos');
    if (!nav) return;
    if (typeof currentRole !== 'undefined' && EQUIPOS_ROLES_CON_ACCESO.indexOf(currentRole) >= 0) {
      nav.classList.remove('d-none');
    } else {
      nav.classList.add('d-none');
    }
  }
  window.aplicarVisibilidadNavEquipos = aplicarVisibilidadNavEquipos;

  // ═══════════════════════════════════════════════════════════════════
  // KPIs / Tablero de carga
  // ═══════════════════════════════════════════════════════════════════
  function pintarKpisEquipos(stats) {
    const totalEl = document.getElementById('kpiEquiposTotalRTs');
    const porAsignarEl = document.getElementById('kpiEquiposPorAsignar');
    if (totalEl) totalEl.textContent = (stats.totalRTs !== undefined && stats.totalRTs !== null) ? stats.totalRTs : '-';
    if (porAsignarEl) porAsignarEl.textContent = (stats.rtsPorAsignar === null || stats.rtsPorAsignar === undefined) ? 'N/A' : stats.rtsPorAsignar;
  }

  // ═══════════════════════════════════════════════════════════════════
  // ✅ [CONC-FE-15]: Panel "Equipos de Trabajo" — reemplaza las 2 tablas planas de
  // distribución (Articulador y Gestor por separado, sin relación visible entre ambas)
  // por un acordeón con jerarquía real: Articulador como cabecera, sus Gestores como
  // filas hijas con su propio conteo de RTs, alimentado por getEquiposConsolidados().
  // ═══════════════════════════════════════════════════════════════════
  function renderEquiposConsolidados(equipos) {
    const contenedor = document.getElementById('acordeonEquiposTrabajo');
    if (!contenedor) return;
    if (!Array.isArray(equipos) || !equipos.length) {
      contenedor.innerHTML = '<div class="text-center text-muted py-3">Sin equipos consolidados todavía.</div>';
      return;
    }

    contenedor.innerHTML = equipos.map(function(eq, idx) {
      const totalRTs = eq.gestores.reduce(function(acc, g) { return acc + g.rtsAsignados; }, 0);
      const collapseId = 'colapsoEquipoTrabajo' + idx;
      const filasGestor = eq.gestores.map(function(g) {
        const esSinAsignar = g.email === 'Sin asignar';
        return '<li class="list-group-item d-flex justify-content-between align-items-center' + (esSinAsignar ? ' text-danger fst-italic' : '') + '">' +
          '<span><i class="fas fa-user-gear me-2"></i>' + g.email + '</span>' +
          '<span class="badge bg-secondary rounded-pill">' + g.rtsAsignados + ' RT(s)</span></li>';
      }).join('');

      return (
        '<div class="accordion-item">' +
          '<h2 class="accordion-header">' +
            '<button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#' + collapseId + '">' +
              '<i class="fas fa-user-tie me-2"></i>' + eq.articuladorEmail +
              ' <span class="badge bg-dark ms-2">' + totalRTs + ' RT(s) · ' + eq.gestores.length + ' gestor(es)</span>' +
            '</button>' +
          '</h2>' +
          '<div id="' + collapseId + '" class="accordion-collapse collapse" data-bs-parent="#acordeonEquiposTrabajo">' +
            '<div class="accordion-body p-0">' +
              '<ul class="list-group list-group-flush">' + filasGestor + '</ul>' +
            '</div>' +
          '</div>' +
        '</div>'
      );
    }).join('');
  }

  function cargarEquiposConsolidados() {
    google.script.run
      .withSuccessHandler(function(result) {
        const contenedor = document.getElementById('acordeonEquiposTrabajo');
        if (result && result.success) {
          renderEquiposConsolidados(result.equipos);
        } else if (contenedor) {
          contenedor.innerHTML = '<div class="alert alert-danger m-2">' + ((result && result.error) || 'No fue posible cargar los equipos consolidados.') + '</div>';
        }
      })
      .withFailureHandler(function(error) {
        const contenedor = document.getElementById('acordeonEquiposTrabajo');
        if (contenedor) contenedor.innerHTML = '<div class="alert alert-danger m-2">' + (error.message || error) + '</div>';
      })
      .getEquiposConsolidados();
  }

  // ═══════════════════════════════════════════════════════════════════
  // ✅ [CONC-FE-14]: catálogo unificado (Proyectos/Tramos/RTs + Articuladores/Gestores +
  // mapa de relaciones) para el modal de Asignación Granular — un solo endpoint
  // (getProyectosYListaUsuarios()) en vez de la cascada de round-trips previa
  // (getProyectosConteo -> getTramosPorProyecto por cada expand -> getRTsPorTramo por
  // cada expand -> getUsuariosParaAsignacionEquipos). Se precarga en segundo plano al
  // entrar al módulo para que abrirModalAsignacionGranular() pueda poblar el selector de
  // Proyecto de forma INSTANTÁNEA (0ms) la primera vez que el usuario hace click en
  // "editar" — sin este precache, esa primera apertura tendría que esperar un
  // round-trip completo antes de poder mostrar nada.
  // ═══════════════════════════════════════════════════════════════════
  window.catEstructuraEquipos = null; // {proyectos, tramosPorProyecto, rtsPorTramo, articuladores, gestores, mapaRelaciones}
  let catEstructuraEquiposCargando = false;
  let catEstructuraEquiposCallbacksPendientes = [];

  function precargarCatEstructuraEquipos() {
    if (window.catEstructuraEquipos || catEstructuraEquiposCargando) return;
    catEstructuraEquiposCargando = true;
    google.script.run
      .withSuccessHandler(function(result) {
        catEstructuraEquiposCargando = false;
        if (result && result.success) {
          window.catEstructuraEquipos = result;
          // ✅ [CONC-FE-15]: el selector de ámbito de exportación (cabecera del módulo) se
          // alimenta del mismo catálogo, sin round-trip adicional.
          const selectExportProyecto = document.getElementById('exportAsignacionProyecto');
          if (selectExportProyecto) poblarSelectEquipos('exportAsignacionProyecto', result.proyectos || [], 'Todos los proyectos');
        } else {
          console.warn('⚠️ getProyectosYListaUsuarios() no tuvo éxito: ' + ((result && result.error) || 'sin detalle'));
        }
        const callbacks = catEstructuraEquiposCallbacksPendientes;
        catEstructuraEquiposCallbacksPendientes = [];
        callbacks.forEach(function(cb) { cb(); });
      })
      .withFailureHandler(function(error) {
        catEstructuraEquiposCargando = false;
        console.warn('⚠️ Error cargando getProyectosYListaUsuarios(): ' + (error.message || error));
        const callbacks = catEstructuraEquiposCallbacksPendientes;
        catEstructuraEquiposCallbacksPendientes = [];
        callbacks.forEach(function(cb) { cb(); });
      })
      .getProyectosYListaUsuarios();
  }

  // Ejecuta `cb` en cuanto window.catEstructuraEquipos esté disponible: de inmediato si ya
  // está cargado, o encolado a la respuesta en curso/nueva si no.
  function conCatEstructuraEquipos(cb) {
    if (window.catEstructuraEquipos) { cb(); return; }
    catEstructuraEquiposCallbacksPendientes.push(cb);
    precargarCatEstructuraEquipos();
  }

  // ✅ [CONC-FE-15]: índice inverso RT -> {proyecto,tramo,articulador,gestor}, precargado en
  // segundo plano para que el buscador directo de RT del modal (handleRTSelectionDirecta())
  // resuelva en memoria, sin round-trip por cada RT que el usuario escribe/selecciona.
  window.mapaInversoRTs = null;

  function precargarMapaInversoRTs() {
    google.script.run
      .withSuccessHandler(function(result) {
        window.mapaInversoRTs = (result && result.success) ? result.indice : {};
        if (!(result && result.success)) {
          console.warn('⚠️ getIndiceInversoRTs() no tuvo éxito: ' + ((result && result.error) || 'sin detalle'));
        }
      })
      .withFailureHandler(function(error) {
        window.mapaInversoRTs = {};
        console.warn('⚠️ Error cargando getIndiceInversoRTs(): ' + (error.message || error));
      })
      .getIndiceInversoRTs();
  }

  let mesaEquiposResumen = null;
  let mesaEquiposProyecto = null;
  let mesaEquiposFilas = [];
  let mesaEquiposFilasFiltradas = [];
  let mesaEquiposCambios = {};
  let mesaEquiposSeleccion = {};
  let mesaEquiposPaginaActual = 1;
  let equiposVistaArbolCargada = false;
  let equiposVistaConsolidadaCargada = false;
  const MESA_EQUIPOS_PAGE_SIZE = 250;

  function _escapeHtmlEquipos(texto) {
    return String(texto == null ? '' : texto)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function _escapeAttrEquipos(texto) {
    return String(texto == null ? '' : texto)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;')
      .replace(/\r/g, '&#13;')
      .replace(/\n/g, '&#10;');
  }

  function _asegurarEventosMesaResumen() {
    if (window.__equiposListenersInit) return;
    document.addEventListener('click', function(ev) {
      const btn = ev.target && ev.target.closest ? ev.target.closest('button[data-action="abrir-mesa"]') : null;
      if (!btn) return;
      ev.preventDefault();
      ev.stopPropagation();
      const proyecto = btn.getAttribute('data-proyecto') || '';
      abrirMesaProyecto(proyecto);
    });
    // ✅ Delegación para los controles de fila de la mesa (checkbox de selección
    // y select de "Nuevo gestor"). Reemplaza los onchange inline que embebían
    // JSON.stringify(fila.rt) dentro de un atributo HTML entre comillas dobles
    // (rompía el atributo y producía "Unexpected end of input" al compilarse
    // como handler — ver DOCUMENTACION_TECNICA_VIVA.md). Los valores viajan por
    // data-rt (ya escapado por _escapeAttrEquipos en _renderFilaRTMesa) en vez
    // de interpolarse en el string del atributo.
    document.addEventListener('change', function(ev) {
      const target = ev.target;
      const action = target && target.getAttribute ? target.getAttribute('data-action') : null;
      if (!action) return;
      const rt = target.getAttribute('data-rt') || '';
      if (action === 'toggle-seleccion-rt-equipo') {
        toggleSeleccionFilaEquipo(rt, target.checked);
      } else if (action === 'toggle-seleccion-grupo-equipo') {
        toggleSeleccionGrupoMesa(target.getAttribute('data-kind') || '', target.getAttribute('data-key') || '', target.checked);
      } else if (action === 'cambiar-gestor-rt-equipo') {
        cambiarGestorFila(rt, target.value);
      } else if (action === 'cambiar-articulador-rt-equipo') {
        cambiarArticuladorFila(rt, target.value);
      }
    });
    window.__equiposListenersInit = true;
  }

  function _estadoFilaMesa(fila) {
    if (!fila.articuladorEmail && !fila.gestorEmail) return 'SIN_ASIGNAR';
    if (!fila.articuladorEmail) return 'SIN_ARTICULADOR';
    if (!fila.gestorEmail) return 'SIN_GESTOR';
    return 'COMPLETO';
  }

  function _gestorEfectivoFila(fila) {
    const pendiente = mesaEquiposCambios[fila.rt];
    if (pendiente) return String(pendiente.gestorEmail || '').trim().toLowerCase();
    return String(fila.gestorEmail || '').trim().toLowerCase();
  }

  function _articuladorEfectivoFila(fila) {
    const pendiente = mesaEquiposCambios[fila.rt];
    if (pendiente && Object.prototype.hasOwnProperty.call(pendiente, 'articuladorEmail')) return String(pendiente.articuladorEmail || '').trim().toLowerCase();
    return String(fila.articuladorEmail || '').trim().toLowerCase();
  }

  function _nombreArticulador(email) {
    const art = ((mesaEquiposProyecto && mesaEquiposProyecto.articuladores) || []).find(function(a) { return a.email === email; });
    return art ? art.nombre : '';
  }

  function _nombreGestor(email) {
    const ges = ((mesaEquiposProyecto && mesaEquiposProyecto.gestores) || []).find(function(g) { return g.email === email; });
    return ges ? ges.nombre : '';
  }

  function _gestoresDisponiblesParaArticulador(articuladorEmail) {
    const data = mesaEquiposProyecto || {};
    const todos = (data.gestores || []).reduce(function(acc, g) {
      if (g && g.email) acc[g.email] = g;
      return acc;
    }, {});
    const relaciones = data.relacionesGestores || {};
    const asociados = articuladorEmail ? (relaciones[articuladorEmail] || []) : [];

    function toGestoresList(emails, artRef) {
      const uniq = {};
      (emails || []).forEach(function(e) {
        const key = String(e || '').trim().toLowerCase();
        if (key) uniq[key] = true;
      });
      return Object.keys(uniq).map(function(email) {
        return todos[email] || { email: email, nombre: email, articuladorEmail: artRef || '' };
      }).sort(function(a, b) { return a.email.localeCompare(b.email); });
    }

    // 1) Con articulador: prioriza SOLO gestores asociados a ese articulador.
    if (asociados.length) {
      return toGestoresList(asociados, articuladorEmail);
    }

    // 2) Sin articulador (o sin asociados): usa gestores observados en el proyecto actual.
    const gestoresProyectoSet = {};
    mesaEquiposFilas.forEach(function(f) {
      const g = String(f.gestorEmail || '').trim().toLowerCase();
      if (g) gestoresProyectoSet[g] = true;
    });
    Object.keys(relaciones).forEach(function(art) {
      (relaciones[art] || []).forEach(function(g) {
        const email = String(g || '').trim().toLowerCase();
        if (email) gestoresProyectoSet[email] = true;
      });
    });
    const gestoresProyecto = toGestoresList(Object.keys(gestoresProyectoSet), '');
    if (gestoresProyecto.length) return gestoresProyecto;

    // 3) Fallback final: todos los gestores activos disponibles.
    return Object.keys(todos).map(function(k) { return todos[k]; }).sort(function(a, b) { return a.email.localeCompare(b.email); });
  }

  function renderShellGestionEquipos() {
    const root = document.getElementById('moduloGestionEquipos');
    if (!root) return;

    root.innerHTML =
      '<div class="page-header">' +
        '<h2><i class="fas fa-users-gear"></i> Gestión de Equipos y Jerarquía RBAC</h2>' +
        '<div class="page-actions flex-wrap align-items-center">' +
          '<button class="btn-secondary-custom" onclick="cargarModuloEquipos()"><i class="fas fa-rotate"></i> Recargar</button>' +
          '<button class="btn btn-warning" onclick="handleCargaLineaCero()"><i class="fas fa-flag-checkered"></i> Cargar Línea Cero</button>' +
          '<button class="btn-primary-custom" onclick="abrirModalHomologacionEquipos()"><i class="fas fa-user-check"></i> Homologación</button>' +
          '<button class="btn-primary-custom" onclick="abrirModalAsignacionGranular(\'PROYECTO\', \'\', {})"><i class="fas fa-diagram-project"></i> Asignación Granular</button>' +
          '<button class="btn-secondary-custom" onclick="window.toggleVistaSecundariaEquipos(\'consolidado\')"><i class="fas fa-people-group"></i> Equipos por articulador</button>' +
          '<button class="btn-secondary-custom" onclick="window.toggleVistaSecundariaEquipos(\'arbol\')"><i class="fas fa-sitemap"></i> Vista árbol</button>' +
        '</div>' +
      '</div>' +
      '<div class="row g-3 mb-3">' +
        '<div class="col-md-6 col-lg-3"><div class="card shadow-sm h-100"><div class="card-body text-center"><div class="text-muted small text-uppercase">Total RTs visibles</div><div class="fs-2 fw-bold" id="kpiMesaTotalRTs">-</div></div></div></div>' +
        '<div class="col-md-6 col-lg-3"><div class="card shadow-sm h-100 border-success"><div class="card-body text-center"><div class="text-muted small text-uppercase">RTs asignados</div><div class="fs-2 fw-bold text-success" id="kpiMesaAsignados">-</div></div></div></div>' +
        '<div class="col-md-6 col-lg-3"><div class="card shadow-sm h-100 border-warning"><div class="card-body text-center"><div class="text-muted small text-uppercase">RTs sin asignar</div><div class="fs-2 fw-bold text-warning" id="kpiMesaSinAsignar">-</div></div></div></div>' +
        '<div class="col-md-6 col-lg-3"><div class="card shadow-sm h-100 border-info"><div class="card-body text-center"><div class="text-muted small text-uppercase">Gestores activos</div><div class="fs-2 fw-bold text-info" id="kpiMesaGestores">-</div></div></div></div>' +
      '</div>' +
      '<div id="mesaEquiposHome" class="card shadow-sm">' +
        '<div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">' +
          '<span><i class="fas fa-table"></i> Proyectos visibles</span>' +
          '<small id="mesaEquiposUsuarioContexto"></small>' +
        '</div>' +
        '<div class="card-body p-0">' +
          '<div class="table-responsive">' +
            '<table class="table table-hover mb-0">' +
              '<thead class="table-light"><tr><th>Proyecto</th><th>Total RTs</th><th>Asignados</th><th>Sin asignar</th><th>Gestores</th><th>Articuladores</th><th></th></tr></thead>' +
              '<tbody id="tablaResumenGestionEquipos"><tr><td colspan="7" class="text-center text-muted py-4"><i class="fas fa-spinner fa-spin"></i> Cargando resumen...</td></tr></tbody>' +
            '</table>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div id="mesaEquiposProyecto" class="card shadow-sm mt-3 d-none">' +
        '<div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">' +
          '<div><strong id="mesaTituloProyecto">Mesa de asignación</strong></div>' +
          '<div class="d-flex gap-2">' +
            '<button class="btn btn-light btn-sm" onclick="window.volverResumenGestionEquipos()"><i class="fas fa-arrow-left"></i> Volver</button>' +
            '<button class="btn btn-success btn-sm" onclick="guardarCambiosMesaEquipos()"><i class="fas fa-floppy-disk"></i> Guardar cambios</button>' +
            '<button class="btn btn-outline-light btn-sm" onclick="descartarCambiosMesaEquipos()"><i class="fas fa-eraser"></i> Descartar</button>' +
          '</div>' +
        '</div>' +
        '<div class="card-body">' +
          '<div class="row g-2 mb-3">' +
            '<div class="col-md-2"><label class="form-label small mb-1">Tramo</label><select id="filtroMesaTramo" class="form-select form-select-sm" onchange="aplicarFiltrosMesaEquipos()"></select></div>' +
            '<div class="col-md-2"><label class="form-label small mb-1">Articulador</label><select id="filtroMesaArticulador" class="form-select form-select-sm" onchange="aplicarFiltrosMesaEquipos()"></select></div>' +
            '<div class="col-md-2"><label class="form-label small mb-1">Gestor actual</label><select id="filtroMesaGestor" class="form-select form-select-sm" onchange="aplicarFiltrosMesaEquipos()"></select></div>' +
            '<div class="col-md-2"><label class="form-label small mb-1">Estado</label><select id="filtroMesaEstado" class="form-select form-select-sm" onchange="aplicarFiltrosMesaEquipos()"><option value="">Todos</option><option value="COMPLETO">Completo</option><option value="SIN_GESTOR">Sin gestor</option><option value="SIN_ARTICULADOR">Sin articulador</option><option value="SIN_ASIGNAR">Sin asignar</option></select></div>' +
            '<div class="col-md-4"><label class="form-label small mb-1">RT</label><input id="filtroMesaRT" type="text" class="form-control form-control-sm" placeholder="Buscar RT..." oninput="aplicarFiltrosMesaEquipos()"></div>' +
          '</div>' +
          '<div class="row g-3">' +
            '<div class="col-lg-9">' +
              '<div class="d-flex flex-wrap gap-2 align-items-center mb-2">' +
                '<select id="gestorLoteMesa" class="form-select form-select-sm" style="width:auto; min-width:260px;"></select>' +
                '<select id="articuladorLoteMesa" class="form-select form-select-sm" style="width:auto; min-width:260px;"></select>' +
                '<button class="btn btn-sm btn-outline-primary" onclick="aplicarGestorASeleccionados()"><i class="fas fa-users"></i> Aplicar a seleccionados</button>' +

  function aplicarFiltrosMesaEquipos() {
    if (!mesaEquiposProyecto) return;
    const tramo = String((document.getElementById('filtroMesaTramo') || {}).value || '').trim();
    const articulador = String((document.getElementById('filtroMesaArticulador') || {}).value || '').trim().toLowerCase();
    const gestor = String((document.getElementById('filtroMesaGestor') || {}).value || '').trim().toLowerCase();
    const estado = String((document.getElementById('filtroMesaEstado') || {}).value || '').trim();
    const rt = String((document.getElementById('filtroMesaRT') || {}).value || '').trim().toLowerCase();

    mesaEquiposFilasFiltradas = mesaEquiposFilas.filter(function(f) {
      const gestorActual = _gestorEfectivoFila(f);
      const estadoActual = _estadoFilaMesa({
        articuladorEmail: f.articuladorEmail,
        gestorEmail: gestorActual
      });
      if (tramo && f.tramo !== tramo) return false;
      if (articulador && f.articuladorEmail !== articulador) return false;
      if (gestor && gestorActual !== gestor) return false;
      if (estado && estado !== estadoActual) return false;
      if (rt && f.rt.toLowerCase().indexOf(rt) < 0) return false;
      return true;
    });
    mesaEquiposFilasFiltradas.sort(_compararFilasMesa);

    mesaEquiposPaginaActual = 1;
    renderTablaMesaEquipos();
    actualizarCargaGestoresLocal();
  }
  window.aplicarFiltrosMesaEquipos = aplicarFiltrosMesaEquipos;

  function _compararFilasMesa(a, b) {
    const aGes = _gestorEfectivoFila(a);
    const bGes = _gestorEfectivoFila(b);
    const aSin = aGes ? 0 : 1;
    const bSin = bGes ? 0 : 1;
    if (aSin !== bSin) return aSin - bSin; // SIN ASIGNACIÓN al final

    const artA = a.articuladorEmail || '~~~~';
    const artB = b.articuladorEmail || '~~~~';
    if (artA !== artB) return artA.localeCompare(artB);
    if (a.proyecto !== b.proyecto) return a.proyecto.localeCompare(b.proyecto);
    if (a.tramo !== b.tramo) return a.tramo.localeCompare(b.tramo);
    return String(a.rt || '').localeCompare(String(b.rt || ''));
  }

  function _statsGrupoMesa(filas) {
    let asignados = 0;
    let sinGestor = 0;
    let pendientes = 0;
    filas.forEach(function(f) {
      if (_gestorEfectivoFila(f)) asignados++;
      else sinGestor++;
      if (mesaEquiposCambios[f.rt]) pendientes++;
    });
    return {
      totalRTs: filas.length,
      asignados: asignados,
      sinGestor: sinGestor,
      pendientes: pendientes
    };
  }

  function _agruparFilasMesa(filas) {
    const raiz = {};
    const sinAsignacion = [];

    filas.forEach(function(f) {
      const gestor = _gestorEfectivoFila(f);
      if (!gestor) {
        sinAsignacion.push(f);
        return;
      }

      const artKey = f.articuladorEmail || 'sin-articulador';
      if (!raiz[artKey]) raiz[artKey] = { key: artKey, proyectos: {}, filas: [] };
      raiz[artKey].filas.push(f);

      const proyKey = f.proyecto || '';
      if (!raiz[artKey].proyectos[proyKey]) raiz[artKey].proyectos[proyKey] = { key: proyKey, tramos: {}, filas: [] };
      raiz[artKey].proyectos[proyKey].filas.push(f);

      const tramoKey = f.tramo || '';
      if (!raiz[artKey].proyectos[proyKey].tramos[tramoKey]) raiz[artKey].proyectos[proyKey].tramos[tramoKey] = { key: tramoKey, filas: [] };
      raiz[artKey].proyectos[proyKey].tramos[tramoKey].filas.push(f);
    });

    const articuladores = Object.keys(raiz).sort().map(function(artKey) {
      const nArt = raiz[artKey];
      const proyectos = Object.keys(nArt.proyectos).sort().map(function(proyKey) {
        const nProy = nArt.proyectos[proyKey];
        const tramos = Object.keys(nProy.tramos).sort().map(function(tramoKey) {
          const nTramo = nProy.tramos[tramoKey];
          nTramo.filas.sort(function(a, b) { return String(a.rt || '').localeCompare(String(b.rt || '')); });
          nTramo.stats = _statsGrupoMesa(nTramo.filas);
          return nTramo;
        });
        nProy.tramos = tramos;
        nProy.stats = _statsGrupoMesa(nProy.filas);
        return nProy;
      });
      nArt.proyectos = proyectos;
      nArt.stats = _statsGrupoMesa(nArt.filas);
      return nArt;
    });

    sinAsignacion.sort(_compararFilasMesa);
    return {
      articuladores: articuladores,
      sinAsignacion: sinAsignacion,
      statsSinAsignacion: _statsGrupoMesa(sinAsignacion)
    };
  }

  function _renderBadgeStatsGrupo(stats) {

    })).join('');
    const estadoActual = _estadoFilaMesa({ articuladorEmail: fila.articuladorEmail, gestorEmail: gestorNuevo });

    const rtAttr = _escapeAttrEquipos(fila.rt);
    return '<tr' + (cambioPendiente ? ' class="table-warning"' : '') + '>' +
      '<td><input type="checkbox" ' + (seleccionado ? 'checked ' : '') + 'data-action="toggle-seleccion-rt-equipo" data-rt="' + rtAttr + '"></td>' +
      '<td>' + _escapeHtmlEquipos(fila.tramo || '-') + '</td>' +
      '<td><strong>' + _escapeHtmlEquipos(fila.rt) + '</strong></td>' +
      '<td><div class="small text-muted mb-1">' + _escapeHtmlEquipos(_nombreArticulador(articuladorActual) || articuladorActual || 'Sin asignar') + '</div><select class="form-select form-select-sm" data-action="cambiar-articulador-rt-equipo" data-rt="' + rtAttr + '">' + opcionesArticulador + '</select></td>' +
      '<td><div class="small text-muted mb-1">' + _escapeHtmlEquipos(_nombreGestor(gestorActual) || gestorActual || 'Sin asignar') + '</div><select class="form-select form-select-sm" data-action="cambiar-gestor-rt-equipo" data-rt="' + rtAttr + '">' + opcionesGestor + '</select></td>' +
      '<td><span class="badge ' + (estadoActual === 'COMPLETO' ? 'bg-success' : 'bg-warning text-dark') + '">' + estadoActual + '</span></td>' +
      '<td>' + (cambioPendiente ? '<span class="badge bg-warning text-dark">Pendiente</span>' : '<span class="text-muted">Sin cambio</span>') + '</td>' +
    '</tr>';
  }

  function renderTablaMesaEquipos() {
    const tbody = document.getElementById('tablaMesaAsignacionBody');
    if (!tbody) return;

    if (!mesaEquiposFilasFiltradas.length) {
      tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-3">No hay filas para los filtros actuales.</td></tr>';
      const meta = document.getElementById('mesaMetaPaginacion');
      const lbl = document.getElementById('mesaPaginaActualLabel');
      if (meta) meta.textContent = '0 filas';
      if (lbl) lbl.textContent = 'Página 0/0';
      return;
    }

    const totalPaginas = Math.max(1, Math.ceil(mesaEquiposFilasFiltradas.length / MESA_EQUIPOS_PAGE_SIZE));
    if (mesaEquiposPaginaActual > totalPaginas) mesaEquiposPaginaActual = totalPaginas;
    if (mesaEquiposPaginaActual < 1) mesaEquiposPaginaActual = 1;

    const start = (mesaEquiposPaginaActual - 1) * MESA_EQUIPOS_PAGE_SIZE;
    const end = Math.min(start + MESA_EQUIPOS_PAGE_SIZE, mesaEquiposFilasFiltradas.length);
    const pagina = mesaEquiposFilasFiltradas.slice(start, end);
    const grouped = _agruparFilasMesa(pagina);
    let html = '';

    grouped.articuladores.forEach(function(art) {
      const artLabel = _nombreArticulador(art.key) || art.key || 'Sin articulador';
      html += '<tr class="table-primary"><td colspan="7"><label class="me-2 mb-0"><input type="checkbox" data-action="toggle-seleccion-grupo-equipo" data-kind="ART" data-key="' + _escapeAttrEquipos(art.key) + '"> <strong>ARTICULADOR: ' + _escapeHtmlEquipos(artLabel) + '</strong></label>' + _renderBadgeStatsGrupo(art.stats) + '</td></tr>';
      art.proyectos.forEach(function(proy) {

  // ═══════════════════════════════════════════════════════════════════
  // Árbol navegable Proyecto → Tramo → RT ("línea cero") — feedback de
  // usuario 2026-08-18: la interfaz anterior (tablas planas + modal
  // desconectado) era "muy precaria". Carga perezosa por nivel: nunca se
  // trae de una vez el detalle de los ~9700 RTs — cada nivel se pide al
  // servidor solo cuando el usuario expande ese nodo (Directiva 3: nada
  // de payloads/DOM masivos de entrada).
  // ═══════════════════════════════════════════════════════════════════
  let arbolEstado = [];

  // ═══════════════════════════════════════════════════════════════════
  // Modo Borrador [CONC-BE-12] — feedback de usuario 2026-08-18: las ediciones
  // sobre el árbol ya no se envían al servidor una por una (cada "Asignar" del
  // modal disparaba su propio round-trip con LockService). Ahora cada edición
  // se acumula localmente en `borradorCambiosEquipos` (clave por nodo), se
  // refleja de inmediato en el árbol (resaltado + badge "Cambio pendiente"),
  // y solo se persiste en ASIGNACIONES_EQUIPOS cuando el usuario pulsa
  // "Guardar Todos los Cambios", en una única llamada batch a
  // asignarEquipoGranularLote() bajo un solo LockService en el servidor.
  // ═══════════════════════════════════════════════════════════════════
  let borradorCambiosEquipos = {};

  function claveDraftEquipos(nivel, proyecto, tramo, rt) {
    if (nivel === 'PROYECTO') return 'P::' + proyecto;
    if (nivel === 'TRAMO') return 'T::' + proyecto + '::' + tramo;
    return 'R::' + proyecto + '::' + tramo + '::' + rt;
  }

  // Un RT hereda el borrador más específico que lo cubra: su propio RT, si no
  // el TRAMO al que pertenece, si no el PROYECTO — igual que la resolución en
  // cascada que ya hace _resolverCambiosPorNivel() en el servidor.
  function draftParaRT(proyecto, tramo, rt) {
    return borradorCambiosEquipos[claveDraftEquipos('RT', proyecto, tramo, rt)]
        || borradorCambiosEquipos[claveDraftEquipos('TRAMO', proyecto, tramo)]
        || borradorCambiosEquipos[claveDraftEquipos('PROYECTO', proyecto)]
        || null;
  }

  function draftParaNodo(nivel, proyecto, tramo, rt) {
    return borradorCambiosEquipos[claveDraftEquipos(nivel, proyecto, tramo, rt)] || null;
  }

  function ensureBarraBorradorEquipos() {
    if (document.getElementById('barraBorradorEquipos')) return;
    const bar = document.createElement('div');
    bar.id = 'barraBorradorEquipos';
    bar.className = 'd-none';

      'color:#fff;padding:12px 16px;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.35);' +
      'display:flex;align-items:center;gap:12px;';
    bar.innerHTML =
      '<span><i class="fas fa-pen-to-square me-1"></i><span id="barraBorradorEquiposCount">0</span> cambio(s) sin guardar</span>' +
      '<button type="button" class="btn btn-sm btn-outline-light" onclick="window.descartarBorradorEquipos()">Descartar</button>' +
      '<button type="button" class="btn btn-sm btn-warning fw-bold" onclick="window.guardarBorradorEquipos()"><i class="fas fa-save"></i> Guardar Todos los Cambios</button>';
    document.body.appendChild(bar);
  }

  function actualizarBarraBorradorEquipos() {
    ensureBarraBorradorEquipos();
    const bar = document.getElementById('barraBorradorEquipos');
    const count = Object.keys(borradorCambiosEquipos).length;
    document.getElementById('barraBorradorEquiposCount').textContent = count;
    bar.classList.toggle('d-none', count === 0);
  }

  }
