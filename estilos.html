        /* ✅ FASE 7: .filter-row (CSS grid propio) reemplazado por el grid nativo de
           Bootstrap 5 (row/col) directamente en el markup — ver Index.html #page-matriz.
           Bootstrap ya resuelve el apilado responsivo vía sus breakpoints de col-*,
           por eso los overrides de @media que apuntaban a esta clase también se quitaron. */

        .filter-group {
            display: flex;
            flex-direction: column;
            /* ✅ FASE 7 (corrección de alturas): con .row usando align-items-stretch,
               cada columna ocupa la altura del hermano más alto (Proyecto/Tramo/Estado,
               que tienen input+small+select). justify-content:end empuja el control
               real de las columnas más cortas (Fecha Corte, Buscar RT, Acciones) hacia
               abajo, alineando el borde inferior de todos los controles interactivos
               en una sola línea — evita que los selectores de "dos niveles" dupliquen
               la altura visual respecto al resto. */
            justify-content: flex-end;
            height: 100%;
        }

        .filter-group label {
            font-weight: 700;
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filter-group select,
        .filter-group input {
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .filter-group select:focus,
        .filter-group input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(52,152,219,0.1);

.kpi-card {
    background: white;
    padding: 15px;
    border-radius: 8px;
    border-left: 4px solid #ddd;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
}

.kpi-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

.kpi-title {
    font-size: 0.75rem;
    text-transform: uppercase;
    color: #666;
    font-weight: 700;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
    /* ✅ FASE 8: .kpi-card tiene overflow:hidden — sin esto, un título largo se
       corta abruptamente a la mitad de una palabra en vez de mostrar "…". */
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.kpi-value {
    font-size: 2rem;
    font-weight: 800;
    color: #2c3e50;
    line-height: 1;
    /* ✅ FASE 8: mismo tratamiento — un valor de moneda grande ($1.234.567.890)
       ya no se corta a la mitad, se reduce con ellipsis. */
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.kpi-subtitle {
    font-size: 0.7rem;
    color: #999;
    margin-top: 8px;
}


        /* ✅ CRONOGRAMA TRIMESTRAL - MODO SLIDER */
        .trim-container {
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            gap: 15px;
            padding-bottom: 15px; /* Espacio para el scrollbar */
            margin-bottom: 20px;
            scroll-behavior: smooth;
            /* Ocultar barra en Firefox/IE */
            scrollbar-width: thin;
            scrollbar-color: #cdd3d8 #f1f3f5;
        }

        /* Estilos pro para el scrollbar horizontal (Chrome/Edge/Safari) */
        .trim-container::-webkit-scrollbar {
            height: 8px;
        }
        .trim-container::-webkit-scrollbar-track {
            background: #f1f3f5;
            border-radius: 10px;
