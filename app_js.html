// MOTOR DE REGLAS GRÁFICO (VISUAL BUILDER)
// ═══════════════════════════════════════════════════════════════════════════════════

let motorReglasData = null;

function cargarJSONenPantalla() {
    showLoader('Cargando Motor de Reglas...');
    google.script.run
        .withSuccessHandler(function(response) {
            hideLoader();
            if (response.success) {
                let val = response.data;
                if(val && val !== "{}" && val !== "") {
                    try {
                        motorReglasData = JSON.parse(val);
                        // Cargar en el editor avanzado
                        document.getElementById('editorJSONReglas').value = JSON.stringify(motorReglasData, null, 4);
                        // Renderizar las tarjetas visuales
                        renderizarTarjetasReglas();
                        renderizarFuentesDeDatos();
                    } catch(e) {
                        showToast('Error procesando el JSON guardado', 'danger');
                    }
                } else {
                    document.getElementById('contenedorTarjetasReglas').innerHTML = '<div class="col-12 text-center p-5 text-muted">Aún no hay reglas configuradas. Pega el JSON Maestro en el Modo Desarrollador.</div>';
                }
            } else {
                showToast('Error cargando reglas: ' + response.error, 'danger');
            }
        })
        .withFailureHandler(onError)
        .obtenerReglasJSON();
}

function renderizarTarjetasReglas() {
    const contenedor = document.getElementById('contenedorTarjetasReglas');
    contenedor.innerHTML = '';

    if (!motorReglasData || !motorReglasData.ReglasDeNegocio || motorReglasData.ReglasDeNegocio.length === 0) {
        contenedor.innerHTML = '<div class="col-12 text-center p-5 text-muted">No hay reglas definidas.</div>';
        return;
    }

    motorReglasData.ReglasDeNegocio.forEach((regla, index) => {
        const colorBorde = regla.activa ? '#27ae60' : '#95a5a6';
        const badgeEstado = regla.activa ? 
            `<span class="badge bg-success" style="font-size:0.7rem;"><i class="fas fa-check-circle"></i> ACTIVA</span>` : 
            `<span class="badge bg-secondary" style="font-size:0.7rem;"><i class="fas fa-power-off"></i> INACTIVA</span>`;
        
        let detalleAlerta = '';
        if(regla.alerta_bloqueo) detalleAlerta = `<span class="badge bg-danger ms-1">Bloqueo: ${regla.alerta_bloqueo.nivel}</span>`;
        if(regla.regla_tiempo) detalleAlerta = `<span class="badge bg-warning text-dark ms-1"><i class="far fa-clock"></i> Control Tiempos</span>`;

        const card = `
        <div class="col-md-6 mb-4">
            <div class="card h-100 shadow-sm" style="border-radius: 10px; border-left: 5px solid ${colorBorde}; transition: transform 0.2s;">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <span class="badge bg-light text-primary border border-primary">${regla.fase || 'GENERAL'}</span>
                        ${badgeEstado}
                    </div>
                    <h6 class="fw-bold mb-1" style="color: #2c3e50;">${regla.nombre}</h6>
                    <p class="small text-muted mb-2" style="font-size: 0.8rem; height: 40px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;">
                        ${regla.descripcion}
                    </p>
                    <div class="mb-3">
                        <small class="text-primary fw-bold" style="font-size:0.7rem;">ID: ${regla.id_regla}</small><br>
                        ${detalleAlerta}
                    </div>
                </div>
                <div class="card-footer bg-white border-top-0 pt-0">
                    <button class="btn btn-sm btn-outline-primary w-100 fw-bold" onclick="abrirEditorVisual(${index})">
                        <i class="fas fa-edit"></i> Configurar Regla
                    </button>
                </div>
            </div>
        </div>`;
        contenedor.innerHTML += card;
    });
}

function renderizarFuentesDeDatos() {
    const contenedor = document.getElementById('contenedorTarjetasFuentes');
    contenedor.innerHTML = '';

    if (!motorReglasData || !motorReglasData.FuentesDeDatos) return;

    for (const [llave, fuente] of Object.entries(motorReglasData.FuentesDeDatos)) {
        const card = `
        <div class="col-md-6 mb-3">
            <div class="card shadow-sm border-0 bg-light">
                <div class="card-body">
                    <h6 class="fw-bold text-success mb-2"><i class="fas fa-database"></i> ${llave}</h6>
                    <ul class="list-unstyled small mb-0">
                        <li><strong>Archivo ID:</strong> <span class="text-muted" style="word-break: break-all;">${fuente.id_archivo}</span></li>
                        <li><strong>Hoja:</strong> <span class="text-primary fw-bold">${fuente.hoja_datos}</span></li>
                        <li><strong>Llave de Cruce:</strong> <span class="badge bg-dark">${fuente.llave_cruce}</span></li>
                    </ul>
                </div>
            </div>
        </div>`;
        contenedor.innerHTML += card;
    }
}

function abrirEditorVisual(index) {
    if(!motorReglasData) return;
    const regla = motorReglasData.ReglasDeNegocio[index];
    
    document.getElementById('editReglaIndex').value = index;
    document.getElementById('editReglaId').value = regla.id_regla;
    document.getElementById('editReglaNombre').value = regla.nombre;
    document.getElementById('editReglaActiva').value = regla.activa ? "true" : "false";
    document.getElementById('editReglaFase').value = regla.fase || '';
    document.getElementById('editReglaDesc').value = regla.descripcion || '';

    // Extraer solo la lógica (condiciones, validaciones) para mostrarla en el recuadro gris
    const logica = {};
    if(regla.condiciones) logica.condiciones = regla.condiciones;
    if(regla.regla_tiempo) logica.regla_tiempo = regla.regla_tiempo;
    if(regla.alerta_bloqueo) logica.alerta_bloqueo = regla.alerta_bloqueo;
    if(regla.evaluacion_cruzada) logica.evaluacion_cruzada = regla.evaluacion_cruzada;
    
    document.getElementById('editReglaLogicaCode').textContent = JSON.stringify(logica, null, 2);

    const modal = new bootstrap.Modal(document.getElementById('modalEditarReglaVis'));
    modal.show();
}

function guardarEdicionReglaVisual() {
    const index = document.getElementById('editReglaIndex').value;
    if(index === "" || !motorReglasData) return;

    // Actualizar el objeto JS
    motorReglasData.ReglasDeNegocio[index].nombre = document.getElementById('editReglaNombre').value.trim();
    motorReglasData.ReglasDeNegocio[index].activa = document.getElementById('editReglaActiva').value === "true";
    motorReglasData.ReglasDeNegocio[index].fase = document.getElementById('editReglaFase').value.trim();
    motorReglasData.ReglasDeNegocio[index].descripcion = document.getElementById('editReglaDesc').value.trim();

    // Sincronizar con el Textarea (Modo Desarrollador)
    const jsonStringActualizado = JSON.stringify(motorReglasData, null, 4);
    document.getElementById('editorJSONReglas').value = jsonStringActualizado;

    // Renderizar de nuevo las tarjetas
    renderizarTarjetasReglas();

    // Cerrar modal
    bootstrap.Modal.getInstance(document.getElementById('modalEditarReglaVis')).hide();
    showToast('Regla editada temporalmente. No olvides dar clic en "Guardar Configuración" arriba.', 'info');
}

function guardarJSONdesdePantalla() {
    const jsonString = document.getElementById('editorJSONReglas').value.trim();
    
    if(!jsonString) { showToast('El editor está vacío', 'warning'); return; }

    try { JSON.parse(jsonString); } catch (e) {
        showConfirmation('❌ El formato JSON tiene errores de sintaxis en el Modo Desarrollador. Corrígelo antes de guardar.');
        return; 
    }

    showLoader('Guardando configuración en la Base de Datos...');
    google.script.run
        .withSuccessHandler(function(response) {
            hideLoader();
            if (response.success) {
                showToast('✅ ' + response.message, 'success');
                cargarJSONenPantalla(); // Recargar para asegurar sincro
            } else { showToast('❌ Error: ' + response.error, 'danger'); }
        })
        .withFailureHandler(onError)
        .guardarReglasJSON(jsonString, currentUser);
}

function formatearJSON() {
    const textarea = document.getElementById('editorJSONReglas');
    try {
        const obj = JSON.parse(textarea.value);
        textarea.value = JSON.stringify(obj, null, 4); 
        motorReglasData = obj; // Sincroniza
        renderizarTarjetasReglas(); // Actualiza gráfica
        renderizarFuentesDeDatos();
        showToast('Código formateado y gráficas actualizadas', 'info');
    } catch (e) {
        showToast('No se puede formatear: JSON inválido', 'warning');
    }
}

// Inicializar al hacer clic en el menú
$(document).on('click', '.menu-item', function() {
    const onclickAttr = $(this).attr('onclick') || "";
    if (onclickAttr.includes("showPage('motorReglas'")) {
        cargarJSONenPantalla();
    }
});

    try {
        // Restaurar filtros en los selectores
        $('#filterProyecto').val(navigationState.activeFilters.proyecto || 'ALL');

        onProyectoChange();
        
        // Restaurar tramo
        $('#filterTramo').val(navigationState.activeFilters.tramo || 'ALL');
        
        // Actualizar estados disponibles según tramo

        // Restaurar estado
        $('#filterEstado').val(navigationState.activeFilters.estado || 'ALL');
        $('#dateFilter').val(navigationState.activeFilters.fecha || '');
        $('#dateMode').val(navigationState.activeFilters.modo || 'ACUM');
        
        // Restaurar estado interno
        state.selProyecto = navigationState.activeFilters.proyecto || 'ALL';
        state.selTramo = navigationState.activeFilters.tramo || 'ALL';
        state.dateLimit = navigationState.activeFilters.fecha || null;
        state.dateMode = navigationState.activeFilters.modo || 'ACUM';
        state.kpiFilter = navigationState.activeKpi;
        state.tramoFromMatrix = navigationState.activeTramo;
        
        // Restaurar KPI activo visualmente
        $('.kpi-card').removeClass('active');
        if(state.kpiFilter === 'DISPONIBLE') $('#card-disp').addClass('active');
        else if(state.kpiFilter === 'PENDIENTE') $('#card-pend').addClass('active');
        else if(state.kpiFilter === 'ADQUIRIR') $('#card-adq').addClass('active');
        else $('#card-total').addClass('active');
        
        // Aplicar filtros

        setTimeout(() => {

    } catch(e) {
        console.error('❌ Error restaurando estado:', e.message);
    }
}

// Botón para ejecutar el motor manualmente desde la pantalla
function ejecutarMotorManual() {
    showLoader('Ejecutando Motor de Reglas...', 'Analizando fechas, festivos y cruzando con la matriz. Esto tomará unos segundos.');
    google.script.run
        .withSuccessHandler(function(res) {
            hideLoader();
            if(res.success) {
                showToast(`✅ Motor finalizado con éxito. ${res.totalAlertas} alertas procesadas.`, 'success');
                cargarAlertasWeb(); // Recarga la bandeja automáticamente
            } else {
                showToast('❌ Error: ' + res.error, 'danger');
            }
        })
        .withFailureHandler(onError)
        .ejecutarEvaluadorAlertas();
}

// Trae las alertas guardadas en la hoja oculta ALERTAS_ACTIVAS
function cargarAlertasWeb() {
    $('#alertasContainer').html('<div class="text-center p-5 text-muted"><i class="fas fa-spinner fa-spin fa-2x mb-3"></i><br>Consultando base de datos de alertas...</div>');
    
    google.script.run
        .withSuccessHandler(function(res) {
            try {
                const alertas = JSON.parse(res);
                renderizarAlertas(alertas);
            } catch(e) {
                showToast('Error parseando las alertas', 'danger');
            }
        })
        .withFailureHandler(onError)
        .obtenerAlertasWeb();
}

// MÓDULO DE ALERTAS MEJORADO (Filtros, KPIs y Exportación)
// ═══════════════════════════════════════════════════════════════════════════════════

let alertasGlobales = [];
let filtroNivelActivo = 'ALL';

function renderizarAlertas(alertas) {
    alertasGlobales = alertas || [];
    const container = document.getElementById('alertasContainer');
    
    let countRojo = 0, countNaranja = 0, countAmarillo = 0;

    if (alertasGlobales.length === 0) {
        container.innerHTML = `
            <div class="no-data" style="background: white; border-radius: 10px; padding: 40px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
                <i class="fas fa-check-circle text-success" style="font-size: 4rem; opacity: 0.8;"></i>
                <h5 class="mt-3 text-dark fw-bold">¡Todo en orden!</h5>
                <p>No hay alertas activas ni incumplimientos en el sistema en este momento.</p>
            </div>`;
        $('#kpi-alertas-rojo').text(0); $('#kpi-alertas-naranja').text(0); $('#kpi-alertas-amarillo').text(0); $('#kpi-alertas-total').text(0);
        return;
    }

    // 1. Poblar Dropdowns dinámicamente con los datos de las alertas
    popularDropdownsAlertas();

    let html = '<div class="list-group shadow-sm" id="listaTarjetasAlertas">';
    
    // 2. Generar Tarjetas con estilos fijos para evitar que Naranja y Amarillo se crucen
    alertasGlobales.forEach(a => {
        let colorBorder, icon, bgStyle, textClass;
        
        if (a.NIVEL === 'ROJO') {
            colorBorder = '#c0392b'; icon = 'fa-times-circle'; textClass = 'text-danger'; countRojo++;
            bgStyle = 'background-color: #fce8e6; color: #c0392b; border: 1px solid #c0392b;';
        } else if (a.NIVEL === 'NARANJA') {
            colorBorder = '#e67e22'; icon = 'fa-exclamation-triangle'; textClass = 'text-warning'; countNaranja++;
            // Naranja real, no el amarillo quemado de Bootstrap
            bgStyle = 'background-color: #fdf2e9; color: #d35400; border: 1px solid #e67e22;';
        } else {
            colorBorder = '#f1c40f'; icon = 'fa-info-circle'; textClass = 'text-warning'; countAmarillo++;
            // Amarillo oro
            bgStyle = 'background-color: #fef9e7; color: #b48600; border: 1px solid #f1c40f;';
        }

        const diasBadge = a['DIAS RESTANTES'] !== 'N/A' && a['DIAS RESTANTES'] !== '' ? 
            `<span class="badge bg-secondary ms-2" style="font-size: 0.75rem;"><i class="far fa-clock"></i> ${a['DIAS RESTANTES']} días</span>` : '';

        // Inject attributes for easy filtering
        html += `
        <div class="list-group-item list-group-item-action mb-2 border-0 shadow-sm tarjeta-alerta" 
             data-nivel="${a.NIVEL}" data-proyecto="${a.PROYECTO}" data-regla="${a.REGLA}" data-artic="${a.ARTICULADOR}"
             style="border-left: 6px solid ${colorBorder} !important; border-radius: 8px;">
            <div class="d-flex w-100 justify-content-between align-items-center mb-2">
                <h6 class="mb-0 fw-bold ${textClass}" style="font-size: 0.95rem;">
                    <i class="fas ${icon} me-1"></i> [RT: ${a.RT}] - ${a.REGLA}
                </h6>
                <small class="text-muted" style="font-size: 0.7rem;">Detectado: ${a.TIMESTAMP}</small>
            </div>
            
            <p class="mb-2 small" style="color: #444; font-size: 0.85rem; background: #f8f9fa; padding: 8px; border-radius: 5px;">
                <strong>Mensaje del Motor:</strong> ${a.MENSAJE}
            </p>
            
            <div class="mt-2 d-flex align-items-center gap-2 flex-wrap">
                <span class="badge bg-light text-dark border border-secondary" style="font-size: 0.7rem;"><i class="fas fa-folder"></i> ${a.PROYECTO}</span>
                <span class="badge bg-light text-dark border border-secondary" style="font-size: 0.7rem;"><i class="fas fa-user"></i> ${a.ARTICULADOR}</span>
                <span class="badge" style="font-size: 0.7rem; ${bgStyle}">NIVEL ${a.NIVEL}</span>
                ${diasBadge}

function aplicarFiltrosAlertas() {
    const selRegla = document.getElementById('filterAlertaRegla').value;
    const selProy = document.getElementById('filterAlertaProyecto').value;
    const selArtic = document.getElementById('filterAlertaArticulador').value;
    
    const tarjetas = document.querySelectorAll('.tarjeta-alerta');
    
    // Variables para contar las alertas visibles
    let countRojo = 0;
    let countNaranja = 0;
    let countAmarillo = 0;
    
    tarjetas.forEach(t => {
        const tNivel = t.getAttribute('data-nivel');
        const tRegla = t.getAttribute('data-regla');
        const tProy = t.getAttribute('data-proyecto');
        const tArtic = t.getAttribute('data-artic');
        
        let mostrar = true;

        if (filtroNivelActivo !== 'ALL' && tNivel !== filtroNivelActivo) mostrar = false;

        function setDefaultDate() {
            const today = new Date();
            const maxDate = new Date(today.getFullYear() + 10, 11, 31);

        function parseDateRobust(dateStr) {
    if (!dateStr || String(dateStr).trim() === "") return '2099-12-31';

    if (dateStr instanceof Date) {
        // Manejar fechas nativas para que no se corran por zona horaria
        const offset = dateStr.getTimezoneOffset() * 60000;
        const localDate = new Date(dateStr.getTime() - offset);
        return localDate.toISOString().split('T')[0];
    }

    let s = String(dateStr).toLowerCase().trim().replace(/\./g, '');

    if (s.match(/^\d{4}-\d{2}-\d{2}$/)) return s;

    let ddmmMatch = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
    if (ddmmMatch) {
        let d = ddmmMatch[1].padStart(2, '0');
        let m = ddmmMatch[2].padStart(2, '0');
        let y = ddmmMatch[3];
        if (y.length === 2) y = "20" + y; 
        return `${y}-${m}-${d}`;
    }

    let foundYear = null;
    let yearMatch = s.match(/(20\d{2})/);
    if (yearMatch) {
        foundYear = yearMatch[1];
    } else {
        let shortMatch = s.match(/[-/\s](\d{2})$/);
        if(shortMatch) foundYear = "20" + shortMatch[1];
    }

    if (!foundYear) return '2099-12-31';

    // Super-atrapador de Trimestres (Atrapa T4, 4 trimestre, Trimestre 4)
    let t = null;
    let trimMatch1 = s.match(/(\d)\s*trimestre/);
    let trimMatch2 = s.match(/trimestre\s*(\d)/);
    let trimMatch3 = s.match(/t(\d)/);

    if (trimMatch1) t = parseInt(trimMatch1[1]);
    else if (trimMatch2) t = parseInt(trimMatch2[1]);
    else if (trimMatch3) t = parseInt(trimMatch3[1]);

    if (t !== null && t >= 1 && t <= 4) {
        if (t === 1) return `${foundYear}-03-31`;
        if (t === 2) return `${foundYear}-06-30`;
        if (t === 3) return `${foundYear}-09-30`;
        if (t === 4) return `${foundYear}-12-31`;
    }

    const meses = {
        'ene': '01', 'feb': '02', 'mar': '03', 'abr': '04', 'may': '05', 'jun': '06',
        'jul': '07', 'ago': '08', 'sep': '09', 'oct': '10', 'nov': '11', 'dic': '12'
    };

    let foundMonth = null;
    for (const [key, val] of Object.entries(meses)) {
        if (s.includes(key)) { 
            foundMonth = val; 
            break; 
        }
    }

    if (foundMonth && foundYear) return `${foundYear}-${foundMonth}-28`;

    return '2099-12-31';
}

        function parseMoneyRobust(cellValue) {
            if (!cellValue) return 0;
            
            let str = String(cellValue).trim();
            if (!isNaN(str) && str !== '') return parseFloat(str);
            
            str = str.replace(/[^\d.,]/g, '');
            if (!str) return 0;
            
            const lastCommaPos = str.lastIndexOf(',');
            const lastDotPos = str.lastIndexOf('.');
            
            let normalized = str;
            
            if (lastCommaPos > lastDotPos) {
                normalized = str.replace(/\./g, '').replace(',', '.');
            } else if (lastDotPos > lastCommaPos) {
                normalized = str.replace(/,/g, '');
            } else if (lastCommaPos === -1 && lastDotPos === -1) {
                normalized = str;
            } else if (lastCommaPos >= 0 && lastDotPos === -1) {
                normalized = str.replace(/,/g, '');
            }
            
            const result = parseFloat(normalized);
            return isNaN(result) ? 0 : result;
        }

        // ✅ OBTENER ÚLTIMA OBSERVACIÓN DEL SEGUIMIENTO
        function getLatestObservation(rt) {
            if (!rt || seguimientoData.length === 0) return null;
            
            const rtStr = String(rt).trim().toUpperCase();
            const rtRecords = seguimientoData.filter(s => {
                const sRt = String(s['RT'] || '').trim().toUpperCase();
                return sRt === rtStr;
            });
            
            if (rtRecords.length === 0) return null;
            
            rtRecords.sort((a, b) => {
                const dateA = parseFollowupDate(a['FECHA_REGISTRO'] || a['FECHA'] || '');
                const dateB = parseFollowupDate(b['FECHA_REGISTRO'] || b['FECHA'] || '');
                return dateB - dateA;
            });
            
            const latestRecord = rtRecords[0];
            return latestRecord['OBSERVACIONES'] || latestRecord['OBS'] || null;
        }

        function parseFollowupDate(dateStr) {
            if (!dateStr) return new Date(0);
            const str = String(dateStr).trim();
            const parsed = new Date(str);
            if (!isNaN(parsed)) return parsed;
            
            const match = str.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})\s*(\d{1,2})?:?(\d{2})?:?(\d{2})?/);
            if (match) {
                const day = parseInt(match[1]);
                const month = parseInt(match[2]) - 1;
                const year = parseInt(match[3]);
                const hour = parseInt(match[4]) || 0;
                const minute = parseInt(match[5]) || 0;
                const second = parseInt(match[6]) || 0;
                return new Date(year, month, day, hour, minute, second);
            }
            return new Date(0);
        }

        function cleanTextUpper(text) {
            if (!text) return '';
            return String(text)
                .toUpperCase()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .trim();
        }

        // \u2705 SEC-P1: escapa HTML antes de interpolar texto libre de usuario (OBSERVACIONES,
        // SITUACIONES ESPECIALES, etc.) en innerHTML/insertAdjacentHTML \u2014 previene XSS almacenado.
        function escapeHtml(text) {
            if (text === null || text === undefined) return '';
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

function getBaseFilteredData() {
    // --- NUEVO: Limpiar inactivos también de los menús desplegables ---
    const datosActivos = rawData.filter(d => String(d['ACTIVO/INACTIVO']).toUpperCase().trim() !== 'INACTIVO');

const searchableSelectState = {
    filterProyecto: [],
    filterTramo: [],
    filterEstado: []
};

const searchableSelectConfig = {
    filterProyecto: { inputId: 'filterProyectoSearch', metaId: 'filterProyectoSearchMeta', onCommit: onProyectoChange },
    filterTramo: { inputId: 'filterTramoSearch', metaId: 'filterTramoSearchMeta', onCommit: onTramoChange },
    filterEstado: { inputId: 'filterEstadoSearch', metaId: 'filterEstadoSearchMeta', onCommit: applyFilters }
};

function updateSearchMeta(selectId, totalOptions, matchedOptions, query) {
    const cfg = searchableSelectConfig[selectId];
    if (!cfg) return;

    const el = document.getElementById(cfg.metaId);
    if (!el) return;

    const normalizedQuery = String(query || '').trim();
    if (!normalizedQuery) {
        el.textContent = 'Opciones disponibles: ' + totalOptions;
        return;
    }

    el.textContent = 'Coincidencias: ' + matchedOptions + ' de ' + totalOptions;
}

function bindSearchableFilterInputs() {
    Object.keys(searchableSelectConfig).forEach(function(selectId) {
        const cfg = searchableSelectConfig[selectId];
        const input = document.getElementById(cfg.inputId);
        const select = document.getElementById(selectId);
        if (!input || !select) return;

        input.addEventListener('keydown', function(ev) {
            if (ev.key === 'Enter') {
                ev.preventDefault();
                cfg.onCommit();
                return;
            }

            if (ev.key === 'ArrowDown') {
                ev.preventDefault();
                select.focus();
                return;
            }

            if (ev.key === 'Escape') {
                ev.preventDefault();
                input.value = '';
                applySelectSearch(selectId, '');
                cfg.onCommit();
            }
        });
    });
}

function cacheSelectOptions(selectId) {
    const options = [];
    $('#' + selectId + ' option').each(function() {
        options.push({ value: this.value, text: this.textContent || this.innerText || '' });
    });
    searchableSelectState[selectId] = options;
}

function applySelectSearch(selectId, query) {
    const allOptions = searchableSelectState[selectId] || [];
    if (!allOptions.length) return;

    const normalizedQuery = String(query || '').toUpperCase().trim();
    const firstOption = allOptions[0];
    const currentValue = $('#' + selectId).val();
    const filtered = normalizedQuery
        ? allOptions.slice(1).filter(o => String(o.text).toUpperCase().includes(normalizedQuery))
        : allOptions.slice(1);

    const $select = $('#' + selectId);
    $select.empty();

    if (firstOption) {
        $select.append('<option value="' + firstOption.value + '">' + firstOption.text + '</option>');
    }
    filtered.forEach(function(o) {
        $select.append('<option value="' + o.value + '">' + o.text + '</option>');
    });

    const stillExists = filtered.some(o => o.value === currentValue) || (firstOption && currentValue === firstOption.value);
    $select.val(stillExists ? currentValue : (firstOption ? firstOption.value : 'ALL'));

    if (normalizedQuery && filtered.length === 1) {
        $select.val(filtered[0].value);
    }

    updateSearchMeta(selectId, allOptions.length > 0 ? allOptions.length - 1 : 0, filtered.length, query);
}

function refreshSelectSearch(selectId, searchInputId) {
    cacheSelectOptions(selectId);
    const query = $('#' + searchInputId).val() || '';
    applySelectSearch(selectId, query);
}

        function renderTrimestres() {
    try {
        let groups = {};
        
        let dataToProcess = currentData.filter(d => {
            if(state.kpiFilter === 'ALL') return true;
            const s = String(d[C.DISP] || "").toUpperCase();
            const est = String(d[C.ESTADO] || "").toUpperCase();
            
            if(state.kpiFilter === 'DISPONIBLE') return s.includes('DISPONIBLE') && !s.includes('PENDIENTE');
            if(state.kpiFilter === 'PENDIENTE') return s.includes('PENDIENTE');
            if(state.kpiFilter === 'ADQUIRIR') return !est.includes('CESI');
            if(state.kpiFilter === 'CESION') return est.includes('CESI');
            return true;
        });

        dataToProcess.forEach(d => {
            if(d['FECHA_ISO'] === '2099-12-31') return;
            
            // Extraer directamente para EVITAR husos horarios y fallos por meses
            let [y, m, day] = d['FECHA_ISO'].split('-');
            let year = parseInt(y);
            let month = parseInt(m) - 1; 
            let q = Math.floor(month / 3) + 1;
            let key = `${year}-T${q}`;
            
            if(!groups[key]) groups[key] = { total: 0, disp: 0, pagado: 0, estimado: 0 };
            
            groups[key].total++;
            const s = String(d[C.DISP] || "").toUpperCase();
            if(s.includes('DISPONIBLE') && !s.includes('PENDIENTE')) groups[key].disp++;
            
            groups[key].estimado += parseMoneyRobust(d[C.EST]);
            groups[key].pagado += parseMoneyRobust(d[C.PAG]);
        });

        let html = '';
        Object.keys(groups).sort().forEach(k => {
            let g = groups[k];
            let pend = g.total - g.disp;
            let percDisp = g.total > 0 ? (g.disp / g.total) * 100 : 0;
            let percPago = g.estimado > 0 ? (g.pagado / g.estimado) * 100 : 0;
            
            html += `
                <div class="trim-card" style="cursor: pointer; transition: all 0.3s ease;" 
                     onclick="filterByTrimestre('${k}', ${g.disp}, ${pend})"

                            <span><strong>${g.disp}</strong> Disp</span>
                        </div>
                        <div class="trim-stat" style="cursor: pointer; padding: 5px; border-radius: 4px; background: rgba(192,57,43,0.1);"
                             onclick="filterByTrimestre('${k}', ${pend}, 'PENDIENTE'); event.stopPropagation();"
                             title="Filtrar solo pendientes">
                            <i class="fas fa-clock"></i>
                            <span><strong>${pend}</strong> Pend</span>
                        </div>
                    </div>
                    
                    <div class="trim-percent">
                        <div style="cursor: pointer; padding: 5px; border-radius: 4px; background: rgba(52,152,219,0.1); margin-bottom: 5px;"
                             onclick="filterByTrimestre('${k}', 'DISPONIBILIDAD'); event.stopPropagation();"
                             title="Filtrar por disponibilidad">
                            📋 <strong>${percDisp.toFixed(0)}%</strong> Disponibilidad
                        </div>
                        <div style="cursor: pointer; padding: 5px; border-radius: 4px; background: rgba(46,204,113,0.1);"
                             onclick="filterByTrimestre('${k}', 'ADQUISICION'); event.stopPropagation();"
                             title="Filtrar por adquisición">
                            💰 <strong>${percPago.toFixed(0)}%</strong> Adquisición
                        </div>
                    </div>
                    
                    <div class="trim-progress">
                        <div class="trim-progress-bar" style="width: ${percDisp}%"></div>
                    </div>
                </div>
            `;
        });
        
        if(html === '') html = '<div class="text-muted small p-2">Sin fechas programadas en el rango.</div>';
        $('#trim-wrapper').html(html);
        
        // Alerta si hay un trimestre activo (Devuelve la opacidad y borde si es necesario)

            $(`.trim-card:contains('${activeTrim}')`).css('opacity', '1').css('border', '2px solid #f1c40f');

        console.log('✅ Cronograma trimestral renderizado con cálculos corregidos');
    } catch (e) {
        console.error('❌ Error renderizando cronograma: ' + e.message);
    }

        function filterByTrimestre(trimestre, cantidad, tipo) {
    console.log(`🔍 Filtrando por trimestre: ${trimestre}, Tipo: ${tipo}`);
    
    // 1. Partir de los datos base (sin inactivos y con el filtro matriz global ya aplicado)
    let filteredData = getBaseFilteredData();
    
    // 2. Respetar los filtros actuales de Proyecto, Tramo y Estado
    const proySelected = $('#filterProyecto').val();
    const tramoSelected = $('#filterTramo').val();
    const estadoSelected = $('#filterEstado').val();
    
    if (proySelected !== 'ALL') filteredData = filteredData.filter(r => r[C.PROYECTO] === proySelected);
    if (tramoSelected !== 'ALL') filteredData = filteredData.filter(r => r[C.TRAMO] === tramoSelected);
    if (estadoSelected !== 'ALL') filteredData = filteredData.filter(r => r[C.ESTADO] === estadoSelected);
    
    // 3. Respetar Filtro KPI (Ej: Solo los de "Cesión")
    filteredData = filteredData.filter(d => {
        let kpiOk = true;
        const est = String(d[C.ESTADO] || "").toUpperCase();
        const disp = String(d[C.DISP] || "").toUpperCase();
        const isCesion = est.includes('CESI') || est.includes('CESIÓN');
        
        if (state.kpiFilter === 'DISPONIBLE') {
            kpiOk = disp.includes('DISPONIBLE') && !disp.includes('PENDIENTE');
            if (state.kpiSubFilter === 'CESION') kpiOk = kpiOk && isCesion;
            else if (state.kpiSubFilter === 'ADQUIRIR') kpiOk = kpiOk && !isCesion;
        } 
        else if (state.kpiFilter === 'PENDIENTE') {
            kpiOk = disp.includes('PENDIENTE');
            if (state.kpiSubFilter === 'CESION') kpiOk = kpiOk && isCesion;
            else if (state.kpiSubFilter === 'ADQUIRIR') kpiOk = kpiOk && !isCesion;
        }
        else if (state.kpiFilter === 'CESION') kpiOk = isCesion;
        else if (state.kpiFilter === 'ADQUIRIR') kpiOk = !isCesion;
        
        return kpiOk;
    });

    // 4. Filtrar por las fechas del trimestre (Separando manualmente para evitar Bug de Zona Horaria)
    const [yearStr, trimNum] = trimestre.split('-T');
    const year = parseInt(yearStr);
    const q = parseInt(trimNum);
    
    const startMonth = (q - 1) * 3;
    const startDate = new Date(year, startMonth, 1);
    const endDate = new Date(year, startMonth + 3, 0, 23, 59, 59);
    
    filteredData = filteredData.filter(d => {
        if(d['FECHA_ISO'] === '2099-12-31') return false;
        
        let [y, m, day] = d['FECHA_ISO'].split('-');
        let date = new Date(parseInt(y), parseInt(m) - 1, parseInt(day));
        
        return date >= startDate && date <= endDate;
    });
    
    // 5. Si hicieron clic en los sub-filtros de la tarjeta (Disp/Pend)
    if (tipo === 'DISPONIBLE') {
        filteredData = filteredData.filter(d => {
            const s = String(d[C.DISP] || "").toUpperCase();
            return s.includes('DISPONIBLE') && !s.includes('PENDIENTE');
        });
    } 
    else if (tipo === 'PENDIENTE') {
        filteredData = filteredData.filter(d => {
            const s = String(d[C.DISP] || "").toUpperCase();
            return s.includes('PENDIENTE');
        });
    } 
    else if (tipo === 'DISPONIBILIDAD') {
        state.kpiFilter = 'DISPONIBLE';
        filteredData = filteredData.filter(d => {
            const s = String(d[C.DISP] || "").toUpperCase();
            return s.includes('DISPONIBLE') && !s.includes('PENDIENTE');
        });
    } 
    else if (tipo === 'ADQUISICION') {
        state.kpiFilter = 'ADQUIRIR';
        filteredData = filteredData.filter(d => {
            const est = String(d[C.ESTADO] || "").toUpperCase();
            return !est.includes('CESI');
        });
    }
    
    // 6. Aplicar la data filtrada
    currentData = filteredData;
    
    $('#trimestre-alert').show();
    $('#trimestre-name').text(trimestre + (typeof tipo === 'string' ? ` (${tipo})` : ''));
    
    showToast(`✅ Filtrando ${filteredData.length} registros del trimestre ${trimestre}`, 'success');
    
    updateKPIs();
    renderMatrix();
    
    // 7. EFECTO VISUAL UX: Opacamos las otras tarjetas, resaltamos la cliqueada.
    $('.trim-card').css('opacity', '0.4').css('border', 'none');
    if(event && event.currentTarget) {
        event.currentTarget.closest('.trim-card').style.opacity = '1';
        event.currentTarget.closest('.trim-card').style.border = '2px solid #f1c40f';
    }
    
    setTimeout(() => {
        const matrixBox = document.querySelector('.matrix-box');
        if(matrixBox) matrixBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 300);
}

        // ✅ NUEVO - MEJORADO CON SUBDIVISIONES
function updateKPIs() {
    try {
        let kpiData = currentData;
        if (state.tramoFromMatrix !== 'ALL') {
            kpiData = currentData.filter(d => d[C.TRAMO] === state.tramoFromMatrix);
            $('#tramo-alert').show();
            $('#tramo-name').text(state.tramoFromMatrix);
        } else {
            $('#tramo-alert').hide();
        }

        // ✅ CONTADORES PRINCIPALES
        let totalGeneral = kpiData.length;
        let totalCesion = 0;
        let totalAdquirir = 0;

        // ✅ DISPONIBLES
        let dispTotal = 0;
        let dispCesion = 0;
        let dispAdquirir = 0;

        // ✅ PENDIENTES
        let pendTotal = 0;
        let pendCesion = 0;
        let pendAdquirir = 0;

        // ✅ FINANCIERO
        let sumEst = 0, sumPag = 0;

        // ✅ PROCESAR DATOS
        kpiData.forEach(d => {
            const disp = String(d[C.DISP] || "").toUpperCase();
            const est = String(d[C.ESTADO] || "").toUpperCase();
            const isCesion = est.includes('CESI') || est.includes('CESIÓN');

            // Contar TOTAL GENERAL
            if (isCesion) {
                totalCesion++;
            } else {
                totalAdquirir++;
            }

            // Contar DISPONIBLES
            if (disp.includes('DISPONIBLE') && !disp.includes('PENDIENTE')) {
                dispTotal++;
                if (isCesion) {
                    dispCesion++;
                } else {
                    dispAdquirir++;
                }
            }
            // Contar PENDIENTES
            else if (disp.includes('PENDIENTE')) {
                pendTotal++;
                if (isCesion) {
                    pendCesion++;
                } else {
                    pendAdquirir++;
                }
            }

            // Financiero
            sumEst += parseMoneyRobust(d[C.EST]);
            sumPag += parseMoneyRobust(d[C.PAG]);
        });

        // ✅ ACTUALIZAR TOTAL GENERAL
        $('#val-total').text(totalGeneral);
        $('#val-total-cesion').text(totalCesion);
        $('#val-total-adquirir').text(totalAdquirir);

        // ✅ ACTUALIZAR DISPONIBLES
        $('#val-disp').text(dispTotal);
        $('#val-disp-cesion').text(dispCesion);
        $('#val-disp-adquirir').text(dispAdquirir);

        // ✅ ACTUALIZAR PENDIENTES
        $('#val-pend').text(pendTotal);
        $('#val-pend-cesion').text(pendCesion);
        $('#val-pend-adquirir').text(pendAdquirir);

        // ✅ ACTUALIZAR FINANCIERO
        let sumSal = sumEst - sumPag;
        let ejec = sumEst > 0 ? (sumPag / sumEst) * 100 : 0;

        const fmt = new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 });
        $('#fin-est').text(fmt.format(sumEst));
        $('#fin-pag').text(fmt.format(sumPag));
        $('#fin-sal').text(fmt.format(sumSal));
        $('#fin-ejec').text(ejec.toFixed(1) + '%');
        
        $('#sysRecords').text(rawData.length);
        
        console.log('✅ KPIs actualizados:', {
            totalGeneral,
            totalCesion,
            totalAdquirir,
            dispTotal,
            pendTotal
        });
    } catch (e) {
        console.error('❌ Error actualizando KPIs: ' + e.message);
    }
}

        // ═══════════════════════════════════════════════════════════════════════════════════
        // MATRIZ
        // ═══════════════════════════════════════════════════════════════════════════════════

        function renderMatrix() {
            try {
                const matrixData = currentData.filter(d => {
                    if (state.kpiFilter === 'ALL') return true;
                    const s = String(d[C.DISP] || '').toUpperCase();
                    const est = String(d[C.ESTADO] || '').toUpperCase();

                    if (state.kpiFilter === 'DISPONIBLE') return s.includes('DISPONIBLE') && !s.includes('PENDIENTE');
                    if (state.kpiFilter === 'PENDIENTE') return s.includes('PENDIENTE');
                    if (state.kpiFilter === 'ADQUIRIR') return !est.includes('CESI');
                    return true;
                });

                const states = [...new Set(matrixData.map(d => d[C.ESTADO] || 'SIN ESTADO'))].sort();
                const tramos = [...new Set(matrixData.map(d => d[C.TRAMO] || 'SIN TRAMO'))].sort();

                if (tramos.length === 0) {
                    $('#matrix-wrapper').html('<div class="text-center p-3 text-muted">No hay datos que coincidan.</div>');
                    state.matrixTotal = 0;
                    return;
                }

                const totalPages = Math.max(1, Math.ceil(tramos.length / state.matrixPageSize));
                if (state.matrixPage > totalPages) state.matrixPage = totalPages;
                const startIndex = (state.matrixPage - 1) * state.matrixPageSize;
                const pagedTramos = tramos.slice(startIndex, startIndex + state.matrixPageSize);

                let html = '<table class="table-matrix">';
                html += `<thead><tr>
                  <th rowspan="2" class="bg-head" style="width:150px; vertical-align:middle;">TRAMO</th>
                  <th colspan="${states.length}" class="bg-head text-center" style="vertical-align:middle;">ESTADOS DEL PROCESO</th>
                  <th rowspan="2" class="bg-head" style="vertical-align:middle;">TOTAL</th>
                  <th rowspan="2" class="bg-head" style="vertical-align:middle;">% DISP</th>
                </tr><tr>`;
                states.forEach(s => html += `<th class="header-col">${s.toUpperCase()}</th>`);
                html += `</tr></thead><tbody>`;

                let displayedTotal = 0;
                let colTot = new Array(states.length).fill(0);

                pagedTramos.forEach(t => {
                    const isSelected = (state.tramoFromMatrix === t) ? 'tramo-selected' : '';
                    html += `<tr><td class="col-tramo ${isSelected}" onclick="toggleMatrixTramo('${t}')">${t}</td>`;

                    const rowD = matrixData.filter(d => d[C.TRAMO] === t);
                    const rowReal = currentData.filter(d => d[C.TRAMO] === t);
                    const totR = rowReal.length;
                    const dispR = rowReal.filter(d => {
                        const s = String(d[C.DISP] || '').toUpperCase();
                        return s.includes('DISPONIBLE') && !s.includes('PENDIENTE');
                    }).length;

                    states.forEach((s, idx) => {
                        const c = rowD.filter(d => d[C.ESTADO] === s).length;
                        colTot[idx] += c;
                        const cls = c > 0 ? 'cell-val tracking-cell' : 'cell-0';
                        const txt = c > 0 ? c : '-';
                        html += `<td class="${cls}" onclick="openModal('${t}', '${s}')">${txt}</td>`;
                    });

                    html += `<td class="cell-total">${totR}</td>`;
                    const perc = totR > 0 ? (dispR / totR) * 100 : 0;
                    const color = perc < 50 ? '#c0392b' : (perc < 90 ? '#f39c12' : '#27ae60');
                    html += `<td>
                        <div style="font-weight:700; color:${color}; font-size:0.8rem">${perc.toFixed(0)}%</div>
                        <div class="prog-bg"><div class="prog-fill" style="width:${perc}%; background:${color}"></div></div>
                    </td></tr>`;

                    displayedTotal += totR;
                });

                html += `<tr class="bg-light fw-bold" style="border-top:2px solid #333"><td>TOTAL</td>`;
                colTot.forEach(c => html += `<td>${c}</td>`);
                html += `<td id="matrix-total-value" style="font-weight: 900; color: var(--accent); font-size: 1.1rem;">${displayedTotal}</td><td>-</td></tr></tbody></table>`;

                html += `<div id="matrix-pagination" class="d-flex flex-wrap justify-content-between align-items-center mt-3" style="font-size:0.9rem; gap:10px;">
                      <div class="d-flex gap-2 align-items-center flex-wrap">
                        <button class="btn btn-sm btn-secondary" onclick="setMatrixPage(${state.matrixPage - 1})" ${state.matrixPage === 1 ? 'disabled' : ''}>Anterior</button>
                        <button class="btn btn-sm btn-secondary" onclick="setMatrixPage(${state.matrixPage + 1})" ${state.matrixPage === totalPages ? 'disabled' : ''}>Siguiente</button>
                      </div>
                      <div class="d-flex gap-2 align-items-center flex-wrap">
                        <label for="matrixPageSize" class="mb-0">Filas por página:</label>
                        <select id="matrixPageSize" class="form-select form-select-sm" style="width: auto;" onchange="setMatrixPageSize(this.value)">
                          <option value="50" ${state.matrixPageSize === 50 ? 'selected' : ''}>50</option>
                          <option value="100" ${state.matrixPageSize === 100 ? 'selected' : ''}>100</option>
                          <option value="200" ${state.matrixPageSize === 200 ? 'selected' : ''}>200</option>
                        </select>
                      </div>
                      <div class="d-flex gap-2 align-items-center flex-wrap">
                        <span>Página</span>
                        <input id="matrixPageInput" type="number" min="1" max="${totalPages}" value="${state.matrixPage}" class="form-control form-control-sm" style="width: 80px;" onchange="gotoMatrixPage(this.value)">
                        <span>de ${totalPages} · Mostrando ${pagedTramos.length} de ${tramos.length} tramos</span>
                      </div>
                  </div>`;

                $('#matrix-wrapper').html(html);
                state.matrixTotal = displayedTotal;
                console.log(`✅ Matriz renderizada - Página ${state.matrixPage}/${totalPages}, registros mostrados: ${displayedTotal}`);
            } catch (e) {
                console.error('❌ Error renderizando matriz: ' + e.message);
            }
        }

        function toggleMatrixTramo(tramo) {
            if (state.tramoFromMatrix === tramo) state.tramoFromMatrix = 'ALL';
            else state.tramoFromMatrix = tramo;
            updateKPIs();
            renderMatrix();
        }

        function setMatrixPage(page) {
            const states = [...new Set(currentData.map(d => d[C.ESTADO] || 'SIN ESTADO'))].sort();
            const tramos = [...new Set(currentData.map(d => d[C.TRAMO] || 'SIN TRAMO'))].sort();
            const totalPages = Math.max(1, Math.ceil(tramos.length / state.matrixPageSize));
            if (page < 1) page = 1;
            if (page > totalPages) page = totalPages;
            if (page === state.matrixPage) return;
            state.matrixPage = page;
            renderMatrix();
        }

        function clearTramoFilter() {
            state.tramoFromMatrix = 'ALL';
            $('#tramo-alert').hide();
            updateKPIs();
            renderMatrix();
        }

        window.openModal = function(tramo, estado) {
    try {
        console.log('📋 Abriendo modal para:', tramo, estado);
        
        // ✅ GUARDAR ESTADO ANTES DE ABRIR
        saveNavigationState();

        const tableData = currentData.filter(d => {
            let passKpi = true;

            if(state.kpiFilter === 'DISPONIBLE') passKpi = s.includes('DISPONIBLE') && !s.includes('PENDIENTE');
            if(state.kpiFilter === 'PENDIENTE') passKpi = s.includes('PENDIENTE');
            if(state.kpiFilter === 'ADQUIRIR') passKpi = !est.includes('CESI');

        $('#detailTable').empty();

        let colsDef = [
            {

                defaultContent: "",
                render: function(data) {

                }
            },
            { 
                title: "DIRECCIÓN",

                render: function(data) {
                    return data || '-';
                }

                    return new Intl.NumberFormat('es-CO', { 
                        style: 'currency', 
                        currency: 'COP', 
                        maximumFractionDigits: 0 
                    }).format(num);

        if (isTrackingMode) {

                        extend: 'excelHtml5', 
                        text: '📥 Excel Completo', 
                        className: 'btn btn-success btn-sm', 
                        exportOptions: { columns: ':all' }

};

            const btn = $('#btnTrackingMode');
            
            if(isTrackingMode) {
                btn.removeClass('btn-warning').addClass('btn-danger');
                btn.html('<i class="fas fa-times-circle"></i> DESACTIVAR MODO');
                $('body').addClass('tracking-mode-active');
                showToast('✅ Modo Seguimiento ACTIVADO', 'success');
            } else {
                btn.removeClass('btn-danger').addClass('btn-warning');
                btn.html('<i class="fas fa-pen-to-square"></i> MODO SEGUIMIENTO');
                $('body').removeClass('tracking-mode-active');
                showToast('ℹ️ Modo Seguimiento DESACTIVADO', 'info');
            }
            
            console.log('🔄 Modo seguimiento:', isTrackingMode ? 'ACTIVADO' : 'DESACTIVADO');

        function openEditModal(rowData) {
    try {
        console.log('✏️ Abriendo editor para RT:', rowData[C.RT]);
        
        // ✅ Guardar datos originales
        originalData = JSON.parse(JSON.stringify(rowData));
        
        $('#trackRt').val(rowData[C.RT]);
        $('#trackRtDisplay').text(rowData[C.RT]);
        
        // ✅ FUNCIÓN MEJORADA CON OPCIÓN "AGREGAR NUEVO"
        const fillSelectWithNew = (selectId, listKey, currentValue) => {
            const $select = $('#' + selectId);
            $select.empty();
            
            // Agregar opción vacía
            $select.append('<option value="">-- Seleccionar --</option>');
            
            // Buscar la clave correcta (case-insensitive)
            let options = [];
            const keys = Object.keys(currentDropdowns);
            const matchingKey = keys.find(k => k.toLowerCase() === listKey.toLowerCase());
            
            if (matchingKey) {
                options = currentDropdowns[matchingKey] || [];
            }
            
            // Agregar todas las opciones de la lista
            options.forEach(opt => {
                $select.append(`<option value="${opt}">${opt}</option>`);
            });
            
            // ✅ AGREGAR OPCIÓN "CREAR NUEVO..."
            $select.append(`<option value="__NEW__" style="background: #e8f5e9; font-weight: bold; color: #27ae60;">➕ Agregar nuevo...</option>`);
            
            // Si el valor actual NO está en la lista, agregarlo
            if (currentValue && currentValue.trim() !== '' && !options.includes(currentValue)) {
                console.log(`⚠️ Agregando valor no listado en ${selectId}: "${currentValue}"`);
                $select.append(`<option value="${currentValue}">${currentValue} ⚠️</option>`);
            }
            
            // Seleccionar el valor actual
            if (currentValue && currentValue.trim() !== '') {
                $select.val(currentValue);
            }
            
            // ✅ EVENTO PARA DETECTAR "AGREGAR NUEVO"
            $select.off('change').on('change', function() {
                if ($(this).val() === '__NEW__') {
                    promptNewValue(selectId, listKey, currentValue);
                }
            });
            
            console.log(`✅ ${selectId} configurado con: "${currentValue}"`);
        };
        
        // ✅ FUNCIÓN PARA SOLICITAR NUEVO VALOR
        const promptNewValue = (selectId, listKey, previousValue) => {
            const $select = $('#' + selectId);
            const fieldName = $select.prev('label').text() || selectId;
            
            // Crear modal personalizado
            const modalHtml = `
                <div class="modal fade" id="newValueModal" tabindex="-1" data-bs-backdrop="static">

                        <div class="modal-content">
                            <div class="modal-header bg-success text-white">

                                    <i class="fas fa-plus-circle"></i> Agregar Nuevo Valor

                                           id="newValueInput"

                                </div>

                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                                    <i class="fas fa-times"></i> Cancelar
                                </button>
                                <button type="button" class="btn btn-success" id="btnSaveNewValue">
                                    <i class="fas fa-check"></i> Agregar
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            // Eliminar modal anterior si existe
            $('#newValueModal').remove();
            
            // Agregar modal al DOM
            $('body').append(modalHtml);
            
            // Mostrar modal
            const modal = new bootstrap.Modal(document.getElementById('newValueModal'));
            modal.show();
            
            // Focus en el input
            $('#newValueModal').on('shown.bs.modal', function() {
                $('#newValueInput').focus();
            });
            
            // Evento del botón "Agregar"
            $('#btnSaveNewValue').off('click').on('click', function() {

                    showToast('⚠️ Debes ingresar un valor', 'warning');

                // Agregar la nueva opción al select
                $select.find('option[value="__NEW__"]').before(

                );
                
                // Seleccionar el nuevo valor

                // Si se marcó "guardar en lista", actualizar el dropdown global
                if (saveToList) {
                    const keys = Object.keys(currentDropdowns);

                    if (matchingKey && currentDropdowns[matchingKey]) {
                        if (!currentDropdowns[matchingKey].includes(newValue)) {
                            currentDropdowns[matchingKey].push(newValue);

                            // Guardar en servidor (opcional)
                            try {
                                google.script.run
                                    .withSuccessHandler(function(result) {
                                        if (result.success) {
                                            console.log('✅ Nuevo valor guardado en servidor');
                                        }
                                    })
                                    .withFailureHandler(function(error) {
                                        console.warn('⚠️ No se pudo guardar en servidor:', error.message);
                                    })

        function toggleDetailField(fieldName) {
            let visibleFields = JSON.parse(localStorage.getItem('rtDetailFields') || '[]');
            
            if (visibleFields.includes(fieldName)) {
                visibleFields = visibleFields.filter(f => f !== fieldName);
            } else {
                visibleFields.push(fieldName);
            }
            
            localStorage.setItem('rtDetailFields', JSON.stringify(visibleFields));
            console.log('💾 Campos guardados:', visibleFields);
            
            const rtNumber = document.getElementById('detailRtNumber').textContent;
            openRtDetailModule(rtNumber);
        }

            localStorage.removeItem('rtDetailFields');
            const rtNumber = document.getElementById('detailRtNumber').textContent;
            openRtDetailModule(rtNumber);
            showToast('✅ Campos restaurados', 'success');
        }

/**
 * ✅ Muestra alerta
 */
function showAlert(message, type = 'info') {
    try {
        type = type || 'info';
        const alertClass = `alert-${type}`;
        
        const alertHtml = `
            <div class="alert alert-custom ${alertClass}" style="position: fixed; top: 100px; right: 20px; z-index: 9999; min-width: 300px; animation: slideIn 0.3s ease;">
                <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'danger' ? 'exclamation-circle' : type === 'warning' ? 'exclamation-triangle' : 'info-circle'}"></i>
                <div>
                    <strong>${type.toUpperCase()}</strong>
                    <p style="margin: 5px 0 0 0; font-size: 0.9rem;">${message}</p>
                </div>
            </div>
        `;
        
        const alertContainer = document.createElement('div');
        alertContainer.innerHTML = alertHtml;
        document.body.appendChild(alertContainer.firstElementChild);
        
        setTimeout(() => {
            const alert = document.body.lastElementChild;
            if (alert && alert.classList.contains('alert-custom')) {
                alert.style.opacity = '0';
                alert.style.transition = 'opacity 0.3s ease';
                setTimeout(() => alert.remove(), 300);
            }
        }, 3000);
        
        console.log(`[${type.toUpperCase()}] ${message}`);
    } catch (e) {
        console.error('❌ Error mostrando alerta:', e.message);
    }
}

 * ✅ Muestra notificación (alternativa a showAlert)
 */

        function generatePdfReport() {
            $('#loader').fadeIn().find('.loader-text').text('Generando Reporte PDF en servidor...');

            try {
                const matrixData = currentData.filter(d => {
                    if(state.kpiFilter === 'ALL') return true;
                    const s = String(d[C.DISP] || "").toUpperCase();
                    const est = String(d[C.ESTADO] || "").toUpperCase();
                    
                    if(state.kpiFilter === 'DISPONIBLE') return s.includes('DISPONIBLE') && !s.includes('PENDIENTE');
                    if(state.kpiFilter === 'PENDIENTE') return s.includes('PENDIENTE');
                    if(state.kpiFilter === 'ADQUIRIR') return !est.includes('CESI');
                    return true;
                });

                const states = [...new Set(matrixData.map(d => d[C.ESTADO] || 'SIN ESTADO'))].sort();
                const tramos = [...new Set(matrixData.map(d => d[C.TRAMO] || 'SIN TRAMO'))].sort();

                pdfDataStructure = {
                    filtros: {
                        agrupacion: window.filtroMatrizActivoGlobal ? window.filtroMatrizActivoGlobal.nombre : 'Ninguna', // <- LÍNEA NUEVA
                        proyecto: state.selProyecto === 'ALL' ? 'Todos' : state.selProyecto,
                        tramo: state.selTramo === 'ALL' ? 'Todos' : state.selTramo,
                        fecha: state.dateLimit || 'Sin especificar',
                        modo: state.dateMode,
                        kpi: state.kpiFilter === 'ALL' ? 'Todos' : state.kpiFilter
                    },
                    matriz: {
                        states: states,
                        tramos: tramos,
                        data: []
                    },
                    detalles: [],
                    seguimientoData: seguimientoData
                };

                let gTotal = 0;
                let colTot = new Array(states.length).fill(0);

                tramos.forEach((t, tIdx) => {
                    const rowD = matrixData.filter(d => d[C.TRAMO] === t);
                    const rowReal = currentData.filter(d => d[C.TRAMO] === t);
                    let totR = rowReal.length;
                    let dispR = rowReal.filter(d => {
                        const s = String(d[C.DISP] || "").toUpperCase();
                        return s.includes('DISPONIBLE') && !s.includes('PENDIENTE');
                    }).length;

                    let rowData = { tramo: t, valores: [], total: totR, percDisp: 0 };

                    states.forEach((s, idx) => {
                        const c = rowD.filter(d => d[C.ESTADO] === s).length;
                        colTot[idx] += c;
                        rowData.valores.push({ count: c, estado: s, tramoIdx: tIdx, estadoIdx: idx });
                    });

                    const perc = totR > 0 ? (dispR/totR)*100 : 0;
                    rowData.percDisp = perc;

                    pdfDataStructure.matriz.data.push(rowData);
                    gTotal += totR;
                });

                pdfDataStructure.matriz.colTotales = colTot;
                pdfDataStructure.matriz.granTotal = gTotal;

                tramos.forEach((t, tIdx) => {
                    states.forEach((s, sIdx) => {
                        const detailData = currentData.filter(d => {
                            let passKpi = true;
                            const est = String(d[C.ESTADO] || "").toUpperCase();
                            const disp = String(d[C.DISP] || "").toUpperCase();

                            if(state.kpiFilter === 'DISPONIBLE') passKpi = disp.includes('DISPONIBLE') && !disp.includes('PENDIENTE');
                            if(state.kpiFilter === 'PENDIENTE') passKpi = disp.includes('PENDIENTE');
                            if(state.kpiFilter === 'ADQUIRIR') passKpi = !est.includes('CESI');
                            
                            return d[C.TRAMO] === t && d[C.ESTADO] === s && passKpi;
                        });

                        if (detailData.length > 0) {
                            pdfDataStructure.detalles.push({
                                tramo: t,
                                estado: s,

                                estadoIdx: sIdx,

                                        observaciones: obsToUse,

                                    };
                                })
                            });
                        }
                    });
                });

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast('✅ Enlace copiado al portapapeles', 'success');
            }).catch(err => {
                console.error('Error copiando:', err);
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast('✅ Enlace copiado', 'success');
            });
        }

        function searchRTDetails() {
            try {
                const rtInput = $('#searchRT').val().trim().toUpperCase();
                if (!rtInput) {
                    showNotification('Error', 'Ingresa un número RT', 'danger');
                    return;
                }

                // --- BÚSQUEDA INTELIGENTE EN TODA LA BASE ---
                const row = rawData.find(r => {
                    const rtDb = String(r[C.RT] || '').toUpperCase().trim();
                    return rtDb === rtInput || rtDb.includes(rtInput); // Encuentra exacto o si lo contiene
                });

                if (!row) {
                    showNotification('Error', 'RT ' + rtInput + ' no encontrado en la base de datos.', 'danger');
                    return;
                }

                let html = '';

                // --- NUEVO: ALERTA PARA PREDIOS INACTIVOS ---
                const estadoActivo = String(row['ACTIVO/INACTIVO'] || "").toUpperCase().trim();
                if (estadoActivo === 'INACTIVO' || estadoActivo === 'NO ACTIVO') {
                    const observacion = row['OBSERVACIONES'] || row['OBS'] || row['SITUACIONES ESPECIALES'] || 'Predio retirado del proceso.';
                    html += `
                    <div class="alert alert-danger fw-bold shadow-sm mb-3" style="border-left: 5px solid darkred;">
                        <i class="fas fa-exclamation-triangle fa-2x float-start me-3"></i>
                        <h5 class="alert-heading text-danger">ATENCIÓN: PREDIO INACTIVO</h5>
                        <p class="mb-0 text-dark"><strong>Motivo / Observación:</strong> ${escapeHtml(observacion)}</p>
                    </div>`;
                }
                // --------------------------------------------

                html += '<div class="card shadow-sm"><div class="card-body p-0"><table class="table table-bordered table-striped m-0">';
                for (let key in row) {
                    // No mostramos campos técnicos internos al usuario
                    if (key !== 'FECHA_ISO' && key !== '_FILE_ID') {
                        html += '<tr><td style="font-weight: 700; width: 35%; background-color:#f8f9fa;">' + escapeHtml(key) + '</td><td>' + escapeHtml(row[key] || '-') + '</td></tr>';
                    }
                }
                html += '</table></div></div>';

                $('#detailsContainer').html(html);
                console.log('📋 Detalles encontrados para RT: ' + row[C.RT]);
                
                // Limpia la barra de búsqueda para la próxima consulta
                $('#searchRT').val('');
                
            } catch (e) {
                console.error('❌ Error buscando RT: ' + e.message);
                showNotification('Error', 'Hubo un problema procesando la búsqueda.', 'danger');
            }
        }

let agrupacionesGlobal = [];

function cargarFiltrosMatriz() {
  google.script.run
    .withSuccessHandler(response => {
      agrupacionesGlobal = typeof response === 'string' ? JSON.parse(response) : response || [];
      mostrarFiltrosMatriz(agrupacionesGlobal);
      
      // Actualizar info del filtro activo en pantalla (Persistente)
      const filtro = window.filtroMatrizActivoGlobal;
      if (filtro && filtro.id) {
        document.getElementById('filtroActivoBox').style.display = 'flex';
        document.getElementById('filtroActivoNombre').textContent = filtro.nombre;
        document.getElementById('filtroActivoDesc').textContent = filtro.descripcion || '';
        const proys = (filtro.proyectosIncluidos && filtro.proyectosIncluidos.length > 0) ? filtro.proyectosIncluidos.join(', ') : 'Todos (o excluidos)';
        document.getElementById('filtroActivoProyectos').textContent = `Proyectos: ${proys}`;
      } else {
        document.getElementById('filtroActivoBox').style.display = 'none';
      }
      
      // Renderizar las listas de checkboxes
      renderProyectosCheckboxes();
    })
    .getFiltrosMatriz();
}

function mostrarFiltrosMatriz(filtros) {
  const tbody = document.getElementById('filtrosMatrizBody');
  // Ocultamos el filtro rápido de la tabla para que no ensucie la vista de "Agrupaciones"
  const agrupacionesReales = filtros.filter(f => f.nombre !== 'FILTRO MANUAL VISTA RÁPIDA');
  
  if (!agrupacionesReales || agrupacionesReales.length === 0) {
    tbody.innerHTML = `<tr><td colspan="5" class="no-data"><i class="fas fa-inbox"></i><p>No hay agrupaciones creadas</p></td></tr>`;
    return;
  }
  
  tbody.innerHTML = agrupacionesReales.map(filtro => {
    const count = filtro.proyectosIncluidos ? filtro.proyectosIncluidos.length : 0;
    const esActivo = window.filtroMatrizActivoGlobal && window.filtroMatrizActivoGlobal.id === filtro.id;

    return `
      <tr>
        <td><strong>${filtro.nombre || '-'}</strong></td>
        <td>${filtro.descripcion || '-'}</td>
        <td><span class="badge bg-info text-dark">${count} Proyectos</span></td>
        <td>
          ${esActivo ? 
            '<span class="badge bg-success py-1"><i class="fas fa-check-circle"></i> ACTIVO</span>' : 
            '<span class="badge bg-secondary py-1">Inactivo</span>'}
        </td>
        <td>
          <div class="btn-group btn-group-sm">
            ${!esActivo ? 
              `<button class="btn btn-success fw-bold" onclick="activarAgrupacion('${filtro.id}')" title="Activar Agrupación">
                <i class="fas fa-play"></i> Activar
              </button>` : 
              `<button class="btn btn-outline-secondary fw-bold" disabled>En uso</button>`}
            <button class="btn btn-outline-primary" onclick="abrirEditarFiltroModal('${filtro.id}')" title="Editar"><i class="fas fa-edit"></i></button>
            <button class="btn btn-outline-danger" onclick="eliminarAgrupacion('${filtro.id}')" title="Eliminar"><i class="fas fa-trash"></i></button>
          </div>
        </td>
      </tr>
    `;
  }).join('');
}

// ✅ RENDERIZAR CHECKBOXES
function renderProyectosCheckboxes() {
  const listaProyectos = window.proyectosListaUnicaGlobal || [];
  const containerAdhoc = document.getElementById('proyectosAdhocContainer');
  const containerNuevo = document.getElementById('proyectosNuevoContainer');
  
  if (!containerAdhoc || !containerNuevo) return;

  if (listaProyectos.length === 0) {
    containerAdhoc.innerHTML = '<p class="text-muted small">No hay proyectos en la base de datos.</p>';
    containerNuevo.innerHTML = '<p class="text-muted small">No hay proyectos en la base de datos.</p>';
    return;
  }

  // Saber qué marcar en el panel Ad-hoc (El filtro persistente)
  let proyectosActivos = listaProyectos; // Por defecto marcamos todos
  if (window.filtroMatrizActivoGlobal && window.filtroMatrizActivoGlobal.proyectosIncluidos && window.filtroMatrizActivoGlobal.proyectosIncluidos.length > 0) {
      proyectosActivos = window.filtroMatrizActivoGlobal.proyectosIncluidos;
  }

  containerAdhoc.innerHTML = listaProyectos.map(p => `
    <div class="form-check" style="background: white; padding: 6px 10px 6px 30px; border: 1px solid #eee; border-radius: 4px;">
      <input class="form-check-input chk-adhoc" type="checkbox" id="ad_${p.replace(/\s+/g, '_')}" value="${p}" 
             ${proyectosActivos.includes(p) ? 'checked' : ''}>
      <label class="form-check-label w-100 cursor-pointer" for="ad_${p.replace(/\s+/g, '_')}" style="font-size:0.8rem; font-weight:600;">${p}</label>
    </div>
  `).join('');

  containerNuevo.innerHTML = listaProyectos.map(p => `
    <div class="form-check" style="background: white; padding: 6px 10px 6px 30px; border: 1px solid #eee; border-radius: 4px;">
      <input class="form-check-input chk-nuevo" type="checkbox" id="nw_${p.replace(/\s+/g, '_')}" value="${p}">
      <label class="form-check-label w-100 cursor-pointer" for="nw_${p.replace(/\s+/g, '_')}" style="font-size:0.8rem; font-weight:600;">${p}</label>
    </div>
  `).join('');
}

function marcarAdhoc(estado) { document.querySelectorAll('.chk-adhoc').forEach(c => c.checked = estado); }
function marcarNuevo(estado) { document.querySelectorAll('.chk-nuevo').forEach(c => c.checked = estado); }

// ✅ APLICAR FILTRO RÁPIDO (GUARDA EN BD PARA TODOS LOS USUARIOS)
function aplicarFiltroAdhoc() {
  const incluidos = Array.from(document.querySelectorAll('.chk-adhoc:checked')).map(cb => cb.value);
  if (incluidos.length === 0) return showAlert('Debes seleccionar al menos un proyecto', 'warning');

  showLoader('Guardando filtro para todos los usuarios...');
  google.script.run
    .withSuccessHandler(res => {
      if (res.success) {
        showAlert('Filtro Principal guardado y aplicado a la Base de Datos', 'success');
        loadDashboardData(); // Refresca completamente todo desde el servidor
      } else {
        hideLoader();
        showAlert('Error: ' + res.error, 'danger');
      }
    })
    .withFailureHandler(err => { hideLoader(); showAlert('Error: '+err.message, 'danger'); })
    .guardarYActivarFiltroManual(incluidos, currentUser);
}

// ✅ RESTABLECER Y MOSTRAR TODO (QUITA FILTRO EN BD PARA TODOS)
function restablecerFiltroAdhoc() {
  showLoader('Restableciendo vista global (Mostrando Todos)...');
  google.script.run
    .withSuccessHandler(res => {
        showAlert('Filtro eliminado. Se han cargado todos los proyectos.', 'success');
        loadDashboardData(); // Refresca y trae todos los registros
    })
    .withFailureHandler(err => { hideLoader(); showAlert('Error: '+err.message, 'danger'); })
    .activarFiltroMatriz('', currentUser);
}

// ✅ CREAR NUEVA AGRUPACIÓN (SOLO LA GUARDA, NO LA ACTIVA)
function guardarNuevaAgrupacion() {
  const nombre = document.getElementById('filtroNombre').value.trim();
  const desc = document.getElementById('filtroDescripcion').value.trim();
  if (!nombre) return showAlert('El nombre es obligatorio', 'warning');

  const incluidos = Array.from(document.querySelectorAll('.chk-nuevo:checked')).map(cb => cb.value);
  if (incluidos.length === 0) return showAlert('Selecciona al menos un proyecto para la agrupación', 'warning');

  showLoader('Guardando Agrupación...');
  google.script.run
    .withSuccessHandler(res => {
      hideLoader();
      let result = typeof res === 'string' ? JSON.parse(res) : res;
      if (result.success) {
        showAlert('Agrupación guardada exitosamente', 'success');
        document.getElementById('filtroNombre').value = '';
        document.getElementById('filtroDescripcion').value = '';
        marcarNuevo(false);
        cargarFiltrosMatriz();
      } else {
        showAlert('Error: ' + result.error, 'danger');
      }
    })
    .withFailureHandler(err => { hideLoader(); showAlert('Error: '+err.message, 'danger'); })
    .crearFiltroMatriz(nombre, desc, incluidos, [], currentUser);
}

// ✅ ACTIVAR AGRUPACIÓN DE LA TABLA (SE GUARDA PARA TODOS)
function activarAgrupacion(id) {
  showLoader('Aplicando agrupación a la Base de Datos...');
  google.script.run
    .withSuccessHandler(res => {
      let result = typeof res === 'string' ? JSON.parse(res) : res;
      if (result.success) {
        showAlert(`Agrupación activada para todos los usuarios`, 'success');
        loadDashboardData(); // Descarga todo de nuevo ya filtrado
      }
    })
    .withFailureHandler(err => { hideLoader(); showAlert('Error: '+err.message, 'danger'); })
    .activarFiltroMatriz(id, currentUser);
}

function desactivarFiltroMatriz() {
    restablecerFiltroAdhoc(); // Reutiliza la función de limpiar
}

// ✅ ELIMINAR AGRUPACIÓN DE LA TABLA
function eliminarAgrupacion(id) {
  if (!confirm('¿Seguro que deseas eliminar esta agrupación de forma permanente?')) return;
  
  showLoader('Eliminando...');
  google.script.run
    .withSuccessHandler(res => {
      let result = typeof res === 'string' ? JSON.parse(res) : res;
      if (result.success) {
        showAlert('Agrupación eliminada', 'success');
        if (window.filtroMatrizActivoGlobal && window.filtroMatrizActivoGlobal.id === id) {
            restablecerFiltroAdhoc(); // Si eliminó la que estaba activa, restablece a Todos
        } else {
            hideLoader();
            cargarFiltrosMatriz();
        }
      }
    })
    .withFailureHandler(err => { hideLoader(); showAlert('Error: '+err.message, 'danger'); })
    .eliminarFiltroMatriz(id, currentUser);
}

// Editar existente
function abrirEditarFiltroModal(filtroId) {
  const filtro = agrupacionesGlobal.find(f => f.id === filtroId);
  if (!filtro) return;
  
  document.getElementById('editFiltroId').value = filtro.id;
  document.getElementById('editFiltroNombre').value = filtro.nombre;
  document.getElementById('editFiltroDescripcion').value = filtro.descripcion || '';
  
  const container = document.getElementById('editProyectosContainer');
  const listaProyectos = window.proyectosListaUnicaGlobal || [];
  
  container.innerHTML = listaProyectos.map(p => `
    <div class="form-check" style="background: white; padding: 6px 10px 6px 30px; border: 1px solid #eee; border-radius: 4px;">
      <input class="form-check-input chk-edit-proyecto" type="checkbox" id="ed_${p.replace(/\s+/g, '_')}" value="${p}"
             ${(filtro.proyectosIncluidos || []).includes(p) ? 'checked' : ''}>
      <label class="form-check-label w-100 cursor-pointer" for="ed_${p.replace(/\s+/g, '_')}" style="font-size:0.8rem; font-weight:600;">${p}</label>
    </div>
  `).join('');
  
  new bootstrap.Modal(document.getElementById('editarFiltroModal')).show();
}

function guardarEditarFiltroMatriz() {
  const id = document.getElementById('editFiltroId').value;
  const nombre = document.getElementById('editFiltroNombre').value.trim();
  const descripcion = document.getElementById('editFiltroDescripcion').value.trim();
  if (!nombre) return showAlert('El nombre es requerido', 'warning');

  const incluidos = Array.from(document.querySelectorAll('.chk-edit-proyecto:checked')).map(cb => cb.value);
  if (incluidos.length === 0) return showAlert('Debes seleccionar al menos un proyecto', 'warning');

  showLoader('Actualizando...');
  google.script.run
    .withSuccessHandler(res => {
      let result = typeof res === 'string' ? JSON.parse(res) : res;
      if (result.success) {
        bootstrap.Modal.getInstance(document.getElementById('editarFiltroModal')).hide();
        if (window.filtroMatrizActivoGlobal && window.filtroMatrizActivoGlobal.id === id) {
            showAlert('Agrupación actualizada. Recargando datos...', 'success');
            loadDashboardData();
        } else {
            hideLoader();
            showAlert('Actualizado exitosamente', 'success');
            cargarFiltrosMatriz();
        }
      }
    })
    .withFailureHandler(err => { hideLoader(); showAlert('Error: ' + err.message, 'danger'); })
    .actualizarFiltroMatriz(id, nombre, descripcion, incluidos, [], currentUser);
}

function refreshFiltrosMatriz() {
  cargarFiltrosMatriz();
}
